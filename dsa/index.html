<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据结构与算法 A · 复习资料</title>
<meta name="description" content="数据结构与算法 A 期中、期末复习资料入口。">
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef2f9;
    --bg-accent: #dde6f5;
    --surface: #ffffff;
    --surface-soft: #f6f8fc;
    --text: #172033;
    --muted: #5f6b82;
    --line: #d9e1ee;
    --accent: #3b5bdb;
    --accent-soft: #e6ecff;
    --shadow: 0 18px 45px rgba(24, 42, 80, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420;
      --bg-accent: #151d2d;
      --surface: #171f2e;
      --surface-soft: #1c2638;
      --text: #e8edf7;
      --muted: #98a5bb;
      --line: #2b374c;
      --accent: #8fa8ff;
      --accent-soft: #222f4d;
      --shadow: 0 18px 45px rgba(0, 0, 0, .32);
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    padding: 48px 20px 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(900px 480px at 15% -10%, var(--accent-soft), transparent 65%),
      radial-gradient(800px 420px at 100% 110%, var(--bg-accent), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    line-height: 1.65;
  }
  main { width: min(880px, 100%); }
  .eyebrow {
    display: inline-block;
    padding: 5px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: 13px;
    letter-spacing: .08em;
  }
  h1 {
    margin: 18px 0 10px;
    font-size: clamp(30px, 5vw, 46px);
    line-height: 1.2;
    letter-spacing: -.02em;
  }
  h1 small {
    display: block;
    margin-top: 8px;
    color: var(--muted);
    font-size: clamp(15px, 2.2vw, 18px);
    font-weight: 500;
    letter-spacing: 0;
  }
  .intro {
    max-width: 62ch;
    margin: 0 0 30px;
    color: var(--muted);
    font-size: 15px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
  }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 210px;
    padding: 24px 24px 22px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 24px 55px rgba(24, 42, 80, .16);
    outline: none;
  }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .tag {
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
  }
  .tag.soon { background: var(--surface-soft); color: var(--muted); }
  .num {
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    letter-spacing: .12em;
  }
  .card h2 {
    margin: 20px 0 8px;
    font-size: 24px;
    line-height: 1.3;
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: auto;
    padding-top: 22px;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
  }
  .card.is-soon .card-foot { color: var(--muted); }
  .arrow { font-size: 18px; line-height: 1; }
  footer {
    margin-top: 28px;
    color: var(--muted);
    font-size: 13px;
  }
  footer a { color: inherit; }
  @media (max-width: 540px) {
    body { padding: 32px 16px; align-items: flex-start; }
    .card { min-height: 190px; }
  }
</style>
</head>
<body>
<main>
  <span class="eyebrow">数据结构与算法 A</span>
  <h1>复习资料<small>课件知识点 · 作业题解 · 考前速查</small></h1>
  <p class="intro">按考试阶段整理的静态复习站，支持关键词搜索、题目自测与课件原文查看。选择下方入口开始复习。</p>

  <div class="cards">
    <a class="card" href="midterm/">
      <div class="card-top">
        <span class="tag">已上线</span>
        <span class="num">MIDTERM</span>
      </div>
      <h2>期中复习</h2>
      <p>覆盖前七章与作业、OJ 实战，含知识点、完整题目解答与逐页课件文字。</p>
      <div class="card-foot"><span>进入复习站</span><span class="arrow" aria-hidden="true">→</span></div>
    </a>

    <a class="card is-soon" href="final/">
      <div class="card-top">
        <span class="tag soon">暂未上线</span>
        <span class="num">FINAL</span>
      </div>
      <h2>期末复习</h2>
      <p>期末阶段的整理内容正在准备中，入口预留，上线后可直接访问。</p>
      <div class="card-foot"><span>敬请期待</span><span class="arrow" aria-hidden="true">→</span></div>
    </a>
  </div>

  <footer>资料仅供个人复习使用。返回 <a href="../">Sept 主页</a>。</footer>
</main>
</body>
</html>
