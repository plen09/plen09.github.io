<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ICS 默写台 · 第二次阶段测验</title>
<style>
:root{
  --bg:#f5f6fa; --panel:#ffffff; --panel-2:#fbfcfe;
  --ink:#1b2333; --ink-2:#3d4757; --muted:#727c8f;
  --line:#e4e8f0; --line-2:#eef1f6;
  --accent:#2f6fed; --accent-2:#1b54c8; --accent-soft:#eaf1ff;
  --ok:#12855f; --ok-soft:#e6f6ef;
  --bad:#c0392b; --bad-soft:#fdecea;
  --warn:#c9701b; --warn-soft:#fdf0e2;
  --code-bg:#f6f8fb; --code-ink:#243044;
  --radius:14px; --radius-s:9px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --shadow:0 1px 2px rgba(21,32,56,.05),0 8px 24px -18px rgba(21,32,56,.35);
}
html[data-theme="dark"]{
  --bg:#10131a; --panel:#171c25; --panel-2:#141922;
  --ink:#e7ebf3; --ink-2:#c3cad8; --muted:#8e99ad;
  --line:#28303d; --line-2:#212836;
  --accent:#7ba4ff; --accent-2:#9cbcff; --accent-soft:#1b2540;
  --ok:#4cc79a; --ok-soft:#12291f;
  --bad:#f08a80; --bad-soft:#2c1715;
  --warn:#e8a25c; --warn-soft:#2c2115;
  --code-bg:#0d1117; --code-ink:#d6dbe6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
code,kbd,.mono{font-family:var(--mono)}
kbd{
  font-size:11.5px; padding:1px 5px; border:1px solid var(--line);
  border-bottom-width:2px; border-radius:5px; background:var(--panel-2); color:var(--muted);
}
button{
  font:inherit; font-size:13.5px; cursor:pointer; color:var(--ink);
  background:var(--panel-2); border:1px solid var(--line);
  border-radius:var(--radius-s); padding:7px 13px; transition:background .12s,border-color .12s,color .12s;
}
button:hover{background:var(--accent-soft); border-color:var(--accent)}
button:active{transform:translateY(.5px)}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
button.primary:hover{background:var(--accent-2); border-color:var(--accent-2); color:#fff}
button.ghost{background:transparent}
button.small{padding:4px 9px; font-size:12.5px; border-radius:7px}
button:disabled{opacity:.5; cursor:default; transform:none}
input[type="text"]{
  font:inherit; font-size:13.5px; color:var(--ink);
  background:var(--panel-2); border:1px solid var(--line);
  border-radius:var(--radius-s); padding:6px 10px; outline:none;
}
input[type="text"]:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1400px; margin:0 auto; padding:10px 18px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{display:flex; flex-direction:column; gap:1px; min-width:210px}
.brand b{font-size:16px; letter-spacing:.2px}
.brand span{font-size:12px; color:var(--muted)}
.spacer{flex:1 1 auto}
.chip{
  display:inline-flex; align-items:center; gap:5px;
  padding:2px 9px; border-radius:999px; font-size:12px; line-height:1.7;
  background:var(--accent-soft); color:var(--accent-2); border:1px solid transparent;
  white-space:nowrap;
}
.chip.muted{background:var(--line-2); color:var(--muted)}
.chip.ok{background:var(--ok-soft); color:var(--ok)}
.chip.warn{background:var(--warn-soft); color:var(--warn)}
.chip.mono{font-family:var(--mono)}
.brand-badge{
  display:inline-flex; align-items:center; padding:3px 12px; border-radius:999px;
  font-size:12.5px; font-weight:600; white-space:nowrap;
  background:var(--accent-soft); color:var(--accent-2); border:1px solid var(--accent);
}
.countdown{font-variant-numeric:tabular-nums; font-weight:600}

/* ---------- 布局 ---------- */
.layout{
  max-width:1400px; margin:18px auto 70px; padding:0 18px;
  display:grid; grid-template-columns:252px minmax(0,1fr); gap:18px;
  align-items:start;
}
.sidebar{
  position:sticky; top:70px;
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:12px 10px; display:flex; flex-direction:column; gap:12px;
}
.side-title{
  font-size:11.5px; font-weight:700; letter-spacing:.09em; color:var(--muted);
  text-transform:uppercase; padding:0 8px;
}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{
  text-align:left; background:transparent; border:1px solid transparent;
  padding:8px 10px; border-radius:8px; color:var(--ink-2); font-size:13.5px;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.nav button:hover{background:var(--line-2); border-color:transparent}
.nav button.active{background:var(--accent-soft); color:var(--accent-2); font-weight:600}
.nav .n-count{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.nav button.active .n-count{color:var(--accent-2)}
.side-opt{
  display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted);
  padding:3px 8px; cursor:pointer; user-select:none;
}
.side-opt input{accent-color:var(--accent)}
.side-sep{height:1px; background:var(--line-2); margin:0 2px}
.progress-wrap{padding:0 8px}
.progress{height:7px; border-radius:999px; background:var(--line-2); overflow:hidden}
.progress i{display:block; height:100%; width:0; background:var(--accent); border-radius:999px; transition:width .3s}
.progress-txt{font-size:12px; color:var(--muted); margin-top:5px; display:flex; justify-content:space-between}
.side-note{font-size:12px; color:var(--muted); padding:0 8px; margin:0; line-height:1.65}

/* ---------- 卡片 ---------- */
.card{
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:20px 22px; margin-bottom:16px;
}
.card.tight{padding:14px 16px}
.card-head{display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:4px}
.card-title{font-size:19px; font-weight:700; letter-spacing:.2px; margin:0}
.card-sub{color:var(--muted); font-size:13px; margin:2px 0 0}
.card-head .spacer{flex:1 1 auto}
.hr{height:1px; background:var(--line-2); margin:14px 0}

/* ---------- 指令卡 ---------- */
.instr-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:2px}
.instr-name{font-family:var(--mono); font-size:22px; font-weight:700; letter-spacing:.2px}
.instr-tip{font-size:13px; color:var(--muted); margin:4px 0 0}

table.fedmw{width:100%; border-collapse:separate; border-spacing:0; margin-top:10px}
table.fedmw th{
  text-align:left; font-size:11.5px; font-weight:700; letter-spacing:.06em;
  color:var(--muted); text-transform:uppercase; padding:6px 10px;
  border-bottom:1px solid var(--line);
}
table.fedmw td{padding:11px 10px; border-bottom:1px solid var(--line-2); vertical-align:top}
table.fedmw tr:last-child td{border-bottom:0}
table.fedmw td.stage{width:118px; white-space:nowrap}
.stage-ab{font-family:var(--mono); font-weight:700; font-size:14px; color:var(--accent-2)}
.stage-cn{font-size:11.5px; color:var(--muted); margin-left:6px}
.op-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:3px 0}
.lhs{font-family:var(--mono); font-size:13.5px; color:var(--ink-2)}
.arrow{color:var(--muted); font-size:13px}
.blank{
  font-family:var(--mono); font-size:13.5px; color:var(--ink);
  background:var(--panel-2); border:1px solid var(--line);
  border-radius:7px; padding:5px 9px; outline:none; min-width:86px;
  transition:border-color .12s,background .12s,box-shadow .12s;
}
.blank:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.blank.ok{border-color:var(--ok); background:var(--ok-soft)}
.blank.bad{border-color:var(--bad); background:var(--bad-soft)}
.blank.revealed{border-style:dashed; border-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
.ans{font-family:var(--mono); font-size:12.5px; color:var(--ok); white-space:pre-wrap}
.ans[hidden]{display:none}
.none{color:var(--muted); font-size:13px}
.op-note{font-size:12px; color:var(--muted)}

/* ---------- 阶段判断 ---------- */
.gate{
  margin-top:12px; padding:13px 15px;
  border:1px solid var(--line); border-radius:12px; background:var(--panel-2);
}
.gate.done{border-color:color-mix(in srgb, var(--ok) 38%, var(--line)); background:var(--ok-soft)}
.gate-head{display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:13.5px}
.gate-sub{font-size:12.5px; color:var(--muted); margin:4px 0 10px}
.gate-note{font-size:12.5px; color:var(--muted)}
.gate-stages{display:flex; gap:7px; flex-wrap:wrap}
.gate-cc{
  margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.gate-label{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.04em}
.gstage{
  display:inline-flex; align-items:baseline; gap:6px;
  padding:6px 11px; border-radius:9px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink-2); font-size:12.5px;
}
.gstage b{font-family:var(--mono); font-size:13.5px}
.gstage span{font-size:11.5px; color:var(--muted)}
button.gstage:hover{border-color:var(--accent); background:var(--accent-soft)}
.gstage.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-2); font-weight:600}
.gstage.good{border-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
.gstage.bad{border-color:var(--bad); background:var(--bad-soft); color:var(--bad); text-decoration:line-through}
.gstage.miss{border-color:var(--warn); background:var(--warn-soft); color:var(--warn); border-style:dashed}
.gstage.good span,.gstage.bad span,.gstage.miss span{color:inherit; opacity:.8}
.locked-box{
  margin-top:14px; padding:22px 16px; text-align:center;
  border:1px dashed var(--line); border-radius:12px; background:var(--panel-2);
}
.locked-box b{display:block; font-size:14px; margin-bottom:3px}
.locked-box span{font-size:12.5px; color:var(--muted)}

/* ---------- 操作区 ---------- */
.actions{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:16px}
.feedback{font-size:13.5px; margin-top:10px; min-height:20px}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--bad)}
.strips{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
.pill{
  font-size:12px; font-family:var(--mono); padding:3px 9px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel-2); color:var(--ink-2);
  cursor:pointer; white-space:nowrap;
}
.pill:hover{border-color:var(--accent)}
.pill.cur{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-2); font-weight:700}
.pill.solid{background:var(--ok-soft); border-color:transparent; color:var(--ok)}
.pill.shaky{background:var(--warn-soft); border-color:transparent; color:var(--warn)}
.pill.cur.solid,.pill.cur.shaky{outline:2px solid var(--accent); outline-offset:1px}
.hint{font-size:12px; color:var(--muted); margin-top:10px}
kbd{white-space:nowrap}

/* ---------- 分段选择 ---------- */
.seg{display:flex; gap:4px; flex-wrap:wrap}
.seg button{padding:5px 11px; font-size:12.5px; border-radius:999px; background:transparent; border:1px solid var(--line); color:var(--ink-2)}
.seg button:hover{background:var(--accent-soft)}
.seg button.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.seg button.on:hover{background:var(--accent-2)}

/* ---------- 总览 ---------- */
.hero{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:16px}
.hero-main{padding:24px 24px 22px}
.hero-main h1{font-size:26px; margin:0 0 6px; letter-spacing:.2px}
.hero-main p{color:var(--muted); margin:0 0 16px; max-width:56ch}
.hero-side{padding:18px 20px}
.kv{display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:6px 0; border-bottom:1px dashed var(--line-2)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}
.mod-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:12px}
.mod{
  border:1px solid var(--line); border-radius:var(--radius-s); padding:14px 15px;
  background:var(--panel-2); cursor:pointer; transition:border-color .12s,transform .12s;
}
.mod:hover{border-color:var(--accent); transform:translateY(-1px)}
.mod b{display:block; font-size:14.5px; margin-bottom:3px}
.mod p{font-size:12.5px; color:var(--muted); margin:0 0 9px; line-height:1.55}
.mod .mbar{height:5px; border-radius:999px; background:var(--line); overflow:hidden}
.mod .mbar i{display:block; height:100%; background:var(--accent); border-radius:999px}
.mod .mnum{font-size:11.5px; color:var(--muted); margin-top:5px; font-variant-numeric:tabular-nums}

/* ---------- 选择题 ---------- */
.qtext{font-size:15px; line-height:1.8; margin:6px 0 14px}
.qtext code{background:var(--code-bg); padding:1px 6px; border-radius:5px; font-size:13.5px}
.opt{
  display:flex; gap:10px; align-items:flex-start;
  border:1px solid var(--line); border-radius:var(--radius-s);
  padding:9px 12px; margin-bottom:8px; cursor:pointer; background:var(--panel-2);
  font-size:13.5px; line-height:1.65;
}
.opt:hover{border-color:var(--accent)}
.opt input{margin:3px 0 0; accent-color:var(--accent)}
.opt.picked{border-color:var(--accent); background:var(--accent-soft)}
.opt.good{border-color:var(--ok); background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.why{
  border-left:3px solid var(--accent); background:var(--accent-soft);
  padding:10px 14px; border-radius:0 var(--radius-s) var(--radius-s) 0;
  font-size:13px; color:var(--ink-2); margin-top:12px; white-space:pre-wrap;
}

/* ---------- 宽表 ---------- */
.tablewrap{overflow:auto; margin-top:12px; border:1px solid var(--line); border-radius:var(--radius-s)}
table.grid{width:100%; border-collapse:collapse; font-size:13.5px}
table.grid th,table.grid td{padding:8px 10px; border-bottom:1px solid var(--line-2); text-align:left; vertical-align:middle}
table.grid thead th{
  position:sticky; top:0; background:var(--panel); z-index:1;
  font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  border-bottom:1px solid var(--line);
}
table.grid tbody tr:hover{background:var(--panel-2)}
table.grid tbody tr:last-child td{border-bottom:0}
table.grid td.mono,table.grid th.mono{font-family:var(--mono)}
table.grid tr.row-ok td{background:var(--ok-soft)}
table.grid td.cell{min-width:120px}
table.grid .blank{width:100%; min-width:70px}

/* ---------- 表单网格 ---------- */
.formgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; margin-top:12px}
.field{display:flex; flex-direction:column; gap:4px}
.field label{font-size:12.5px; color:var(--muted)}
.field .blank{width:100%}
.statline{display:flex; gap:18px; flex-wrap:wrap; font-size:13.5px; margin-top:12px}
.statline b{font-variant-numeric:tabular-nums}
.cache-tbl td,.cache-tbl th{font-family:var(--mono); font-size:12.5px}

/* ---------- 缓存模拟 ---------- */
.hm{display:flex; gap:4px}
.hm button{padding:3px 10px; font-size:12.5px; border-radius:7px; background:transparent; border:1px solid var(--line); color:var(--muted)}
.hm button.on-h{background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:700}
.hm button.on-m{background:var(--bad-soft); border-color:var(--bad); color:var(--bad); font-weight:700}
.hm button.on-h.on-m{outline:none}
tr.step-ok td{background:var(--ok-soft)}
tr.step-bad td{background:var(--bad-soft)}

/* ---------- 速查 ---------- */
details.ref{border:1px solid var(--line); border-radius:var(--radius-s); margin-bottom:10px; background:var(--panel-2); overflow:hidden}
details.ref>summary{
  cursor:pointer; padding:11px 14px; font-weight:600; font-size:14px;
  list-style:none; display:flex; align-items:center; gap:8px;
}
details.ref>summary::-webkit-details-marker{display:none}
details.ref>summary::before{content:"+"; font-family:var(--mono); color:var(--muted); width:12px}
details.ref[open]>summary::before{content:"−"}
details.ref .refbody{padding:0 14px 14px}
.formula{
  font-family:var(--mono); font-size:13px; background:var(--code-bg);
  border:1px solid var(--line); border-radius:8px; padding:9px 12px; margin:8px 0;
  white-space:pre-wrap; color:var(--code-ink);
}

@media (max-width: 980px){
  .layout{grid-template-columns:1fr; margin-top:12px}
  .sidebar{position:static; flex-direction:row; flex-wrap:wrap; align-items:center; gap:6px; padding:8px}
  .sidebar .side-sep,.sidebar .progress-wrap,.sidebar .side-note,.sidebar .side-title{display:none}
  .nav{flex-direction:row; flex-wrap:wrap}
  .nav .n-count{display:none}
  .hero{grid-template-columns:1fr}
  .card{padding:16px 14px}
  .topbar-inner{padding:9px 12px; gap:8px}
  .brand{min-width:0}
  .brand span{display:none}
  table.fedmw td.stage{width:78px}
  .blank{min-width:70px; max-width:100%}
}
@media print{
  .topbar,.sidebar,.actions,.strips,.hint{display:none !important}
  .layout{display:block; max-width:none; margin:0; padding:0}
  .card{box-shadow:none; border-color:#ccc; break-inside:avoid}
  .blank{border:0; border-bottom:1px solid #999; border-radius:0; background:transparent}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <b>ICS · 默写台</b>
      <span><a href="./" title="返回第二次阶段测验刷题页">← 阶段测验 2 刷题</a> · <a href="../" title="返回 ICS 题库首页">ICS 题库</a></span>
    </div>
    <span class="chip mono" id="examChip">第二次阶段测验 2026-11-16</span>
    <span class="chip warn countdown" id="cdChip">倒计时 …</span>
    <span class="spacer"></span>
    <span class="chip ok" id="solidChip">已掌握 0 项</span>
    <button class="ghost small" id="btnTheme" title="切换深色 / 浅色">◐ 主题</button>
    <span class="brand-badge">Powered by Sept, 2026.</span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="side-title">模块</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-sep"></div>
    <div class="progress-wrap">
      <div class="progress"><i id="progBar"></i></div>
      <div class="progress-txt"><span>本次进度</span><span id="progTxt">0 / 0</span></div>
    </div>
    <div class="side-sep"></div>
    <label class="side-opt"><input type="checkbox" id="optAutoNext" checked> 全对后自动下一题</label>
    <label class="side-opt"><input type="checkbox" id="optOnlyTodo"> 只练未掌握</label>
    <label class="side-opt"><input type="checkbox" id="optShuffle"> 随机顺序</label>
    <button class="small ghost" id="btnReset" style="margin:2px 8px 0">重置本页进度</button>
    <p class="side-note">判分忽略大小写、空格、全角半角与 <code>%</code>；写法不同但等价的答案均可接受。</p>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ============ 数据 ============ */
const o = (l, a, alt) => ({ l, a, alt: alt || [] });

const STAGES = [
  ['F', 'Fetch', '取指'],
  ['D', 'Decode', '译码'],
  ['E', 'Execute', '执行'],
  ['M', 'Memory', '访存'],
  ['W', 'Write back', '写回'],
  ['P', 'PC update', '更新 PC']

try { storeData = JSON.parse(localStorage.getItem(LSKEY) || '{}') || {}; } catch (e) { storeData = {}; }
function saveStore(){ try { localStorage.setItem(LSKEY, JSON.stringify(storeData)); } catch (e) {} }
function getRec(id){ return storeData[id] || { mark: null }; }
function setMark(id, mark, quiet){
  const r = getRec(id);
  if (r.mark === mark) return;
  r.mark = mark; r.ts = Date.now(); storeData[id] = r; saveStore();
  if (!quiet) updateChrome();
}
function countSolid(prefixes){
  let n = 0;
  for (const k in storeData) {
    if (storeData[k].mark === 'solid' && prefixes.some(p => k.startsWith(p))) n++;
  }
  return n;
}
function shuffleArr(a){
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

/* ---------- 答案规范化 ---------- */
function norm(s){
  return String(s).normalize('NFKC')
    .replace(/[←⇐]/g, '<').replace(/[→⇒]/g, '>')
    .replace(/[−–—]/g, '-').replace(/[×]/g, '*')
    .replace(/[％%]/g, '').replace(/[，、；]/g, ',')
    .replace(/[：]/g, ':').replace(/[（]/g, '(').replace(/[）]/g, ')')
    .replace(/[“”"']/g, '').replace(/\s+/g, '').toLowerCase();
}
function tokStr(s){
  return String(s).normalize('NFKC')
    .replace(/[←⇐]/g, ' ').replace(/[→⇒]/g, ' ')
    .replace(/[−–—]/g, '-').replace(/[×]/g, ' ')
    .replace(/[％%]/g, '')
    .replace(/[，、；,;\/|]/g, ' ')
    .replace(/[：:]/g, ' ')
    .replace(/[（）()]/g, ' ')
    .replace(/[“”"'.]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim().toLowerCase()
    .split(' ').filter(Boolean).sort().join('|');
}
function matchInput(v, op){
  const cands = [op.a].concat(op.alt || []);
  if (!String(v).trim()) return false;
  if (op.tokens) {
    const t = tokStr(v);
    if (!t) return false;
    return cands.some(c => tokStr(c) === t);
  }
  const n = norm(v);
  if (!n) return false;
  return cands.some(c => norm(c) === n);
}

/* ---------- 空格渲染 ---------- */
function opHtml(op){
  const ans = String(op.a);
  const w = Math.min(380, Math.max(96, ans.length * 8.4 + 34));
  const i = POOL.push(op) - 1;
  const head = op.l ? `<span class="lhs">${esc(op.l)}</span><span class="arrow">←</span>` : '';
  return `<div class="op-row">${head}` +
    `<input class="blank" data-i="${i}" style="width:${Math.round(w)}px" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="填写">` +
    `<span class="ans" hidden>${esc(ans)}</span></div>`;
}
function gradeScope(root, showWrong){
  let ok = 0, total = 0, revealed = 0;
  root.querySelectorAll('input.blank').forEach(inp => {
    const op = POOL[+inp.dataset.i];
    if (!op) return;
    total++;
    if (inp.dataset.revealed === '1') { ok++; revealed++; return; }
    const good = matchInput(inp.value, op);
    inp.classList.toggle('ok', good);
    inp.classList.toggle('bad', !good);
    const ans = inp.parentElement.querySelector('.ans');
    if (ans) ans.hidden = good || !showWrong;
    if (good) ok++;
  });
  return { ok, total, revealed };
}
function revealScope(root){
  root.querySelectorAll('input.blank').forEach(inp => {
    const op = POOL[+inp.dataset.i];
    if (!op) return;
    inp.value = op.a;
    inp.classList.remove('bad');
    inp.classList.add('revealed');
    inp.dataset.revealed = '1';
  });
}

function ensureOrder(key, ids, force){
  if (force || !S.order[key]) S.order[key] = S.shuffle ? shuffleArr(ids) : ids.slice();
  return S.order[key];
}
function fedmwList(){
  const all = ensureOrder('fedmw', FEDMW.map(x => x.id));
  const list = S.onlyTodo ? all.filter(id => getRec('fedmw:' + id).mark !== 'solid') : all;

}
function factList(){
  const all = ensureOrder('fact', FACTS.map(x => x.id));

  return list.length ? list : all;
}
function hazardList(){
  const all = ensureOrder('hz', HAZARDS.map(x => x.id));

  render();

function pickFedmw(id){ S.fedmwId = id; S.picked = null; render(); }
function gateState(id){
  if (!S.gate[id]) S.gate[id] = { pick: [], cc: null, checked: false, ok: false };
  return S.gate[id];
}
function stageHasOps(it, k){ return (it.st[k] || []).length > 0; }
function gateNeed(it){ return STAGES.filter(([k]) => stageHasOps(it, k)).map(([k]) => k); }
function ccMode(it){ return it.id === 'opq' ? 'set' : (it.id === 'cmov' || it.id === 'jxx') ? 'read' : 'none'; }
function ccLabel(m){ return m === 'set' ? '设置条件码' : m === 'read' ? '读取条件码' : '不涉及条件码'; }
function toggleGate(k){
  const g = gateState(S.fedmwId);
  if (g.ok) return;
  g.checked = false;
  const i = g.pick.indexOf(k);
  if (i >= 0) g.pick.splice(i, 1); else g.pick.push(k);
  render();
}
function pickCC(v){
  const g = gateState(S.fedmwId);
  if (g.ok) return;
  g.cc = v;
  g.checked = false;
  render();
}
function checkGate(){
  const it = FEDMW.find(x => x.id === S.fedmwId);
  const g = gateState(it.id);
  if (g.ok) return;
  g.checked = true;
  const need = gateNeed(it);
  const stageOk = g.pick.length === need.length && g.pick.every(k => need.includes(k));
  g.ok = stageOk && g.cc === ccMode(it);
  render();
  if (g.ok) {
    const inp = document.querySelector('#fedmwCard input.blank');
    if (inp) inp.focus();
  }
}

function pickSignal(sg){ S.signal = sg; render(); }
function pickFact(id){ S.factId = id; render(); }
function pickHazard(id){ S.hazardId = id; S.picked = null; render(); }

function nextFact(dir){

}

function gateView(it){
  const g = gateState(it.id);
  const need = gateNeed(it);
  const cm = ccMode(it);
  if (g.ok) {
    return `<div class="gate done" id="gateBox">
      <div class="gate-head"><b>阶段与条件码</b><span class="chip ok">✓ 判断正确</span>
        <span class="chip ${cm === 'set' ? 'warn' : cm === 'read' ? '' : 'muted'}">${ccLabel(cm)}</span>
        <span class="gate-note">实际执行 ${need.length} 个阶段，下面开始逐空默写。</span></div>
      <div class="gate-stages">${STAGES.filter(([k]) => need.includes(k)).map(([k, en, cn]) =>
        `<span class="gstage on"><b>${k}</b><span>${cn}</span></span>`).join('')}</div>
    </div>`;
  }
  const sel = new Set(g.pick);
  const ccOpts = [['set', '设置 CC'], ['read', '读取 CC'], ['none', '不涉及 CC']];
  let fb = '';
  if (g.checked) {
    if (!g.pick.length) fb = '至少选择一个阶段。';
    else if (g.cc == null) fb = '还要选择条件码关系（设置 / 读取 / 不涉及）。';
    else if (!g.ok) fb = '判断还不全对：红色为多选或选错，橙色为漏选；改完再确认。';
  }
  return `<div class="gate" id="gateBox">
    <div class="gate-head"><b>第一步 · 判断阶段</b><span class="chip muted">选中 = 需要执行</span></div>
    <p class="gate-sub">判断这条指令执行哪些阶段，以及它与条件码的关系；两项都正确才解锁默写。</p>
    <div class="gate-stages">${STAGES.map(([k, en, cn]) => {
      const on = sel.has(k);
      let cls = 'gstage' + (on ? ' on' : '');
      if (g.checked) {
        const has = stageHasOps(it, k);
        if (on && has) cls += ' good';
        else if (on && !has) cls += ' bad';
        else if (!on && has) cls += ' miss';
      }
      return `<button class="${cls}" onclick="toggleGate('${k}')"><b>${k}</b><span>${cn}</span></button>`;
    }).join('')}</div>
    <div class="gate-cc">
      <span class="gate-label">第二步 · 条件码</span>
      <div class="gate-stages">${ccOpts.map(([v, t]) => {
        let cls = 'gstage' + (g.cc === v ? ' on' : '');
        if (g.checked && g.cc != null) {
          if (v === cm) cls += ' good';
          else if (g.cc === v) cls += ' bad';
        }
        return `<button class="${cls}" onclick="pickCC('${v}')">${t}</button>`;
      }).join('')}</div>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="primary" onclick="checkGate()">确认判断</button>
      <span class="hint" style="margin:0">阶段与条件码都选对才会出现默写空格。</span>

  switch (v) {
    case '—': return ['-', 'none', '无', '不写'];
    case '-8': return ['-8', '0-8', '(-8)', '+(-8)'];
    case '+8': return ['8', '+8'];
    case '0': return ['0', '否', 'no', 'false'];
    case '1': return ['1', '是', 'yes', 'true'];
    case '%rsp': return ['rsp', 'R[rsp]', '%rsp'];
    case 'rA': return ['ra', 'R[rA]'];
    case 'rB': return ['rb', 'R[rB]'];
    default: return [];

/* ---------- Cache ---------- */
function randInt(n){ return Math.floor(Math.random() * n); }
function pickOne(a){ return a[randInt(a.length)]; }
function genCalc(){
  const B = pickOne([4, 8, 16, 32]);
  const Sset = pickOne([2, 4, 8, 16]);
  const E = pickOne([1, 2, 4]);
  const off = Math.log2(B), index = Math.log2(Sset);
  const m = off + index + 2 + randInt(4);
  return { B, Sset, E, off, index, m, tag: m - off - index, cap: Sset * E * B, blocks: Sset * E };
}
function genSim(){
  const B = pickOne([4, 8, 16]);
  const Sset = pickOne([2, 4]);
  const totalBlocks = 512 / B;
  const uniq = [];
  while (uniq.length < 4) {
    const b = randInt(totalBlocks);
    if (!uniq.includes(b)) uniq.push(b);
  }
  const seq = [];
  for (let i = 0; i < 8; i++) {
    const b = i < 4 ? uniq[i] : uniq[randInt(4)];
    seq.push(b * B + randInt(B));
  }
  const sets = Array.from({ length: Sset }, () => ({ valid: false, tag: 0, block: -1 }));
  const res = seq.map(addr => {
    const idx = Math.floor(addr / B) % Sset;
    const tag = Math.floor(addr / (B * Sset));
    const s = sets[idx];
    const hit = s.valid && s.tag === tag;
    if (!hit) { s.valid = true; s.tag = tag; s.block = Math.floor(addr / B); }
    return hit;
  });
  const final = sets.map(s => ({ ...s }));
  return { B, Sset, seq, res, final, pick: Array(seq.length).fill(null), checked: false };
}
function newCache(){
  if (S.cacheMode === 'calc') S.cacheQ = genCalc();
  else S.sim = genSim();
  render();
}
function viewCache(){
  if (S.cacheMode === 'calc' && !S.cacheQ) S.cacheQ = genCalc();
  if (S.cacheMode === 'sim' && !S.sim) S.sim = genSim();
  let h = `<section class="card" id="cacheCard">
    <div class="card-head"><div><h2 class="card-title">Cache 计算</h2>
      <p class="card-sub">随机参数，每次重新生成；数字题只比数值。</p></div></div>
    <div class="seg" style="margin-bottom:8px">
      <button class="${S.cacheMode === 'calc' ? 'on' : ''}" onclick="setCacheMode('calc')">地址划分</button>
      <button class="${S.cacheMode === 'sim' ? 'on' : ''}" onclick="setCacheMode('sim')">直接映射模拟</button>
    </div>`;
  if (S.cacheMode === 'calc') {
    const q = S.cacheQ;
    h += `<p class="qtext">地址空间 <b>${q.m}</b> 位；块大小 <b>${q.B}</b> 字节；共 <b>${q.Sset}</b> 组，<b>${q.E}</b> 路组相联。求地址划分与数据容量。</p>
      <div class="formgrid">
        <div class="field"><label>offset 位数</label><input class="blank" data-num="${q.off}" inputmode="numeric" autocomplete="off" placeholder="—"></div>
        <div class="field"><label>index 位数</label><input class="blank" data-num="${q.index}" inputmode="numeric" autocomplete="off" placeholder="—"></div>
        <div class="field"><label>tag 位数</label><input class="blank" data-num="${q.tag}" inputmode="numeric" autocomplete="off" placeholder="—"></div>
        <div class="field"><label>数据容量（字节）</label><input class="blank" data-num="${q.cap}" inputmode="numeric" autocomplete="off" placeholder="—"></div>
      </div>
      <div class="actions">
        <button class="primary" onclick="checkMain()">检查 <kbd>Enter</kbd></button>
        <button onclick="newCache()">换一题</button>
        <button class="ghost" onclick="clearAnswers()">清空作答</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <p class="hint">提示：总块数 = S × E，容量 = 总块数 × B；tag 吃掉剩下的所有高位。</p>`;
  } else {
    const s = S.sim;
    const blocks = 512 / s.B;
    h += `<p class="qtext">直接映射 Cache：<b>${s.B}</b> 字节/块，<b>${s.Sset}</b> 组（数据容量 ${s.B * s.Sset} 字节），地址空间 512 字节（共 ${blocks} 块）。逐行判断每次字节访问是 Hit 还是 Miss。</p>
      <div class="tablewrap"><table class="grid" id="simTable">
        <thead><tr><th>#</th><th>地址</th><th>判断</th><th>答案</th></tr></thead><tbody>`;
    s.seq.forEach((addr, i) => {
      const chosen = s.pick[i];
      h += `<tr data-step="${i}"><td>${i + 1}</td><td class="mono">0x${addr.toString(16).toUpperCase().padStart(3, '0')} (${addr})</td>
        <td><div class="hm">
          <button data-v="H" class="${chosen === 'H' ? 'on-h' : ''}" onclick="pickHM(${i},'H')">Hit</button>
          <button data-v="M" class="${chosen === 'M' ? 'on-m' : ''}" onclick="pickHM(${i},'M')">Miss</button>
        </div></td><td class="mono corr"></td></tr>`;
    });
    h += `</tbody></table></div>
      <div class="actions">
        <button class="primary" onclick="checkMain()">检查 <kbd>Enter</kbd></button>
        <button onclick="newCache()">换一题</button>
        <button class="ghost" onclick="clearAnswers()">清空作答</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div id="simDetail"></div>`;
  }
  h += `</section>`;
  return h;
}
function setCacheMode(m){ S.cacheMode = m; render(); }
function pickHM(i, v){
  const s = S.sim;
  s.pick[i] = v;
  const tr = document.querySelector(`tr[data-step="${i}"]`);
  if (!tr) return;
  tr.querySelectorAll('button[data-v]').forEach(b => {
    b.classList.remove('on-h', 'on-m');
    if (b.dataset.v === v) b.classList.add(v === 'H' ? 'on-h' : 'on-m');
  });
}

/* ---------- 速查 ---------- */
function viewRef(){
  let h = `<section class="card">
    <div class="card-head"><div><h2 class="card-title">速查总表</h2>
      <p class="card-sub">只读版。考前十分钟扫一遍即可。</p></div>
      <span class="spacer"></span><button class="ghost small" onclick="window.print()">打印</button></div>
    <div class="formula">单条延迟 = Σ(Li + R)          满负荷吞吐周期 = max(Li + R)
细分 k 段（均衡）= ΣL + kR
offset = log2(B)   index = log2(S)   tag = m − offset − index
Cache 数据容量 = S × E × B</div>`;
  h += `<details class="ref" open><summary>Y86-64 六阶段微操作</summary><div class="refbody">`;
  FEDMW.forEach(it => {
    const cm = ccMode(it);
    h += `<div style="margin:10px 0 4px"><span class="mono" style="font-weight:700">${esc(it.asm)}</span>
      <span class="chip muted mono">${esc(it.code)}</span>
      <span class="chip ${cm === 'set' ? 'warn' : cm === 'read' ? '' : 'muted'}">${cm === 'set' ? '设置 CC' : cm === 'read' ? '读取 CC' : '不涉及 CC'}</span></div>
      <table class="grid"><tbody>`;
    STAGES.forEach(([k, en, cn]) => {
      const ops = it.st[k] || [];
      h += `<tr><td class="mono stage-ab" style="width:34px">${k}</td><td class="mono" style="font-size:12.5px">${
        ops.length ? ops.map(o => esc(o.l) + ' ← ' + esc(o.a)).join('；') : '<span class="none">无</span>'
      }</td></tr>`;
    });
    h += `</tbody></table>`;
  });
  h += `</div></details>`;

  h += `<details class="ref"><summary>控制信号与编码</summary><div class="refbody">
    <div class="tablewrap"><table class="grid">
      <thead><tr><th>指令</th><th>srcA</th><th>srcB</th><th>dstE</th><th>dstM</th><th>aluA</th><th>aluB</th><th>set_cc</th></tr></thead><tbody>
      ${SIGNALS.map(r => `<tr><td class="mono">${esc(r.instr)}</td><td class="mono">${r.srcA}</td><td class="mono">${r.srcB}</td><td class="mono">${r.dstE}</td><td class="mono">${r.dstM}</td><td class="mono">${r.aluA}</td><td class="mono">${r.aluB}</td><td class="mono">${r.setCC}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="tablewrap"><table class="grid">
      <thead><tr><th>指令</th><th>icode</th><th>ifun</th><th>长度</th><th>编码</th></tr></thead><tbody>
      ${ENC.map(e => `<tr><td class="mono">${esc(e.instr)}</td><td class="mono">${e.icode}</td><td class="mono">${e.ifun}</td><td class="mono">${e.len}</td><td class="mono">${esc(e.fmt)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="strips">${REGS.map(([r, v]) => `<span class="pill" style="cursor:default">${r} = ${v}</span>`).join('')}</div>
  </div></details>`;

  h += `<details class="ref"><summary>高频结论与陷阱</summary><div class="refbody">
    <ul style="margin:6px 0 0; padding-left:20px; font-size:13.5px; line-height:1.9">
      <li>ISA 不含调用约定；参数寄存器是 ABI。</li>
      <li>rmmovq / mrmovq 都以 rB 为基址，共用一条地址加法通路。</li>
      <li>aluB 恒为 valB；irmovq / rrmovq 时是 0。OPq 顺序为 valB OP valA。</li>
      <li>jXX 不用 ALU，目标地址就是 valC；Cnd 在 E 阶段算出。</li>
      <li>popq 的 valE = valB + 8，valM = M8[valA]（valA 是旧 %rsp）。</li>
      <li>数据冒险在 D 阶段检测；前递优先级 E → M → W，段内先访存后 ALU。</li>
      <li>load-use 无法只靠前递：F、D 停顿，E 气泡。ret 全程插入 3 个气泡。</li>
      <li>分支预测失败在 E 判定，D、E 插气泡。</li>
      <li>三种 miss：冷启、容量、冲突；write-back 常配 write-allocate。</li>
      <li>链接 = 符号解析 + 重定位；callq 未重定位时偏移为 0。</li>
      <li>fault 返回后重执行当前指令；trap 返回下一条。</li>
      <li>fork 子返回 0、父返回子 pid；信号不排队。</li>
      <li>setjmp 首次返回 0；longjmp 传 0 会变成 1。</li>
    </ul>
  </div></details>`;
  h += `</section>`;
  return h;
}

/* ---------- 判分 ---------- */
function checkMain(){
  if (S.mod === 'fedmw') return checkFedmw();
  if (S.mod === 'table') return checkDrill('fedmw');
  if (S.mod === 'signal') return checkDrill('sig');
  if (S.mod === 'encoding') return checkDrill('enc');
  if (S.mod === 'hazard') return checkHazard();
  if (S.mod === 'facts') return checkFact();
  if (S.mod === 'cache') return checkCache();
}
function revealMain(){
  if (S.mod === 'fedmw') {
    const it = FEDMW.find(x => x.id === S.fedmwId);
    const g = gateState(it.id);
    const hadGate = g.ok;
    if (!hadGate) {
      g.pick = gateNeed(it).slice();
      g.cc = ccMode(it);
      g.checked = true;
      g.ok = true;
      render();
    }
    revealScope($('#fedmwCard'));
    setMark('fedmw:' + S.fedmwId, 'shaky');
    const fb = $('#feedback');
    fb.className = 'feedback';
    fb.textContent = hadGate ? '已显示答案。看完点「下一题」重默一遍。' : '已显示阶段判断与全部答案。看完点「下一题」重默一遍。';
  } else if (S.mod === 'table' || S.mod === 'signal' || S.mod === 'encoding') {
    revealScope($('#drillCard'));
    $('#drillCard').querySelectorAll('.sig-note').forEach(n => { n.hidden = false; });
    const fb = $('#feedback');
    fb.className = 'feedback'; fb.textContent = '已显示整表答案。';
  } else if (S.mod === 'facts') {
    revealScope($('#factCard'));
    const f = FACTS.find(x => x.id === S.factId);
    setMark('fact:' + S.factId, 'shaky');
    showWhy(f.why);
    const fb = $('#feedback');
    fb.className = 'feedback'; fb.textContent = '已显示答案。';
  }
}
function markCurrent(mark){
  let id = null;
  if (S.mod === 'fedmw') id = 'fedmw:' + S.fedmwId;
  else if (S.mod === 'facts') id = 'fact:' + S.factId;
  else if (S.mod === 'hazard') id = 'hz:' + S.hazardId;
  if (!id) return;
  setMark(id, mark);
  const fb = $('#feedback');
  if (fb) { fb.className = 'feedback'; fb.textContent = mark === 'solid' ? '已标记为「已掌握」。' : '已标记为「待复习」。'; }
}
function clearAnswers(){
  if (S.mod === 'cache') {
    if (S.cacheMode === 'sim') {
      S.sim.pick = Array(S.sim.seq.length).fill(null);
      render();
    } else {
      document.querySelectorAll('#cacheCard input[data-num]').forEach(inp => {
        inp.value = '';
        inp.classList.remove('ok', 'bad');
      });
    }
    const fb = $('#feedback');
    if (fb) { fb.className = 'feedback'; fb.textContent = '已清空作答。'; }
    return;
  }
  const card = $('#fedmwCard') || $('#drillCard') || $('#factCard');
  if (!card) return;
  card.querySelectorAll('input.blank').forEach(inp => {
    inp.value = '';
    inp.classList.remove('ok', 'bad', 'revealed');
    delete inp.dataset.revealed;
    const ans = inp.parentElement.querySelector('.ans');
    if (ans) ans.hidden = true;
  });
  if (S.mod === 'table' || S.mod === 'signal' || S.mod === 'encoding') {
    card.querySelectorAll('tbody tr').forEach(tr => {
      if (!tr.querySelector('input.blank')) return;
      tr.classList.remove('row-ok');
      const res = tr.lastElementChild;
      if (res && !res.querySelector('input')) res.textContent = '';
    });
    card.querySelectorAll('.sig-note').forEach(n => { n.hidden = true; });
  }
  if (S.mod === 'facts') {
    const why = $('#why');
    if (why) { why.hidden = true; why.innerHTML = ''; }
  }
  const fb = $('#feedback');
  if (fb) { fb.className = 'feedback'; fb.textContent = '已清空作答。'; }
}

function checkFedmw(){
  const fb = $('#feedback');
  const g = gateState(S.fedmwId);
  if (!g.ok) {
    fb.className = 'feedback bad';
    fb.textContent = '先完成上方的阶段判断；全部选对后才会解锁默写。';
    return;
  }
  const card = $('#fedmwCard');
  const r = gradeScope(card, true);
  const id = 'fedmw:' + S.fedmwId;
  if (r.ok === r.total && r.revealed === 0) {
    fb.className = 'feedback ok';
    fb.textContent = `全对 ${r.ok}/${r.total}，已标记为「已掌握」。`;
    setMark(id, 'solid');
    const pill = document.querySelector('.pill.cur');
    if (pill) { pill.classList.remove('shaky'); pill.classList.add('solid'); }
    if (S.autoNext) setTimeout(() => { if (S.mod === 'fedmw') nextFedmw(1); }, 750);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = r.revealed
      ? `有 ${r.revealed} 个空是看答案填的，建议点「下一题」再默一遍。`
      : `${r.ok}/${r.total} 正确；红色空格的答案已显示。`;
    setMark(id, 'shaky');
    const pill = document.querySelector('.pill.cur');
    if (pill) { pill.classList.remove('solid'); pill.classList.add('shaky'); }
  }
  updateChrome();
}
function checkDrill(kind){
  const table = $('#drillTable');
  if (!table) return;
  const rows = [...table.querySelectorAll('tbody tr')];
  let allOk = true, any = false;
  rows.forEach(tr => {
    const r = gradeScope(tr, true);
    tr.querySelectorAll('.sig-note').forEach(n => { n.hidden = false; });
    if (!r.total) return;
    any = true;
    const resCell = tr.lastElementChild;
    if (r.ok === r.total && r.revealed === 0) {
      tr.classList.add('row-ok');
      if (resCell && !resCell.querySelector('input')) resCell.textContent = '全对';
      setMark(tr.dataset.id, 'solid', true);
    } else {
      tr.classList.remove('row-ok');
      if (resCell && !resCell.querySelector('input')) resCell.textContent = r.revealed ? '看答案' : `${r.ok}/${r.total}`;
      setMark(tr.dataset.id, 'shaky', true);
      allOk = false;
    }
  });
  updateChrome();
  const fb = $('#feedback');
  if (!fb) return;
  fb.className = 'feedback ' + (allOk ? 'ok' : 'bad');
  fb.textContent = !any ? '先填几个空格再检查。' : allOk ? '整表全对，全部标记为已掌握。' : '有错误或看过答案：红色空格的正确答案已显示，结果列给出得分。';
}
function checkHazard(){
  const hz = HAZARDS.find(x => x.id === S.hazardId);
  const fb = $('#feedback');
  if (S.picked === null) {
    fb.className = 'feedback bad'; fb.textContent = '先选一个选项。'; return;
  }
  const opts = document.querySelectorAll('#opts .opt');
  opts.forEach((el, i) => {
    el.classList.remove('good', 'wrong');
    if (i === hz.ans) el.classList.add('good');
    else if (i === S.picked) el.classList.add('wrong');
  });
  const good = S.picked === hz.ans;
  fb.className = 'feedback ' + (good ? 'ok' : 'bad');
  fb.textContent = good ? '判断正确。' : '判断错误，绿色是正确选项。';
  showWhy(hz.why);
  setMark('hz:' + hz.id, good ? 'solid' : 'shaky');
}
function checkFact(){
  const card = $('#factCard');
  const r = gradeScope(card, true);
  const f = FACTS.find(x => x.id === S.factId);
  const fb = $('#feedback');
  if (r.ok === r.total && r.revealed === 0) {
    fb.className = 'feedback ok'; fb.textContent = `全对 ${r.ok}/${r.total}，已标记为「已掌握」。`;
    setMark('fact:' + f.id, 'solid');
    if (S.autoNext) setTimeout(() => { if (S.mod === 'facts') nextFact(1); }, 750);
  } else {
    fb.className = 'feedback bad';
    fb.textContent = r.revealed ? '这次是看答案填的，点「下一题」再背一遍。' : `${r.ok}/${r.total} 正确，红色空格已给出答案。`;
    setMark('fact:' + f.id, 'shaky');
  }
  showWhy(f.why);
  updateChrome();
}
function checkCache(){
  const fb = $('#feedback');
  if (S.cacheMode === 'calc') {
    const q = S.cacheQ;
    const inputs = [...document.querySelectorAll('#cacheCard input[data-num]')];
    let ok = 0;
    inputs.forEach(inp => {
      const want = +inp.dataset.num;
      const got = parseFloat(String(inp.value).replace(/[^\d.-]/g, ''));
      const good = got === want;
      inp.classList.toggle('ok', good);
      inp.classList.toggle('bad', !good);
      if (good) ok++;
    });
    fb.className = 'feedback ' + (ok === inputs.length ? 'ok' : 'bad');
    fb.textContent = ok === inputs.length
      ? '全对。'
      : `${ok}/${inputs.length} 正确。答案：offset ${q.off} 位，index ${q.index} 位，tag ${q.tag} 位，容量 ${q.cap} 字节（${q.blocks} 块 × ${q.B} B）。`;
  } else {
    const s = S.sim;
    if (s.pick.includes(null)) {
      fb.className = 'feedback bad'; fb.textContent = '每一行都要选 Hit 或 Miss。'; return;
    }
    let ok = 0, hits = 0;
    s.res.forEach((hit, i) => {
      const good = (s.pick[i] === 'H') === hit;
      if (good) ok++;
      if (hit) hits++;
      const tr = document.querySelector(`tr[data-step="${i}"]`);
      if (tr) {
        tr.classList.toggle('step-ok', good);
        tr.classList.toggle('step-bad', !good);
        tr.querySelector('.corr').textContent = hit ? 'Hit' : 'Miss';
      }
    });
    fb.className = 'feedback ' + (ok === s.res.length ? 'ok' : 'bad');
    fb.textContent = `${ok}/${s.res.length} 正确。该序列共 ${hits} 次 Hit、${s.res.length - hits} 次 Miss。`;
    const d = $('#simDetail');
    if (d) {
      let t = `<div class="tablewrap"><table class="grid">
        <thead><tr><th>#</th><th>地址</th><th>tag</th><th>index</th><th>offset</th><th>结果</th></tr></thead><tbody>`;
      s.seq.forEach((addr, i) => {
        const off = addr % s.B;
        const idx = Math.floor(addr / s.B) % s.Sset;
        const tag = Math.floor(addr / (s.B * s.Sset));
        t += `<tr><td>${i + 1}</td><td class="mono">${addr}</td><td class="mono">${tag}</td><td class="mono">${idx}</td><td class="mono">${off}</td><td class="mono">${s.res[i] ? 'Hit' : 'Miss'}</td></tr>`;
      });
      t += `</tbody></table></div>
        <p class="hint">最终 Cache 状态（tag / 块号）：</p>
        <div class="tablewrap"><table class="grid cache-tbl">
        <thead><tr><th>组</th><th>valid</th><th>tag</th><th>块号</th><th>块内地址范围</th></tr></thead><tbody>`;
      s.final.forEach((st, i) => {
        t += `<tr><td>${i}</td><td>${st.valid ? 1 : 0}</td><td>${st.valid ? st.tag : '—'}</td><td>${st.valid ? st.block : '—'}</td><td>${st.valid ? `${st.block * s.B}–${st.block * s.B + s.B - 1}` : '—'}</td></tr>`;
      });
      t += `</tbody></table></div>`;
      d.innerHTML = t;
    }
  }
}

/* ---------- 选项绑定 ---------- */
function applyOpts(){
  S.autoNext = $('#optAutoNext').checked;
  S.onlyTodo = $('#optOnlyTodo').checked;
  S.shuffle = $('#optShuffle').checked;
  ensureOrder('fedmw', FEDMW.map(x => x.id), true);
  ensureOrder('fact', FACTS.map(x => x.id), true);
  ensureOrder('hz', HAZARDS.map(x => x.id), true);
  try {
    localStorage.setItem(LSOPT, JSON.stringify({ autoNext: S.autoNext, onlyTodo: S.onlyTodo, shuffle: S.shuffle, theme: document.documentElement.dataset.theme }));
  } catch (e) {}
  render();
}
function restoreOpts(){
  try {
    const o = JSON.parse(localStorage.getItem(LSOPT) || '{}');
    if (typeof o.autoNext === 'boolean') S.autoNext = o.autoNext;
    if (typeof o.onlyTodo === 'boolean') S.onlyTodo = o.onlyTodo;
    if (typeof o.shuffle === 'boolean') S.shuffle = o.shuffle;
    if (o.theme === 'dark') document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
  $('#optAutoNext').checked = S.autoNext;
  $('#optOnlyTodo').checked = S.onlyTodo;
  $('#optShuffle').checked = S.shuffle;
}
$('#optAutoNext').addEventListener('change', applyOpts);
$('#optOnlyTodo').addEventListener('change', applyOpts);
$('#optShuffle').addEventListener('change', applyOpts);
$('#btnTheme').addEventListener('click', () => {
  const d = document.documentElement;
  d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark';
  try {
    const o = JSON.parse(localStorage.getItem(LSOPT) || '{}');
    o.theme = d.dataset.theme;
    localStorage.setItem(LSOPT, JSON.stringify(o));
  } catch (e) {}
});
$('#btnReset').addEventListener('click', () => {
  if (!confirm('清空本页的全部掌握标记？')) return;
  storeData = {};
  saveStore();
  render();
});

document.addEventListener('input', e => {
  if (e.target.classList && e.target.classList.contains('blank')) {
    e.target.classList.remove('ok', 'bad');
    delete e.target.dataset.revealed;
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && t.classList && t.classList.contains('blank') && e.key === 'Enter') {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) revealMain(); else checkMain();
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && S.mod !== 'home' && S.mod !== 'ref') {
    e.preventDefault();
    checkMain();
  }
});

/* ---------- 启动 ---------- */
restoreOpts();
ensureOrder('fedmw', FEDMW.map(x => x.id), true);
ensureOrder('fact', FACTS.map(x => x.id), true);
ensureOrder('hz', HAZARDS.map(x => x.id), true);
render();

</script>
