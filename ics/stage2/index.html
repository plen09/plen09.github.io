<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICS 刷题台</title>
<style>
:root{
  --bg:#f5f6fa; --panel:#ffffff; --panel-2:#fbfcfe;
  --ink:#1b2333; --ink-2:#3d4757; --muted:#727c8f;
  --line:#e4e8f0; --line-2:#eef1f6;
  --accent:#2f6fed; --accent-2:#1b54c8; --accent-soft:#eaf1ff;
  --ok:#12855f; --ok-soft:#e6f6ef;
  --warn:#c9701b; --warn-soft:#fdf0e2;
  --star:#d9a400; --star-soft:#fff7dd;
  --code-bg:#f6f8fb; --code-ink:#243044;
  --radius:14px; --radius-s:9px;
  --shadow:0 1px 2px rgba(21,32,56,.05), 0 8px 24px -18px rgba(21,32,56,.35);
}
html[data-theme="dark"]{
  --bg:#10131a; --panel:#171c25; --panel-2:#141922;
  --ink:#e7ebf3; --ink-2:#c3cad8; --muted:#8e99ad;
  --line:#28303d; --line-2:#212836;
  --accent:#7ba4ff; --accent-2:#9cbcff; --accent-soft:#1b2540;
  --ok:#4cc79a; --ok-soft:#12291f;
  --warn:#e8a25c; --warn-soft:#2c2115;
  --star:#e8c14d; --star-soft:#2b2410;
  --code-bg:#0d1117; --code-ink:#d6dbe6;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:var(--panel);
  background:color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1560px; margin:0 auto; padding:10px 18px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{display:flex; flex-direction:column; gap:1px; min-width:230px}
.brand b{font-size:16px; letter-spacing:.2px}
.brand span{font-size:12px; color:var(--muted)}
.spacer{flex:1 1 auto}
.chip{
  display:inline-flex; align-items:center; gap:5px;
  padding:2px 9px; border-radius:999px; font-size:12px; line-height:1.7;
  background:var(--accent-soft); color:var(--accent-2); border:1px solid transparent;
  white-space:nowrap;
}
.chip.muted{background:var(--line-2); color:var(--muted)}
.chip.ok{background:var(--ok-soft); color:var(--ok)}
.chip.warn{background:var(--warn-soft); color:var(--warn)}
.chip.star{background:var(--star-soft); color:var(--star)}
.brand-badge{
  display:inline-flex; align-items:center; padding:3px 14px; border-radius:999px;
  font-size:13.5px; font-weight:700; letter-spacing:.05em; white-space:nowrap;
  background:var(--accent-soft); color:var(--accent-2); border:1px solid var(--accent);
}
.countdown{font-variant-numeric:tabular-nums; font-weight:600; color:var(--accent-2)}
input[type="search"],select,input[type="text"]{
  font:inherit; font-size:13.5px; color:var(--ink);
  background:var(--panel-2); border:1px solid var(--line);
  border-radius:var(--radius-s); padding:6px 10px; outline:none;
}
input[type="search"]:focus,select:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.search{min-width:200px; flex:0 1 260px}
button{
  font:inherit; font-size:13.5px; cursor:pointer;
  background:var(--panel-2); color:var(--ink-2);
  border:1px solid var(--line); border-radius:var(--radius-s);
  padding:6px 11px; transition:.15s ease;
}
button:hover{border-color:var(--accent); color:var(--accent-2)}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
button.primary:hover{background:var(--accent-2); border-color:var(--accent-2); color:#fff}
button.ghost{background:transparent}
button.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-2)}

/* ---------- 布局 ---------- */
.layout{max-width:1560px; margin:0 auto; padding:18px; display:grid; grid-template-columns:272px minmax(0,1fr); gap:18px}
@media (max-width:1040px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:static !important; max-height:none !important}
  /* 窄屏下允许长代码/公式换行，避免整页横向滚动 */
  .prose code{white-space:pre-wrap; overflow-wrap:anywhere}
  .q-body, .q-answer, .draft-preview{overflow-wrap:anywhere}
}
.sidebar{
  position:sticky; top:66px; align-self:start;
  max-height:calc(100vh - 86px); overflow:auto;
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);
}
.side-sec{margin-bottom:16px}
.side-sec:last-child{margin-bottom:0}
.side-title{font-size:12px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; margin:0 0 8px}
.side-btns{display:flex; flex-wrap:wrap; gap:6px}
.side-btns button{font-size:12.5px; padding:4px 9px}
.filter-list{display:flex; flex-direction:column; gap:4px}
.filter-list button{
  display:flex; justify-content:space-between; align-items:center; width:100%;
  text-align:left; background:transparent; border-color:transparent; padding:5px 8px; font-size:13px;
}
.filter-list button:hover{background:var(--panel-2); border-color:var(--line)}
.filter-list button.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-2)}
.filter-list .cnt{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.progress{height:8px; background:var(--line-2); border-radius:99px; overflow:hidden; margin:6px 0 8px}
.progress i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),#59c39a); width:0}
.stat-row{display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12.5px}
.stat{background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius-s); padding:6px 8px}
.stat b{display:block; font-size:16px; font-variant-numeric:tabular-nums}
.stat span{color:var(--muted); font-size:11.5px}

/* ---------- 题目卡片 ---------- */
.view{display:none}
.view.active{display:block}
.view-head{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:0 0 12px; padding:10px 14px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); position:sticky; top:58px; z-index:20;
}
.view-head .count{font-size:13px; color:var(--muted)}
.q{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:15px 17px 13px; margin-bottom:14px; box-shadow:var(--shadow);
  scroll-margin-top:118px; position:relative;
}
.q::before{content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:3px; background:transparent}
.q.mark-ok::before{background:var(--ok)}
.q.mark-review::before{background:var(--warn)}
.q.mark-star::before{background:var(--star)}
.q:focus{outline:2px solid var(--accent); outline-offset:2px}
.q.done{opacity:.94}
.q.flash{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft), var(--shadow)}
.q-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.q-id{
  font-weight:700; font-size:14px; letter-spacing:.02em; color:#fff; background:var(--accent);
  border-radius:7px; padding:1px 9px; font-variant-numeric:tabular-nums;
}
.q-id.lec-L2{background:#2f6fed} .q-id.lec-L3{background:#8659d6} .q-id.lec-L4{background:#0f8f8f}
.q-id.lec-L5{background:#c2603f} .q-id.lec-L6{background:#3f7d20} .q-id.lec-L7{background:#a4552c}
.q-id.lec-L8{background:#b0295a} .q-id.lec-LAB{background:#5a6473}
.q-body{font-size:14.6px; color:var(--ink)}
.q-body > :first-child{margin-top:0}
.q-body > :last-child{margin-bottom:0}
.q-actions{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:11px; padding-top:11px; border-top:1px dashed var(--line)}
.q-actions .hint{font-size:11.5px; color:var(--muted); margin-left:auto}
.q-answer{
  margin-top:12px; padding:12px 14px; border-radius:var(--radius-s);
  background:var(--ok-soft); border:1px solid var(--ok);
  border:1px solid color-mix(in srgb, var(--ok) 25%, transparent);
}
.q-answer[hidden]{display:none}
.q-answer > :first-child{margin-top:0}
.q-answer > :last-child{margin-bottom:0}
.ans-head{display:flex; align-items:center; gap:8px; margin-bottom:6px}
.ans-head b{font-size:12.5px; letter-spacing:.06em; color:var(--ok)}
.q-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}

/* ---------- 正文排版 ---------- */
.prose h1,.prose h2,.prose h3,.prose h4,.prose h5{margin:20px 0 8px; line-height:1.4}
.prose h1{font-size:21px} .prose h2{font-size:18px} .prose h3{font-size:16px}
.prose h4{font-size:14.5px; color:var(--ink-2)} .prose h5{font-size:14px; color:var(--muted)}
.prose p{margin:8px 0}
.prose ul,.prose ol{margin:8px 0; padding-left:22px}
.prose li{margin:3px 0}
.prose li > p{margin:4px 0}
.prose hr{border:0; border-top:1px solid var(--line); margin:16px 0}
.prose blockquote{
  margin:10px 0; padding:8px 12px; border-left:3px solid var(--accent);
  background:var(--panel-2); border-radius:0 var(--radius-s) var(--radius-s) 0; color:var(--ink-2);
}
.prose code{
  font:12.8px/1.6 "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  background:var(--code-bg); border:1px solid var(--line);
  padding:.5px 5px; border-radius:5px; color:var(--code-ink); white-space:nowrap;
}
.prose strong{color:var(--ink); font-weight:700}
.prose .reflink{color:var(--muted); border-bottom:1px dotted var(--muted)}
.prose img.md-img{display:block; max-width:100%; height:auto; margin:10px 0; padding:6px;
  background:#fff; border:1px solid var(--line); border-radius:var(--radius-s);
  box-shadow:0 1px 2px rgba(21,32,56,.08); cursor:zoom-in}
.prose img.md-img:hover{border-color:var(--accent)}
.img-zoom{position:fixed; inset:0; z-index:200; background:rgba(15,20,30,.82); display:flex;
  align-items:center; justify-content:center; padding:20px; cursor:zoom-out}
.img-zoom img{max-width:100%; max-height:100%; background:#fff; border-radius:8px}
.code-block{margin:10px 0}
.code-lang{
  display:inline-block; font-size:11px; letter-spacing:.06em; color:var(--muted);
  background:var(--line-2); border:1px solid var(--line); border-bottom:0;
  border-radius:6px 6px 0 0; padding:1px 8px; margin-left:2px;
}
.code-block pre{
  margin:0; background:var(--code-bg); border:1px solid var(--line);
  border-radius:0 var(--radius-s) var(--radius-s) var(--radius-s);
  padding:10px 12px; overflow-x:auto;
}
.code-block pre code{
  white-space:pre; background:none; border:0; padding:0; font-size:12.6px; line-height:1.62;
}
.code-block:not(:has(.code-lang)) pre{border-radius:var(--radius-s)}
.table-wrap{overflow-x:auto; margin:10px 0}
.prose table{border-collapse:collapse; width:100%; font-size:13.6px}
.prose th,.prose td{border:1px solid var(--line); padding:6px 9px; text-align:left; vertical-align:top}
.prose thead th{background:var(--accent-soft); color:var(--ink); font-weight:600; white-space:nowrap}
.prose tbody tr:nth-child(even) td{background:var(--panel-2)}

/* ---------- LaTeX ---------- */
.math{
  font-family:"Latin Modern Math","Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;
  font-size:1.03em; white-space:nowrap;
}
.math-display{display:block; text-align:center; margin:12px 0; font-size:1.14em; white-space:normal}
.m-var{font-style:italic}
.m-txt,.m-num{font-style:normal}
.m-op{margin:0 .18em}
.m-unary{margin:0}
.m-rel{margin:0 .3em}
.m-punct{margin:0 .02em}
.m-sym{font-style:normal}
.m-frac{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 .16em; font-size:.96em; transform:translateY(-.04em)}
.m-frac .m-fnum{border-bottom:1px solid currentColor; padding:0 .3em .5px}
.m-frac .m-fden{padding:.5px .3em 0}
.m-sqrt{display:inline-flex; align-items:flex-start}
.m-sqrt .m-radical{margin-right:-.06em}
.m-sqrt .m-rad{border-top:1px solid currentColor; padding-top:.18em; margin-left:.08em}
.m-ss{display:inline-flex; align-items:center}
.m-ss > .m-atom{display:inline-block}
.m-scripts{display:inline-flex; flex-direction:column; font-size:.72em; line-height:1.06; margin-left:.04em}
.m-sup{transform:translateY(-.12em)}
.m-sub{transform:translateY(.14em)}
.m-over{border-top:1px solid currentColor; padding-top:.1em}
.m-under{border-bottom:1px solid currentColor}

/* ---------- 答题卡 ---------- */
.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:8px}
.card-cell{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  padding:8px 4px; border-radius:var(--radius-s); border:1px solid var(--line);
  background:var(--panel-2); cursor:pointer; font-size:13px; font-weight:600;
  font-variant-numeric:tabular-nums; transition:.12s ease;
}
.card-cell:hover{transform:translateY(-1px); border-color:var(--accent)}
.card-cell small{font-size:10px; font-weight:400; color:var(--muted)}
.card-cell.ok{background:var(--ok-soft); border-color:var(--ok); border-color:color-mix(in srgb, var(--ok) 40%, transparent); color:var(--ok)}
.card-cell.review{background:var(--warn-soft); border-color:var(--warn); border-color:color-mix(in srgb, var(--warn) 40%, transparent); color:var(--warn)}
.card-cell.star{box-shadow:inset 0 -3px 0 var(--star)}
.card-cell.seen{border-color:var(--accent)}
.card-legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-bottom:12px}
.card-legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:4px; vertical-align:-1px}
.card-sec-title{font-size:13px; color:var(--muted); margin:16px 0 8px; letter-spacing:.04em}

/* ---------- 速查 ---------- */
.cheat{max-width:none}
.cheat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:14px; align-items:start}

/* ---------- 草稿区 ---------- */
.draft{margin-top:12px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--panel-2); overflow:hidden}
.draft-head{display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:6px 10px; border-bottom:1px solid var(--line)}
.draft-head .draft-title{font-size:12.5px; color:var(--muted); letter-spacing:.04em; white-space:nowrap}
.draft-head button{font-size:12px; padding:2px 8px}
.draft-head .sep{width:1px; height:16px; background:var(--line); margin:0 3px}
.draft-head .draft-count{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.draft-body{display:grid; grid-template-columns:1fr}
.draft-mode-split .draft-body{grid-template-columns:1fr 1fr}
.draft-mode-edit .draft-preview{display:none}
.draft-mode-preview .draft-input{display:none}
.draft-input{
  width:100%; min-height:104px; border:0; border-radius:0; outline:none; display:block;
  background:var(--panel); color:var(--ink); resize:vertical; padding:9px 12px;
  font:12.9px/1.75 "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
.draft-input::placeholder{color:var(--muted); font-family:inherit}
.draft-preview{padding:9px 12px; min-height:104px; font-size:13.8px; border-left:1px solid var(--line)}
.draft-mode-preview .draft-preview, .draft-mode-edit .draft-preview{border-left:0}
.draft-preview .draft-empty{color:var(--muted); font-size:12.5px}
.draft.has-content .draft-head .draft-title{color:var(--accent-2)}
.draft-sum{font-size:12.5px; color:var(--muted); margin:2px 0 10px}
.draft-card{margin-bottom:14px}
.draft-card .draft-head{background:var(--panel)}
.draft-card .draft-meta{font-size:12.5px; color:var(--muted); margin-left:auto; white-space:nowrap}
.dot{display:inline-block; width:5px; height:5px; border-radius:99px; background:var(--accent); margin-left:4px; vertical-align:1px}

/* ---------- 自动判题面板 ---------- */
.quiz-panel{margin-top:12px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--panel-2); padding:10px 12px}
.quiz-panel.nokey{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.quiz-qhead{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.quiz-qtitle{font-size:12.5px; color:var(--muted); letter-spacing:.04em}
.quiz-note{font-size:12px; color:var(--muted)}
.quiz-badge{font-size:12px; padding:1px 9px; border-radius:999px; font-weight:600}
.quiz-badge.ok{background:var(--ok-soft); color:var(--ok)}
.quiz-badge.bad{background:var(--warn-soft); color:var(--warn)}
.quiz-badge.done{background:var(--accent-soft); color:var(--accent-2)}
.opt-list{display:flex; flex-direction:column; gap:6px; margin:2px 0 8px}
.opt{display:flex; gap:9px; align-items:flex-start; text-align:left; width:100%; padding:6px 10px; background:var(--panel); font-size:13.6px; line-height:1.6}
.opt b{font-weight:700; color:var(--accent-2); min-width:16px}
.opt.picked{border-color:var(--accent); background:var(--accent-soft)}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.wrong{border-color:var(--warn); background:var(--warn-soft)}
.opt.missed{border-color:var(--warn); border-style:dashed; background:var(--warn-soft)}
.quiz-badge.part{background:var(--warn-soft); color:var(--warn)}
.blank-list{display:flex; flex-direction:column; gap:6px; margin:2px 0 8px}
.blank{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.4px}
.blank .bk{color:var(--accent-2); font-weight:600; min-width:18px}
.blank .bk-label{color:var(--muted); font-size:12.5px}
.blank .skip-txt{color:var(--muted); font-size:12.5px}
.blank-input{
  font:13.4px/1.5 "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  background:var(--panel); color:var(--ink); border:1px solid var(--line);
  border-radius:7px; padding:4px 9px; min-width:190px; flex:0 1 320px; outline:none;
}
.blank-input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.blank-input.right{border-color:var(--ok); background:var(--ok-soft)}
.blank-input.wrong{border-color:var(--warn); background:var(--warn-soft)}
.blank-fb{font-size:12.3px; color:var(--warn)}
.blank-fb.ok{color:var(--ok)}
.quiz-actions{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.quiz-actions .hint{font-size:11.5px; color:var(--muted); margin-left:auto}

/* ---------- 单题刷题模式 ---------- */
.single-bar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin:0 0 12px; padding:9px 12px; border:1px solid var(--line);
  border-radius:var(--radius); background:var(--panel); box-shadow:var(--shadow);
  position:sticky; top:112px; z-index:18;
}
.single-bar .pos{font-variant-numeric:tabular-nums; font-weight:600; font-size:13.5px; min-width:88px; text-align:center}
.single-bar .bar{flex:1 1 120px; height:6px; background:var(--line-2); border-radius:99px; overflow:hidden; min-width:80px}
.single-bar .bar i{display:block; height:100%; background:var(--accent); width:0}
.single-bar label.sb{display:inline-flex; align-items:center; gap:4px; font-size:12.5px; color:var(--muted)}
.single-bar .sep{width:1px; height:18px; background:var(--line)}
#quizList.single-mode .q{max-width:1000px}
.cheat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:14px; align-items:start}
.cheat-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow)}
.cheat-card h3{margin-top:0}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.empty{padding:28px; text-align:center; color:var(--muted); background:var(--panel); border:1px dashed var(--line); border-radius:var(--radius)}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px);
  background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:999px;
  font-size:13px; opacity:0; pointer-events:none; transition:.22s ease; z-index:99;
}
.toast.show{opacity:.94; transform:translateX(-50%) translateY(0)}
.backtop{
  position:fixed; right:22px; bottom:22px; z-index:50; border-radius:999px;
  width:40px; height:40px; display:none; align-items:center; justify-content:center;
  background:var(--panel); box-shadow:var(--shadow);
}
.backtop.show{display:flex}
/* 打印稿：顶部补一行署名（页面顶栏在打印时隐藏） */
.print-credit{display:none}
@media (max-width:640px){
  .q-id{font-size:13px}
  .brand{min-width:0}
  .search{flex:1 1 100%}
}
@media print{
  .sidebar,.topbar,.q-actions,.view-head,.backtop,.draft,.quiz-panel,.single-bar{display:none !important}
  .print-credit{display:block !important; text-align:center; font-size:12px; font-weight:700; letter-spacing:.05em; margin:0 0 10px}
  .layout{display:block; padding:0}
  .q{break-inside:avoid; box-shadow:none}
  .q-answer{display:block !important}
  .print-no-answers .q-answer{display:none !important}

  /* 打印时让长代码块换行，避免溢出纸面 */
  .code-block pre{overflow:visible; white-space:pre-wrap; word-break:break-word}
  .code-block pre code{white-space:pre-wrap; font-size:10.5px}
  .table-wrap{overflow:visible; width:100%}
  .prose table{font-size:9.5px; table-layout:fixed}
  .prose th,.prose td{padding:2px 4px; word-break:break-word; overflow-wrap:anywhere}
  .math-display{white-space:normal}
}
</style>
</head>
<body>
<div class="print-credit">Powered by Sept, 2026.</div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <b id="brandTitle">ICS 刷题台</b>
      <span><a href="../" title="返回 ICS 题库首页">← ICS 题库</a> · <span id="brandSub"></span></span>
    </div>
    <span class="chip" id="countdownChip">考试倒计时 …</span>
    <span class="chip muted" id="totalChip">共 0 题</span>
    <span class="brand-badge">Powered by Sept, 2026.</span>
    <span class="spacer"></span>
    <input type="search" id="search" class="search" placeholder="搜索题号 / 考点 / 年份 / 题干…">
    <button id="btnRandom">🎲 随机 15 题</button>
    <button id="btnRevealAll" class="primary">显示全部答案</button>
    <button id="btnTheme" class="ghost" title="切换深色 / 浅色">◐</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="side-sec">
      <div class="side-title">进度</div>
      <div class="progress"><i id="progBar"></i></div>
      <div class="stat-row">
        <div class="stat"><b id="stOk">0</b><span>已掌握</span></div>
        <div class="stat"><b id="stReview">0</b><span>待复习</span></div>
        <div class="stat"><b id="stStar">0</b><span>收藏</span></div>
        <div class="stat"><b id="stSeen">0</b><span>看过答案</span></div>
        <div class="stat"><b id="stRight">0</b><span>判对</span></div>
        <div class="stat"><b id="stWrong">0</b><span>判错</span></div>
      </div>
      <div class="side-btns" style="margin-top:9px">
        <button id="btnOnlyTodo" class="ghost">只看未掌握</button>
        <button id="btnReset" class="ghost">重置进度</button>
      </div>
      <label class="sb" style="margin-top:8px; font-size:12.5px; color:var(--muted); display:flex; gap:5px; align-items:center">
        <input type="checkbox" id="cbAutoMark" checked> 判分后自动标记（对→掌握 / 错→待复习）
      </label>
      <label style="margin-top:6px; font-size:12.5px; color:var(--muted); display:flex; gap:5px; align-items:center; flex-wrap:wrap">
        多选给分：
        <select id="selPartial" style="font-size:12.5px; padding:2px 6px">
          <option value="half">漏选给一半分</option>
          <option value="ratio">漏选按选项数给分</option>
          <option value="strict">必须完全一致（漏选 0 分）</option>
        </select>
      </label>
    </div>

    <div class="side-sec">
      <div class="side-title">视图</div>
      <div class="side-btns" id="viewBtns">
        <button data-view="quiz" class="active">刷题</button>
        <button data-view="draft">草稿区</button>
        <button data-view="cheat">速查 / 精讲</button>
        <button data-view="card">答题卡</button>
      </div>
    </div>

    <div class="side-sec">
      <div class="side-title">分区</div>
      <div class="filter-list" id="filtPart"></div>
    </div>

    <div class="side-sec">
      <div class="side-title">讲次</div>
      <div class="filter-list" id="filtLec"></div>
    </div>

    <div class="side-sec">
      <div class="side-title">状态</div>
      <div class="filter-list" id="filtState"></div>
    </div>

    <div class="side-sec">
      <div class="side-title">年份</div>
      <div class="side-btns" id="filtYear"></div>
    </div>

    <div class="side-sec">
      <div class="side-title">题型</div>
      <div class="side-btns" id="filtType"></div>
    </div>
  </aside>

  <main>
    <section id="view-quiz" class="view active">
      <div class="view-head">
        <b id="quizCount">…</b>
        <span class="count" id="quizDesc"></span>
        <span class="spacer"></span>
        <button id="btnCollapseAll">收起全部答案</button>
        <button id="btnClearFilter" class="ghost">清空筛选</button>
        <input type="text" id="jumpTo" placeholder="题号，如 B144" size="11" title="输入题号后回车或点「跳转」">
        <button id="btnJump" class="ghost">跳转</button>
        <button id="btnSingle" class="primary">🧭 单题刷题</button>
        <button id="btnPrint" class="ghost" title="调用浏览器打印对话框（Ctrl/⌘+P），按当前设置输出：练习卷（不含答案）或答案册（含答案），也可另存为 PDF">🖨 打印 / 存 PDF</button>
        <button id="btnPrintToggle" class="ghost" title="切换打印稿是否印出参考答案：不含答案＝空白练习卷，含答案＝答案册">打印稿：含答案</button>
      </div>
      <div class="single-bar" id="singleBar" hidden>
        <button id="sbPrev">← 上一题</button>
        <span class="pos" id="sbPos">1 / 1</span>
        <button id="sbNext">下一题 →</button>
        <span class="bar"><i id="sbProgress"></i></span>
        <span class="sep"></span>
        <button id="sbReveal">显示答案</button>
        <button id="sbGrade">判分</button>
        <button id="sbOk">✓ 已掌握</button>
        <button id="sbReview">✗ 待复习</button>
        <span class="sep"></span>
        <label class="sb"><input type="checkbox" id="sbShuffle"> 随机顺序</label>
        <label class="sb"><input type="checkbox" id="sbAutoNext"> 判对后自动下一题</label>
        <span class="spacer"></span>
        <button id="sbExit" class="ghost">回到列表</button>
      </div>
      <div id="quizList"></div>
    </section>

    <section id="view-draft" class="view">
      <div class="view-head">
        <b>草稿区</b>
        <span class="count" id="draftSum">还没有草稿</span>
        <span class="spacer"></span>
        <button id="btnExportDrafts">⬇ 导出全部草稿 .md</button>
        <button id="btnClearDrafts" class="ghost">清空全部草稿</button>
      </div>
      <div id="freeDraft"></div>
      <div id="draftList"></div>
    </section>

    <section id="view-cheat" class="view">
      <div class="view-head">
        <b>速查表 &amp; 考点精讲</b>
        <span class="count">公式 · 表格 · 陷阱 · 答题模板</span>
      </div>
      <div class="tabs">
        <button id="tabCheat" class="active">考前速查表</button>
        <button id="tabKnow">考点精讲（含 LaTeX 公式）</button>
      </div>
      <div id="cheatBody" class="prose cheat"></div>
      <div id="knowBody" class="prose cheat" hidden></div>
    </section>

    <section id="view-card" class="view">
      <div class="view-head">
        <b>答题卡</b>
        <span class="count">点题号跳到该题；颜色代表你的自评状态</span>
      </div>
      <div class="card-legend">
        <span><i style="background:var(--ok)"></i>已掌握</span>
        <span><i style="background:var(--warn)"></i>待复习</span>
        <span><i style="background:var(--accent)"></i>看过答案</span>
        <span><i style="background:var(--star)"></i>收藏</span>
        <span><i style="background:var(--line)"></i>未做</span>
      </div>
      <div id="cardBody"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>
<button class="backtop" id="backtop" title="回到顶部">↑</button>

<script type="application/json" id="ics-data">{"meta":{"title":"ICS 第二次阶段测验 · 刷题台","subtitle":"覆盖第 10–18 讲 · 2025 第二次阶段测验全卷 + 历年期末补充","examDate":"2026-11-16","examTime":"08:00:00","lectureRange":"第 10–18 讲","examId":"stage2","examName":"第二次阶段测验","partASource":"2025 第二次阶段测验","total":24,"generatedAt":"2026-10-28"},"lectures":[{"id":"L10","name":"第 10 讲 · 处理器架构：ISA 与逻辑电路","short":"第 10 讲"},{"id":"L11","name":"第 11 讲 · 处理器架构：SEQ 顺序实现","short":"第 11 讲"},{"id":"L12","name":"第 12 讲 · 处理器架构：流水线 PIPE","short":"第 12 讲"},{"id":"L13","name":"第 13 讲 · 存储层次","short":"第 13 讲"},{"id":"L14","name":"第 14 讲 · Cache","short":"第 14 讲"},{"id":"L15","name":"第 15 讲 · 程序优化","short":"第 15 讲"},{"id":"L16","name":"第 16 讲 · 链接","short":"第 16 讲"},{"id":"L17","name":"第 17 讲 · ECF：异常与进程","short":"第 17 讲"},{"id":"L18","name":"第 18 讲 · ECF：信号与非本地跳转","short":"第 18 讲"}],"years":["2025"],"parts":["A"],"types":["填空 / 补全","计算 / 综合","选择题"],"questions":[{"id":"A1","part":"A","num":1,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"A · 第 10 讲（ISA 与逻辑电路，12 分）","subsection":"","score":"ISA 与逻辑电路，12 分","lec":"L10","lecs":["L10","L15"],"type":"选择题","tags":["ISA"],"bodyHtml":"\u003cp>（不定项选择，2 分）以下描述，哪些属于 ISA 规定的内容：\u003c/p>","answerHtml":"\u003cp>ABCFG\u003c/p>\n\u003cp>ISA 规定的是程序员 / 编译器可见的架构状态与行为：寄存器组（A）、条件码（B）、call 的压栈语义（C）、内存字节寻址与小端字节序（F）、寄存器加偏移的寻址模式（G）。而「前 2 个参数放 rdi/rsi」（D）与「返回值放 rax」（E）属于\u003cstrong>调用约定（ABI）\u003c/strong>，是软件层面的约定而非 ISA 硬件强制，故不选。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"multi","answer":["A","B","C","F","G"],"options":[{"key":"A","text":"有 15 个通用寄存器，每个寄存器 64 位"},{"key":"B","text":"有 3 个条件码，分别是 ZF、SF、OF"},{"key":"C","text":"过程调用指令（call）会将下一条指令地址压入栈中"},{"key":"D","text":"过程调用的前 2 个参数放在寄存器 rdi、rsi"},{"key":"E","text":"过程调用返回值放在寄存器 rax"},{"key":"F","text":"内存是字节寻址的，字节序采用小端法"},{"key":"G","text":"访存指令支持寄存器加偏移的寻址模式"}]}},{"id":"A2","part":"A","num":2,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"A · 第 10 讲（ISA 与逻辑电路，12 分）","subsection":"","score":"ISA 与逻辑电路， e-block lang-text\">\u003cpre>\u003ccode>int aluA = [\n    icode in { IRRMOVQ, ____ } : valA;\n    icode in { IIRMOVQ, ____, IMRMOVQ } : valC;\n    icode in { ____, IPUSHQ } : ____;\n    icode in { ____, IPOPQ } : ____;\n    # Other instructions don't need ALU\n];\u003c/code>\u003c/pre>\u003c/div>","answerHtml":"\u003cp>表格 2 空为 \u003ccode>call\u003c/code> 的 \u003ccode>-8\u003c/code> 与 \u003ccode>ret\u003c/code> 的 \u003ccode>8\u003c/code>；HCL 6 空为 \u003ccode>IOPQ\u003c/code>、\u003ccode>IRMMOVQ\u003c/code>、\u003ccode>ICALL\u003c/code>、\u003ccode>-8\u003c/code>、\u003ccode>IRET\u003c/code>、\u003ccode>8\u003c/code>。\u003c/p>\n\u003cp>补全后的 Execute 表：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>指令\u003c/th>\u003cth>Execute\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>OPq rA, rB\u003c/td>\u003ctd>valE ← valB OP valA\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cmovXX rA, rB\u003c/td>\u003ctd>valE ← 0 + valA\u003c/td>\u003c/tr>\u003ctr>\u003ctd>rmmovq rA, D(rB)\u003c/td>\u003ctd>valE ← valB + valC\u003c/td>\u003c/tr>\u003ctr>\u003ctd>popq rA\u003c/td>\u003ctd>valE ← valB + 8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>jXX Dest\u003c/td>\u003ctd>（不需要 ALU，留空）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>call Dest\u003c/td>\u003ctd>valE ← valB + (-8)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ret\u003c/td>\u003ctd>valE ← valB + 8\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>完整 HCL：\u003c/p>\n\u003cdiv class=\"code-block lang-text\">\u003cpre>\u003ccode>int aluA = [\n    icode in { IRRMOVQ, IOPQ } : valA;\n    icode in { IIRMOVQ, IRMMOVQ, IMRMOVQ } : valC;\n    icode in { ICALL, IPUSHQ } : -8;\n    icode in { IRET, IPOPQ } : 8;\n    # Other instructions don't need ALU\n];\u003c/code>\u003c/pre>\u003c/div>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["IOPQ"],["IRMMOVQ"],["ICALL"],["-8"],["IRET"],["8"]]}},{"id":"A7","part":"A","num":7,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"C · 第 12 讲（流水线，16 分）","subsection":" ode> 指令在流水级 ____ 阶段时，会检测到数据冒险。此时运用了数据前递技术，其中在流水级 ____ 阶段的指令前递数据 ____ 作为操作数 \u003ccode>%rax\u003c/code> 的值。\u003c/p>","answerHtml":"\u003cp>D/Decode/译码（任一都对）；M；2。\u003c/p>\n\u003cp>\u003ccode>addq\u003c/code> 在译码（D）阶段读源寄存器 %rax，此时产生 %rax 的 \u003ccode>irmovq $2,%rax\u003c/code> 正处于 M（访存）阶段，故在 D 阶段检测到数据冒险；通过数据前递，把 M 阶段指令的结果 2 前递作为 %rax 的操作数值。\u003c/p>","ansKind":"官方答案","auto":{"type":"fill","blanks":[{"any":["D","Decode","译码","d"]},["M"],["2"]]}},{"id":"A9","part":"A","num":9,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"C · 第 12 讲（流水线，16 分）","subsection":"","score":"流水线，16 分","lec":"L12","lecs":["L12","L10"],"type":"计算 / 综合","tags":["Y86-64","数据前递","load-use"],"bodyHtml":"\u003cp>（4 分）写出一段存在 Load-use 相关的 Y86-64 汇编代码（要求代码简洁明了），并说明能否用数据前递技术解决，为什么？\u003c/p>","answerHtml":"\u003cp>代码示例（2 分）：\u003c/p>\n\u003cdiv class=\"code-block lang-text\">\u003cpre>\u003ccode>mrmovq 0(%rdx),%rax\naddq %rbx,%rax\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>注意：代码不用一模一样，关键点是前一条指令读内存到某个寄存器（这里是 rax），后一条指令要读取这个寄存器。\u003c/p>\n\u003cp>&quot;Load-use&quot;不能用数据前递技术解决（2 分）：因为上面的 add 指令在译码阶段就要&quot;use&quot;，这时前一条指令还在执行阶段，还有一个周期才能到访存阶段进行&quot;load&quot;。\u003c/p>\n\u003cp>注意：如果回答用数据前递技术可以部分解决，也算对。\u003c/p>","ansKind":"官方答案","auto":null},{"id":"A10","part":"A","num":10,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"C · 第 12 讲（流水线，16 分）","subsection":"","score":"流水线，16 分","lec":"L12","lecs":["L12","L10"],"type":"计算 / 综合","tags":["Y86-64","load-use"],"bodyHtml":"\u003cp>（2 分）写出一段存在 Load-use 相关和 \u003ccode>ret\u003c/code> 组合的 Y86-64 汇编代码（要求代码简洁明了）。\u003c/p>","answerHtml":"\u003cp>代码示例（2 分）：\u003c/p>\n\u003cdiv class=\"code-block lang-text\">\u003cpre>\u003ccode>mrmovq 0(%rdx),%rsp\nret\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>注意：代码不用一模一样，关键点是前一条指令读内存到 rsp 寄存器，后一条指令是 ret。\u003c/p>","ansKind":"官方答案","auto":null},{"id":"A11","part":"A","num":11,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"D · 第 13 讲（存储层次，14 分）","subsection":"","score":"存储层次，14 分","lec":"L13","lecs":["L13","L14"],"type":"填空 / 补全","tags":["SRAM","DRAM"],"bodyHtml":"\u003cp>（2 分）对比同样容量的 SRAM 和 DRAM，功耗更高是 ____，价格更低是 ____。\u003c/p>","answerHtml":"\u003cp>SRAM；DRAM。\u003c/p>\n\u003cp>SRAM 用触发器存位、单元晶体管多、功耗高但速度快；DRAM 用电容存位、单元简单、密度高、价格低但需刷新。\u003c/p>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["SRAM"],["DRAM"]]}},{"id":"A12","part":"A","num":12,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"D · 第 13 讲（存储层次，14 分）","subsection":"","score":"存储层次，14 分","lec":"L13","lecs":["L13"],"type":"填空 / 补全","tags":["ROM"],"bodyHtml":"\u003cp>（判断对错，2 分）ROM 是只读存储器的简称，是非易失性存储器，掉电不会丢失数据，只能读不能写。对还是错：____\u003c/p>","answerHtml":"\u003cp>错。\u003c/p>\n\u003cp>&quot;非易失、掉电不丢数据&quot;是对的，但&quot;只能读不能写&quot;错：现代 ROM（EPROM / EEPROM / Flash）均可编程写入，&quot;只读&quot;指正常工作方式下以读为主，并非物理上不可写。\u003c/p>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["错"]],"labels":["1"]}},{"id":"A13","part":"A","num":13,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"D · 第 13 讲（存储层次，14 分）","subsection":"","score":"存储层次，14 分","lec":"L13","lecs":["L13","L14"],"type":"计算 / 综合","tags":["DRAM"],"bodyHtml":"\u003cp>（4 分）下图是一根 DDR3 SDRAM 内存条，数据位宽是 64-bit，总容量为 2GB，由 8 颗内存芯片构成。如果一个计算机系统只有这根内存条作为全部内存，那往地址 \u003ccode>0x01001000\u003c/code> 写一个 64-bit 数 \u003ccode>0x12345678\u003c/code>，这个数会放在内存条上从左向右数第几颗（或哪几颗）内存芯片中？并解释这样存放的原因。\u003c/p>\n\u003cp>\u003cimg class=\"md-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAkUAAACMCAIAAAD9ZErDAAAACXBIWXMAACHVAAAh1QEEnLSdAAHPB0lEQVR4nOy9B7Rd5XXvS2IbUDll935672X3vVfvvexyqk5T7+WoV4QaIATSUUcF414Sv+TmvZc7bppvblziAqbYxiW248SYJlABIYEQd659JAG2hR0pssIgY/zGOt/+1jprr/XtOed/zlXveOedM6+/9eK5Sy+/eP7X//Qv3/jnF5/6wYV/e/btFx6/8G9fP/3T773x638+9YtvvvSLZy+efvK1U9889dy3zrz4+IXTX3/tFPD4udPPnDn7/dNnfnj69I9fPf2TV07/9BVrCjx7+pXvn3nlqXOvfO/1U5PAvz997tQPzp760elTP3n1pR+ffumHZ2+QH5x96ZmzLz9z7tT1eOrMS5M8ffbla1ybC1tybav+mDzx+qnHgfM3yBO3Y5tvnpvZ5cdvZrRfe/kbrz73tVP//u1zLz715hloP/PmuacunvnehVd/ePn8E2+88p3XXoL2M5fOwRSAxQBowPfC9AcXzz55+sWv/vxHP7pw9olTv3727Kv/euGN7z7/b98Huz1z6oenX/7hqy/99OyrTz3/ "tags":["SSD"],"bodyHtml":"\u003cp>（不定项选择，2 分）机械硬盘和固态硬盘（SSD）对比，在主流产品形态下，下列属于后者特点的是：\u003c/p>","answerHtml":"\u003cp>ABCD\u003c/p>\n\u003cp>SSD 无机械部件，速度快、抗震耐摔、噪音小、体积小；但同容量价格更高（E 错）、闪存有写入寿命限制（F 错）。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"multi","answer":["A","B","C","D"],"options":[{"key":"A","text":"速度快"},{"key":"B","text":"抗震耐摔"},{"key":"C","text":"运行噪音小"},{"key":"D","text":"体积小"},{"key":"E","text":"同样容量的价格更低"},{"key":"F","text":"支持写入的寿命更长"}]}},{"id":"A15","part":"A","num":15,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"D · 第 13 讲（存储层次，14 分）","subsection":"","score":"存储层次，14 分","lec":"L13","lecs":["L13"],"type":"计算 / 综合","tags":["局部性"],"bodyHtml":"\u003cp>（4 分）下面这段代码哪些地方体现了局部性原理？分别体现了什么类型的局部性。\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>int sum_array_rows(int a[M][N])\n{\n    int i, j, sum = 0;\n    for (i = 0; i &lt; M; i++)\n        for (j = 0; j &lt; N; j++)\n            sum += a[i][j];\n    return sum;\n}\u003c/code>\u003c/pre>\u003c/div>","answerHtml":"\u003cp>共四种情况：指令、数据；空间、时间局部性。各 1 分：\u003c/p>\n\u003col>\u003cli>顺序执行的指令序列，体现空间局部性；\u003c/li>\u003cli>循环内部指令会反复执行，体现时间局部性；\u003c/li>\u003cli>sum 等变量反复被读写，体现时间局部性；\u003c/li>\u003cli>数组 a 中的数据按地址依次被读取，体现空间局部性。\u003c/li>\u003c/ol>","ansKind":"官方答案","auto":null},{"id":"A16","part":"A","num":16,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"E · 第 14 讲（Cache，16 分）","subsection":"","score":"Cache，16 分","lec":"L14","lecs":["L14"],"type":"计算 / 综合","tags":["Cache","三种 Miss"],"bodyHtml":"\u003cp>（6 分）高速缓存（Cache）的三种未命中（Miss）是什么，分别说明出现的场景。\u003c/p>","answerHtml":"\u003cp>三种名称各 1 分（中英文回答一种即可），把命中称为失效，也算对：\u003c/p>\n\u003cp>(1) 冷启不命中（义务不命中），Cold (compulsory) miss (2) 容量不命中，Capacity miss (3) 冲突不命中，Conflict miss\u003c/p>\n\u003cp>三种对应场景各 1 分（简要描述即可），详见第 13 讲课件第 8 页：\u003c/p>\n\u003cul>\u003cli>冷启：第一次访问某块，缓存中必然没有，不可避免；\u003c/li>\u003cli>容量：缓存容量不足以容纳工作集，块被替换后再次访问；\u003c/li>\u003cli>冲突：容量足够但映射到同一组的块过多，互相替换导致（直接映射 / 组相联特有）。\u003c/li>\u003c/ul>","ansKind":"官方答案","auto":null},{"id":"A17","part":"A","num":17,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"E · 第 14 讲（Cache，16 分）","subsection":"","score":"Cache，16 分","lec":"L14","lecs":["L14"],"type":"填空 / 补全","tags":["Cache","直接映射","写分配"],"bodyHtml":"\u003cp>（8 分）有一个计算机系统，存储地址空间为 64 字节；采用直接映射（Direct-mapped）的数据高速缓存（cache），其容量为 16 字节；每个高速缓存块（cache block）为 4 字节（B=4Byte/block）；采用写分配（write-allocate）、写返回（write-back）策略。Cache 的当前状态如下表（Tag 用二进制表示）。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>v\u003c/th>\u003cth>Tag\u003c/th>\u003cth>Block\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>set0\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>set1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>00\u003c/td>\u003ctd>Mem[4-7]\u003c/td>\u003c/tr>\u003ctr>\u003ctd>set2\u003c/td>\u003ctd>1\u003c/td>\u003ctd>10\u003c/td>\u003ctd>Mem[40-43]\u003c/td>\u003c/tr>\u003ctr>\u003ctd>set3\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>经过如下地址访问序列后（十进制表示，每次访问 1 个字节）：\u003ccode>18 40 50 16 43 48\u003c/code>，在上表中更新 Cache 的状态。这个序列过程中，该高速缓存发生 ____ 次 Hit 和 ____ 次 Miss。\u003c/p>","answerHtml":"\u003cp>2 次 Hit 和 4 次 Miss；更新后的 Cache 表：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>v\u003c/th>\u003cth>Tag\u003c/th>\u003cth>Block\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>set0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>11\u003c/td>\u003ctd>Mem[48-51]\u003c/td>\u003c/tr>\u003ctr>\u003ctd>set1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>00\u003c/td>\u003ctd>Mem[4-7]\u003c/td>\u003c/tr>\u003ctr>\u003ctd>set2\u003c/td>\u003ctd>1\u003c/td>\u003ctd>10\u003c/td>\u003ctd>Mem[40-43]\u003c/td>\u003c/tr>\u003ctr>\u003ctd>set3\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>（注：表格每行 2 分，一行全对才得分；填空每空 2 分）\u003c/p>\n\u003cp>推导：64 字节地址空间 = 6 位地址；块 4 字节 → 块内偏移 2 位；4 个组 → 组索引 2 位；Tag = 高 2 位（二进制）。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>访问\u003c/th>\u003cth>tag\u003c/th>\u003cth>set\u003c/th>\u003cth>结果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>18\u003c/td>\u003ctd>01\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Miss（冷启），装入 Mem[16-19]\u003c/td>\u003c/tr>\u003ctr>\u003ctd>40\u003c/td>\u003ctd>10\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Hit（set2 已有 tag10 / Mem[40-43]）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>50\u003c/td>\u003ctd>11\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Miss（冲突），替换 set0 为 Mem[48-51]\u003c/td>\u003c/tr>\u003ctr>\u003ctd>16\u003c/td>\u003ctd>01\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Miss（冲突），替换 set0 为 Mem[16-19]\u003c/td>\u003c/tr>\u003ctr>\u003ctd>43\u003c/td>\u003ctd>10\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Hit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>48\u003c/td>\u003ctd>11\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Miss（冲突），替换 set0 为 Mem[48-51]\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["2"],["4"]]}},{"id":"A18","part":"A","num":18,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"E · 第 14 讲（Cache，16 分）","subsection":"","score":"Cache，16 分","lec":"L14","lecs":["L14"],"type":"选择题","tags":["Cache"],"bodyHtml":"\u003cp>（2 分）Intel Core i7 CPU 的 L2 Cache 容量，最有可能是下面哪种：\u003c/p>","answerHtml":"\u003cp>C\u003c/p>\n\u003cp>L2 容量量级为数百 KB，256kB 最合理；4kB/32kB 太小（接近 L1），8MB 太大（接近 L3/LLC 之上）。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["C"],"options":[{"key":"A","text":"4kB"},{"key":"B","text":"32kB"},{"key":"C","text":"256kB"},{"key":"D","text":"8MB"}]}},{"id":"A19","part":"A","num":19,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"F · 第 15 讲（程序优化，4 分）","subsection":"","score":"程序优化，4 分","lec":"L15","lecs":["L15"],"type":"计算 / 综合","tags":["编译优化"],"bodyHtml":"\u003cp>（4 分）编译优化时会有两种限制情况，分别解释说明原因。\u003c/p>","answerHtml":"\u003cp>(1) 为什么有&quot;过程调用&quot;限制：过程调用可能存在&quot;边带效应&quot;的操作，例如改变某些全局变量或静态变量的值（1 分）；即使给定相同参数，过程调用的返回值可能会不同，如受全局变量影响等（1 分）。 (2) 为什么有&quot;存储器别名&quot;限制：两个看起来不同的内存引用，可能指向相同的内存位置（1 分）；一些编程语言（如 C 语言）允许这样的操作存在或者不检查这样的问题（1 分）。\u003c/p>","ansKind":"官方答案","auto":null},{"id":"A20","part":"A","num":20,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"G · 第 16 讲（链接，10 分）","subsection":"","score":"链接，10 分","lec":"L16","lecs":["L16"],"type":"选择题","tags":["链接","符号解析"],"bodyHtml":"\u003cp>（不定项选择，2 分）下面这段代码中，属于链接器要解析的符号包括：\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>#include &lt;stdio.h&gt;\nint cnt = 10;\nextern void print_value(int x);\nint main() {\n    int val = 5;\n    print_value(val + cnt);\n    return 0;\n}\u003c/code>\u003c/pre>\u003c/div>","answerHtml":"\u003cp>ADEG\u003c/p>\n\u003cp>（原卷答案如此。按 CSAPP 符号解析的严格定义，链接器解析的全局符号为 cnt(D)、print_value(E)、main(G)；\u003ccode>include\u003c/code> 实为预处理指令、并非符号，原卷将 A 计入属宽泛口径，复习时以 D/E/G 为核心。）\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"multi","answer":["A","D","E","G"],"options":[{"key":"A","text":"include"},{"key":"B","text":"stdio.h"},{"key":"C","text":"int"},{"key":"D","text":"cnt"},{"key":"E","text":"print_value"},{"key":"F","text":"x"},{"key":"G","text":"main"},{"key":"H","text":"val"}]}},{"id":"A21","part":"A","num":21,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"G · 第 16 讲（链接，10 分）","subsection":"","score":"链接，10 分","lec":"L16","lecs":["L16","L10"],"type":"计算 / 综合","tags":[],"bodyHtml":"\u003cp>（8 分）下面是一段 C 代码 main.c 和对应目标文件 main.o 反汇编得到的代码。\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>int array[2] = {1, 2};\nint main(int argc, char** argv){\n    int val = sum(array, 2);\n    return val;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"code-block lang-text\">\u003cpre>\u003ccode>0000000000000000 &lt;main&gt;:\n   0:   55                     push   %rbp\n   1:   48 89 e5               mov    %rsp,%rbp\n   4:   48 83 ec 20            sub    $0x20,%rsp\n   8:   89 7d ec               mov    %edi,-0x14(%rbp)\n   b:   48 89 75 e0            mov    %rsi,-0x20(%rbp)\n   f:   be 02 00 00 00         mov    $0x2,%esi\n  14:   bf 00 00 00 00         mov    $0x0,%edi\n  19:   e8 00 00 00 00         callq  1e &lt;main+0x1e&gt;\n  1e:   89 45 fc               mov    %eax,-0x4(%rbp)\n  21:   8b 45 fc               mov    -0x4(%rbp),%eax\n  24:   c9                     leaveq\n  25:   c3                     retq\u003c/code>\u003c/pre>\u003c/div>\n\u003col>\u003cli>地址 14 对应的 mov 指令，为什么要把 0 放到 edi 寄存器中？按源代码看，应该是要放什么数，这里为什么是 0，后续还会有什么操作？\u003c/li>\u003cli>地址 19 对应的 callq 指令，看起来会转到地址 1e，即下一条指令，这不合常理，为什么？\u003c/li>\u003c/ol>","answerHtml":"\u003cp>(1) 要放到 edi 中的数据是数组 array 的首地址（1 分）；编译成目标文件时，array 数组在内存中的位置还不确定，所以用 0 代替（1 分）；后续由链接器（1 分）进行重定位（1 分），填上正确的数值。注：描述不用一模一样，按上述标记分数的关键点给分。 (2) callq 指令要跳转到 sum 函数的起始地址（1 分）；编译成目标文件时，sum 函数在内存中的位置还不确定，所以用 0 代替（1 分）；按照 callq 指令的编码规则，指令中保存的是 callq 下一条指令和要跳转的目标地址的差值，因为现在用 0 填充，所以反汇编显示成下一条指令的地址，即 1e（2 分）。注：描述不用一模一样，按上述标记分数的关键点给分。\u003c/p>","ansKind":"官方答案","auto":null},{"id":"A22","part":"A","num":22,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"H · 第 17 讲（ECF：异常与进程，12 分）","subsection":"","score":"ECF：异常与进程，12 分","lec":"L17","lecs":["L17"],"type":"计算 / 综合","tags":["异常","Faults"],"bodyHtml":"\u003cp>（3 分）整数运算中有可能会出现&quot;除 0 异常&quot;，如果这是属于 Faults 类型的异常，是否可以在异常处理程序中，将结果修改成某个特殊值，例如全为 1 的二进制数，然后继续执行该程序（指整数运算那个程序）后续指令？\u003c/p>","answerHtml":"\u003cp>不可以（1 分）。Faults 类型的异常，从异常处理程序返回后，要重新执行这条&quot;除 0&quot;指令，导致再次发生异常。所以只能终止该进程。（2 分）\u003c/p>\n\u003cp>注：如果一开始的结论就不对，后面如何解读都不得分。\u003c/p>","ansKind":"官方答案","auto":null},{"id":"A23","part":"A","num":23,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"H · 第 17 讲（ECF：异常与进程，12 分）","subsection":"","score":"ECF：异常与进程，12 分","lec":"L17","lecs":["L17"],"type":"填空 / 补全","tags":["fork"],"bodyHtml":"\u003cp>（3 分）阅读下面这段程序：\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>#include &lt;stdio.h&gt;\n#include &lt;unistd.h&gt;\nint main() {\n    printf(&quot;A\\n&quot;);\n    pid_t pid = fork();\n    if (pid == 0) {\n        printf(&quot;B\\n&quot;);\n    } else {\n        printf(&quot;C\\n&quot;);\n        fork();\n    }\n    printf(&quot;D\\n&quot;);\n    return 0;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>该程序正常运行后，问：\u003c/p>\n\u003col>\u003cli>会输出几次 D：____\u003c/li>\u003cli>B 和 C 哪个先输出：____\u003c/li>\u003cli>ACDBDD 这个输出序列是否可能：是 / 否\u003c/li>\u003c/ol>","answerHtml":"\u003col>\u003cli>3 次\u003c/li>\u003cli>不确定\u003c/li>\u003cli>是（√）\u003c/li>\u003c/ol>\n\u003cp>进程树：父 P 打印 A 后 fork 出子 C1；C1 打印 B，P 打印 C 后再 fork 出子 C2；P、C1、C2 各自打印一次 D，共 3 次。B/C 先后取决于调度，不确定。ACDBDD 是一种合法交错。\u003c/p>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["3"],{"any":["不确定","无法确定","不一定"]},{"any":["是","可能","√"]}]}},{"id":"A24","part":"A","num":24,"year":"2025","source":"2025 第二次阶段测验","ref":"","section":"H · 第 17 讲（ECF：异常与进程，12 分）","subsection":"","score":"ECF：异常与进程，12 分","lec":"L17","lecs":["L17"],"type":"选择题","tags":["fork","进程","wait"],"bodyHtml":"\u003cp>（6 分）阅读下面这段程序：\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>#include &lt;stdio.h&gt;\n#include &lt;unistd.h&gt;\n#include &lt;sys/wait.h&gt;\nint x = 1;\nint main() {\n    printf(&quot;start: x = %d\\n&quot;, x);\n    pid_t pid1 = fork();\n    if (pid1 == 0) {\n        x += 1;\n        printf(&quot;x = %d\\n&quot;, x);\n        sleep(1);\n        pid_t pid2 = fork();\n        if (pid2 == 0) {\n            x += 2;\n            printf(&quot;x = %d\\n&quot;, x);\n        } else {\n            x += 3;\n            printf(&quot;x = %d\\n&quot;, x);\n            wait(NULL);\n        }\n    } else {\n        x += 4;\n        printf(&quot;x = %d\\n&quot;, x);\n        wait(NULL);\n        printf(&quot;x = %d\\n&quot;, x);\n    }\n    return 0;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003col>\u003cli>（2 分）这个程序正常运行，会产生几个进程？____\u003c/li>\u003cli>（2 分）总共会输出多少行？____\u003c/li>\u003cli>（2 分）最后一行输出是：____\u003c/li>\u003c/ol>\n\u003cdiv class=\"code-block lang-text\">\u003cpre>\u003ccode>A. x=2\nB. x=3\nC. x=4\nD. x=5\nE. x=6\nF. 不确定\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>","answerHtml":"\u003col>\u003cli>3\u003c/li>\u003cli>6\u003c/li>\u003cli>D\u003c/li>\u003c/ol>\n\u003cp>进程：父 P、子 C1（pid1==0）、孙 C2（C1 内 pid2==0），共 3 个。输出 6 行：start、C1 的 x=2、C2 的 x=4、C1 的 x=5、P 的 x=5、P 的 x=5。因 P 与 C1 均 wait 子进程，最后一行必为 P 的第二次打印 x=5，即 D。\u003c/p>\n\u003chr>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["3"],["6"],["D"]]}}],"cheatsheetHtml":"\u003ch1>第二次阶段测验 · 考前速查表\u003c/h1>\n\u003cblockquote>\u003cp>缩到最短的考点清单，考前 10 分钟读一遍即可。题目见 \u003cspan class=\"reflink\" title=\"题目汇编.md\">题目汇编.md\u003c/span>，详解见 \u003cspan class=\"reflink\" title=\"参考答案.md\">参考答案.md\u003c/span>。 讲次为 2026 年编号（第 10–18 讲）；2025 原卷编号整体 −1。\u003c/p>\u003c/blockquote>\n\u003ch2>第 10 讲 · 处理器架构：ISA 与逻辑电路\u003c/h2>\n\u003cul>\u003cli>ISA ＝ 程序员可见的架构状态与行为：寄存器组、条件码、指令语义、寻址模式、字节序、call/ret 的栈语义。\u003c/li>\u003cli>\u003cstrong>调用约定（ABI）不属于 ISA\u003c/strong>：参数放 rdi/rsi、返回值放 rax 是软件约定。\u003c/li>\u003cli>Y86-64 只有 4 个条件码：ZF、SF、OF、CF（x86-64 有更多，Y86 精简）。\u003c/li>\u003cli>\u003ccode>rmmovq rA,D(rB)\u003c/code> 与 \u003ccode>mrmovq D(rB),rA\u003c/code> 都以 \u003cstrong>rB 为基址\u003c/strong>送地址加法器，硬件通路唯一、电路简单。\u003c/li>\u003cli>HCL 基本门：AND(\u003ccode>&amp;&amp;\u003c/code>)、OR(\u003ccode>||\u003c/code>)、NOT(\u003ccode>!\u003c/code>)；\u003ccode>eq=(a&amp;&amp;b)||(!a&amp;&amp;!b)\u003c/code> 是同或；\u003ccode>out=(s&amp;&amp;a)||(!s&amp;&amp;b)\u003c/code> 是 1-bit MUX（s=1 选 a）。\u003c/li>\u003cli>时序电路：寄存器在时钟上升沿采样；组合逻辑无状态。带反馈 MUX 的累加器逐拍迭代。\u003c/li>\u003c/ul>\n\u003ch2>第 11 讲 · 处理器架构：SEQ 顺序实现\u003c/h2>\n\u003cul>\u003cli>SEQ 每周期一条指令，六阶段：Fetch → Decode → Execute → Memory → Write back → PC update。\u003c/li>\u003cli>\u003ccode>popq rA\u003c/code>：Decode 读 \u003ccode>valA=valB=R[%rsp]\u003c/code>；Execute \u003ccode>valE=valB+8\u003c/code>；Memory \u003ccode>valM=M8[valA]\u003c/code>；Write back \u003ccode>R[%rsp]←valE\u003c/code>、\u003ccode>R[rA]←valM\u003c/code>；PC←valP。\u003c/li>\u003cli>\u003ccode>aluA\u003c/code> 选择：RRMOVQ/OPq→valA；IRMOVQ/RMMOVQ/MRMOVQ→valC；CALL/PUSHQ→−8；RET/POPQ→+8；jXX 不用 ALU。\u003c/li>\u003cli>\u003ccode>aluB\u003c/code> 恒为 valB；OPq 是 \u003ccode>valB OP valA\u003c/code>（注意顺序：B 在前）。\u003c/li>\u003cli>cmovXX：\u003ccode>valE ← 0 + valA\u003c/code>（用 ALU 做透传）。\u003c/li>\u003c/ul>\n\u003ch2>第 12 讲 · 处理器架构：流水线 PIPE\u003c/h2>\n\u003cul>\u003cli>单条指令延迟 = 各级（组合逻辑 + 寄存器开销）之和；满负荷吞吐 = 最慢一级周期。\u003c/li>\u003cli>均衡细分：把组合逻辑切成等长段，每段 + 寄存器开销 = 新周期；延迟 = 级数 × 新周期。\u003c/li>\u003cli>PIPE 五级：F / D / E / M / W。数据冒险在 \u003cstrong>D（译码）\u003c/strong> 阶段检测（读寄存器时）。\u003c/li>\u003cli>数据前递：把 M / W 阶段的结果旁路回 D/E；前递源看产生该寄存器值的指令当前所处阶段。\u003c/li>\u003cli>\u003cstrong>Load-use 冒险无法仅靠前递解决\u003c/strong>：use 在 D 阶段就要读，而 load 还在 E，需 stall（气泡）一拍。\u003c/li>\u003cli>load-use + ret 组合：\u003ccode>mrmovq D(rB),%rsp\u003c/code> 后紧跟 \u003ccode>ret\u003c/code>，需 stall 且控制逻辑特殊处理。\u003c/li>\u003cli>控制冒险：跳转目标在 D 才知道，预测不跳转、错则冲刷。\u003c/li>\u003c/ul>\n\u003ch2>第 13 讲 · 存储层次\u003c/h2>\n\u003cul>\u003cli>速度/价格金字塔：寄存器 &gt; Cache(SRAM) &gt; 主存(DRAM) &gt; SSD &gt; 磁盘 &gt; 磁带。\u003c/li>\u003cli>SRAM：触发器、快、贵、功耗高、不需刷新；DRAM：电容、慢、便宜、需刷新、非易失？→ \u003cstrong>易失\u003c/strong>。\u003c/li>\u003cli>ROM 非易失，但现代 ROM（EPROM/EEPROM/Flash）\u003cstrong>可写\u003c/strong>，&quot;只能读&quot;错。\u003c/li>\u003cli>内存条：位宽 64-bit 由多颗芯片\u003cstrong>并联分散\u003c/strong>提供（8 颗 × 8-bit），一次访问所有芯片同时工作 → 快。\u003c/li>\u003cli>SSD vs 磁盘：快、抗震、静音、体积小；但同容量贵、有写入寿命。\u003c/li>\u003cli>局部性：时间（反复访问同一地址）/ 空间（访问相邻地址）；对指令与数据都适用。\u003c/li>\u003cli>行优先遍历数组 = 步长 1 = 空间局部性好；列优先 = 步长 N = 差。\u003c/li>\u003c/ul>\n\u003ch2>第 14 讲 · Cache\u003c/h2>\n\u003cul>\u003cli>三种 Miss：冷启/义务（首次必miss）、容量（工作集 &gt; cache）、冲突（映射同组互相替换）。\u003c/li>\u003cli>地址划分：\u003ccode>| tag | set index | block offset |\u003c/code>；offset = log2(B)，index = log2(组数)，tag = 剩余。\u003c/li>\u003cli>直接映射：1 路，冲突多；组相联：E 路；全相联：1 组。\u003c/li>\u003cli>写策略：写命中 write-through / write-back；写不命中 write-allocate / no-write-allocate。write-back 常配 write-allocate。\u003c/li>\u003cli>模拟技巧：先把每个地址算成 (tag, set)，按序查表；hit/miss 计数；替换只动该 set。\u003c/li>\u003cli>容量量级：L1 数十 KB，L2 数百 KB（256kB），L3 数 MB–数十 MB。\u003c/li>\u003c/ul>\n\u003ch2>第 15 讲 · 程序优化\u003c/h2>\n\u003cul>\u003cli>编译器两大限制：\u003cstrong>过程调用\u003c/strong>（可能有边带效应、返回值受全局影响）与\u003cstrong>存储器别名\u003c/strong>（不同指针可能指同一地址）。\u003c/li>\u003cli>因别名/边带效应，编译器不敢做跨调用、跨指针的激进优化（如缓存内存值到寄存器、重排访存）。\u003c/li>\u003cli>优化手段：循环展开、提高并行度、减少过程调用、消除内存别名（restrict）、块划分利用局部性。\u003c/li>\u003cli>CPE = 每元素周期数，衡量内循环吞吐。\u003c/li>\u003c/ul>\n\u003ch2>第 16 讲 · 链接\u003c/h2>\n\u003cul>\u003cli>链接两任务：\u003cstrong>符号解析\u003c/strong>（把引用绑定到定义）与\u003cstrong>重定位\u003c/strong>（把符号地址填进代码/数据）。\u003c/li>\u003cli>全局符号（非 static 函数/全局变量）参与链接；局部符号（static、局部变量）不参与。\u003c/li>\u003cli>目标文件里未定地址用 \u003cstrong>0 占位\u003c/strong>，重定位条目记录位置与类型，链接时填真实地址。\u003c/li>\u003cli>\u003ccode>callq\u003c/code> 存的是\u003cstrong>相对偏移\u003c/strong>（目标 − 下一条指令地址）；未重定位时为 0，反汇编显示为下一条指令地址。\u003c/li>\u003cli>强/弱符号：强符号（函数、已初始化全局变量）不能重复定义；弱符号（未初始化全局变量）可被强符号覆盖。\u003c/li>\u003cli>静态链接 vs 动态链接：动态链接共享 .so，运行时加载、地址重定位（PLT/GOT）。\u003c/li>\u003c/ul>\n\u003ch2>第 17 讲 · ECF：异常与进程\u003c/h2>\n\u003cul>\u003cli>异常四类：中断（异步、外部）、陷阱（同步、有意、返回下一条）、故障 Faults（同步、可修复、\u003cstrong>返回当前指令\u003c/strong>）、终止 Aborts（不可修复、终止）。\u003c/li>\u003cli>\u003cstrong>Faults 返回后重执行原指令\u003c/strong> → 除 0 等不可修复 Fault 只能终止进程，不能改结果继续。\u003c/li>\u003cli>\u003ccode>fork()\u003c/code>：一次调用两次返回；子返回 0、父返回子 pid；子是父的\u003cstrong>副本\u003c/strong>（写时复制），地址空间独立。\u003c/li>\u003cli>进程数 = 1 + fork 成功次数；输出行数按进程树逐节点统计。\u003c/li>\u003cli>父子并发调度 → 交错顺序不确定；但 \u003ccode>wait()\u003c/code> 会强制先后。\u003c/li>\u003cli>\u003ccode>execve\u003c/code> 替换当前进程映像；\u003ccode>wait\u003c/code> 回收子进程。\u003c/li>\u003c/ul>\n\u003ch2>第 18 讲 · ECF：信号与非本地跳转\u003c/h2>\n\u003cul>\u003cli>信号 = 软件层的中断（异步、由内核递送）；\u003ccode>signal\u003c/code> 注册 handler，\u003ccode>kill\u003c/code> 发送。\u003c/li>\u003cli>信号不排队：同种信号阻塞期间只记一次（可能丢）。\u003c/li>\u003cli>handler 可能被慢系统调用打断 → 重启或返回 EINTR；handler 内只能用 async-signal-safe 函数。\u003c/li>\u003cli>\u003ccode>setjmp/longjmp\u003c/code>：非本地跳转，跨栈帧跳转；\u003ccode>setjmp\u003c/code> 返回 0（首次）/longjmp 传入值（之后）。\u003c/li>\u003cli>用信号 + setjmp/longjmp 实现超时、异常恢复（如 Shell 的 Ctrl-C）。\u003c/li>\u003c/ul>","knowledgeHtml":"\u003ch2>第二次阶段测验 · 考点精讲（第 10–18 讲）\u003c/h2>\n\u003cblockquote>\u003cp>与 \u003cspan class=\"reflink\" title=\"速查表.md\">速查表.md\u003c/span> 互补：速查表是考前清单，本页是带公式与推导的讲解。公式用 LaTeX 书写，网页中实时渲染。\u003c/p>\u003c/blockquote>\n\u003ch3>第 10 讲 · 处理器架构：ISA 与逻辑电路\u003c/h3>\n\u003cp>\u003cstrong>ISA 与 ABI 的边界。\u003c/strong> ISA（指令集架构）是硬件对软件的承诺：寄存器组、条件码、指令语义、寻址模式、字节序、\u003ccode>call\u003c/code>/\u003ccode>ret\u003c/code> 的栈语义。调用约定（参数放 \u003ccode>%rdi/%rsi\u003c/code>、返回值放 \u003ccode>%rax\u003c/code>）属于 ABI，是编译器与库之间的软件约定，\u003cstrong>不在 ISA 之内\u003c/strong>——这是选择题的高频陷阱。\u003c/p>\n\u003cp>\u003cstrong>Y86-64 的极简设计。\u003c/strong> 只有 4 个条件码（ZF、SF、OF、CF）、9 个寄存器用途（含 \u003ccode>%rsp\u003c/code>）、少量指令。访存指令统一为 \u003ccode>D(rB)\u003c/code> 形式：\u003c/p>\n\\[\\text{Addr} = D + R[rB]\\]\n\u003cp>\u003ccode>rmmovq\u003c/code> 与 \u003ccode>mrmovq\u003c/code> 都以 \u003ccode>rB\u003c/code> 为基址，硬件只需一条地址通路，省去多路选择器。\u003c/p>\n\u003cp>\u003cstrong>HCL 与门级电路。\u003c/strong> HCL 是描述控制/组合逻辑的硬件描述语言子集：\u003ccode>&amp;&amp;\u003c/code>、\u003ccode>||\u003c/code>、\u003ccode>!\u003c/code>、\u003ccode>case\u003c/code>（\u003ccode>[ ... ]\u003c/code>）。把布尔式画成门电路：\u003c/p>\n\u003cul>\u003cli>同或（判等）：\\(eq = (a \\land b) \\lor (\\lnot a \\land \\lnot b)\\)，用 2 个 NOT + 2 个 AND + 1 个 OR。\u003c/li>\u003cli>1-bit MUX：\\(out = (s \\land a) \\lor (\\lnot s \\land b)\\)，\\(s=1\\) 选 \\(a\\)、\\(s=0\\) 选 \\(b\\)，用 1 个 NOT + 2 个 AND + 1 个 OR。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>时序电路。\u003c/strong> 组合逻辑无记忆；时钟寄存器在上升沿采样输入。带反馈的「ALU + MUX + 寄存器」构成累加器：\u003c/p>\n\\[Q_{t+1} = \\begin{cases} In_t &amp; Load=1 \\\\ Q_t + In_t &amp; Load=0 \\end{cases}\\]\n\u003cp>逐拍迭代即可补全时序图。\u003c/p>\n\u003ch3>第 11 讲 · 处理器架构：SEQ 顺序实现\u003c/h3>\n\u003cp>SEQ 每时钟周期完成一条指令，六阶段依次为 Fetch、Decode、Execute、Memory、Write back、PC update。\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>popq rA\u003c/code> 的完整微操作\u003c/strong>（编码 \u003ccode>b0 rA 8\u003c/code>，2 字节）：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>阶段\u003c/th>\u003cth>微操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Fetch\u003c/td>\u003ctd>\\(icode:ifun \\leftarrow M_1[PC]\\)；\\(rA:rB \\leftarrow M_1[PC+1]\\)；\\(valP \\leftarrow PC+2\\)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Decode\u003c/td>\u003ctd>\\(valA \\leftarrow R[\\%rsp]\\)；\\(valB \\leftarrow R[\\%rsp]\\)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Execute\u003c/td>\u003ctd>\\(valE \\leftarrow valB + 8\\)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Memory\u003c/td>\u003ctd>\\(valM \\leftarrow M_8[valA]\\)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Write back\u003c/td>\u003ctd>\\(R[\\%rsp] \\leftarrow valE\\)；\\(R[rA] \\leftarrow valM\\)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PC update\u003c/td>\u003ctd>\\(PC \\leftarrow valP\\)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>关键：先用\u003cstrong>旧\u003c/strong> \u003ccode>%rsp\u003c/code>（valA）读内存，同时算出新栈顶 \u003ccode>valB+8\u003c/code>；写回时 \u003ccode>%rsp\u003c/code> 先被 valE 更新、再被 valM 覆盖的语义以课程 SEQ 实现为准（若 \u003ccode>rA=%rsp\u003c/code> 需注意写回顺序）。\u003c/p>\n\u003cp>\u003cstrong>ALU 的 A 口选择 \u003ccode>aluA\u003c/code>：\u003c/strong>\u003c/p>\n\\[aluA = \\begin{cases} valA &amp; icode \\in \\{IRRMOVQ,\\ IOPQ\\} \\\\ valC &amp; icode \\in \\{IIRMOVQ,\\ IRMMOVQ,\\ IMRMOVQ\\} \\\\ -8 &amp; icode \\in \\{ICALL,\\ IPUSHQ\\} \\\\ +8 &amp; icode \\in \\{IRET,\\ IPOPQ\\} \\end{cases}\\]\n\u003cp>B 口恒为 \\(valB\\)。注意 OPq 是 \\(valE = valB \\mathbin{OP} valA\\)（B 在前）；cmovXX 用 \\(0 + valA\\) 做透传；jXX 不用 ALU。\u003c/p>\n\u003ch3>第 12 讲 · 处理器架构：流水线 PIPE\u003c/h3>\n\u003cp>\u003cstrong>延迟与吞吐。\u003c/strong> 设各级组合逻辑为 \\(L_i\\)、寄存器开销为 \\(R\\)：\u003c/p>\n\\[\\text{单条延迟} = \\sum_i (L_i + R), \\qquad \\text{满负荷吞吐周期} = \\max_i (L_i + R)\\]\n\u003cp>\u003cstrong>均衡细分。\u003c/strong> 若把组合逻辑切成 \\(k\\) 段等长块（不跨原有寄存器边界），每段周期 \\(= \\frac{\\sum L_i}{k} + R\\)，则：\u003c/p>\n\\[\\text{新延迟} = k \\times \\left(\\frac{\\sum L_i}{k} + R\\right) = \\sum L_i + kR\\]\n\u003cp>细分会增加寄存器开销总和，故延迟反而上升、但吞吐变好。例：\\(40+160+80=280\\) ps 逻辑、\\(R=20\\) ps，按 40 ps 粒度切 7 级 → 周期 \\(60\\) ps、延迟 \\(420\\) ps。\u003c/p>\n\u003cp>\u003cstrong>数据冒险与前递。\u003c/strong> PIPE 五级 F/D/E/M/W。目的寄存器在 W 写回、源寄存器在 D 读取，故冒险在 \u003cstrong>D 阶段检测\u003c/strong>。前递把处于 M 或 W 阶段的结果旁路回执行端；前递源 = 产生该寄存器值的指令当前所处阶段。\u003c/p>\n\u003cp>\u003cstrong>Load-use 冒险。\u003c/strong> \u003ccode>mrmovq\u003c/code> 的数据要到 M 阶段才读出，而下一条指令在 D 就要用 → 前递来不及，必须 \u003cstrong>stall 一拍（气泡）\u003c/strong>。典型代码：\u003c/p>\n\u003cdiv class=\"code-block lang-text\">\u003cpre>\u003ccode>mrmovq 0(%rdx),%rax\naddq %rbx,%rax\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>load-use + ret。\u003c/strong> \u003ccode>ret\u003c/code> 依赖 \u003ccode>%rsp\u003c/code>，若 \u003ccode>%rsp\u003c/code> 刚被 \u003ccode>mrmovq\u003c/code> 加载：\u003c/p>\n\u003cdiv class=\"code-block lang-text\">\u003cpre>\u003ccode>mrmovq 0(%rdx),%rsp\nret\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>控制逻辑需同时处理 stall 与返回地址选择。\u003c/p>\n\u003ch3>第 13 讲 · 存储层次\u003c/h3>\n\u003cp>\u003cstrong>金字塔。\u003c/strong> 寄存器 → Cache(SRAM) → 主存(DRAM) → SSD → 磁盘。越往上越快越贵越小。\u003c/p>\n\u003cp>\u003cstrong>SRAM vs DRAM。\u003c/strong> SRAM 触发器存位（6 管）、不需刷新、快、贵、功耗高；DRAM 电容存位（1 管 1 容）、需周期刷新、慢、便宜、密度高。二者均\u003cstrong>易失\u003c/strong>。ROM 非易失，但 EPROM/EEPROM/Flash \u003cstrong>可写\u003c/strong>，「只能读」是错的。\u003c/p>\n\u003cp>\u003cstrong>内存条位宽。\u003c/strong> 一条 64-bit 内存条由多颗芯片\u003cstrong>并联\u003c/strong>提供位宽（8 颗 × 8-bit）。一次访问所有芯片同时工作，各自存 8-bit，合起来 64-bit → 并行读取更快。故一个 64-bit 数\u003cstrong>分散\u003c/strong>在全部 8 颗芯片。\u003c/p>\n\u003cp>\u003cstrong>SSD vs 机械盘。\u003c/strong> SSD：快、抗震、静音、体积小；但同容量贵、闪存有擦写寿命。\u003c/p>\n\u003cp>\u003cstrong>局部性。\u003c/strong> 时间局部性＝近期访问过的地址很可能再被访问；空间局部性＝访问某地址后其邻近地址很可能被访问。对指令与数据都成立：\u003c/p>\n\u003cul>\u003cli>顺序指令流 → 空间；循环体反复执行 → 时间；\u003c/li>\u003cli>标量（如 \u003ccode>sum\u003c/code>）反复读写 → 时间；数组按行顺序扫 → 空间。\u003c/li>\u003c/ul>\n\u003cp>行优先遍历 \u003ccode>a[i][j]\u003c/code> 步长为 1，空间局部性好；按列遍历步长为 \\(N \\times \\text{sizeof}\\)，差。\u003c/p>\n\u003ch3>第 14 讲 · Cache\u003c/h3>\n\u003cp>\u003cstrong>地址划分。\u003c/strong> 设地址 \\(m\\) 位、块 \\(B\\) 字节、\\(S\\) 组、\\(E\\) 路：\u003c/p>\n\\[\\text{offset} = \\log_2 B,\\quad \\text{index} = \\log_2 S,\\quad \\text{tag} = m - \\text{offset} - \\text{index}\\]\n\u003cp>\u003cstrong>三种 Miss。\u003c/strong>\u003c/p>\n\u003cul>\u003cli>冷启/义务（compulsory）：首次访问必 miss，与容量无关；\u003c/li>\u003cli>容量（capacity）：工作集超过 cache 总容量，块被替换后再访问；\u003c/li>\u003cli>冲突（conflict）：容量够但映射到同一组的块数超过 \\(E\\)，互相替换（直接映射 \\(E=1\\) 最严重）。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>写策略。\u003c/strong> 写命中：write-through（同时写下级）/ write-back（只写 cache、置脏位、替换时才写回）。写不命中：write-allocate（先调入再写）/ no-write-allocate。write-back 常配 write-allocate。\u003c/p>\n\u003cp>\u003cstrong>模拟方法。\u003c/strong> 把每个访问地址拆成 (tag, set)，按序查该 set：valid 且 tag 匹配 → Hit；否则 Miss 并按策略替换该 set。命中/miss 分别计数。\u003c/p>\n\u003cp>\u003cstrong>容量量级。\u003c/strong> L1 数十 KB、L2 数百 KB（如 256kB）、L3 数 MB 起。\u003c/p>\n\u003ch3>第 15 讲 · 程序优化\u003c/h3>\n\u003cp>\u003cstrong>编译器的两大限制。\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>过程调用\u003c/strong>：调用可能有边带效应（改全局/静态变量）；即使参数相同，返回值也可能因全局状态而不同 → 编译器不敢把调用结果缓存或跨调用重排。\u003c/li>\u003cli>\u003cstrong>存储器别名\u003c/strong>：两个看似不同的指针可能指向同一地址；C 不检查别名 → 编译器不敢假设两次访存独立，限制了重排与寄存器缓存。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>优化手段。\u003c/strong> 循环展开、提高指令级并行、消除不必要的内存引用、\u003ccode>restrict\u003c/code> 声明无别名、块划分（blocking）利用局部性、把内层循环步长降到 1。\u003c/p>\n\u003cp>\u003cstrong>CPE。\u003c/strong> cycles per element，内循环每元素平均周期数，衡量吞吐；越接近 1（或乱序机的发射上限）越好。\u003c/p>\n\u003ch3>第 16 讲 · 链接\u003c/h3>\n\u003cp>\u003cstrong>两大任务。\u003c/strong> 符号解析（把每个符号引用绑定到唯一定义）＋ 重定位（把符号的最终地址填进引用处）。\u003c/p>\n\u003cp>\u003cstrong>符号分类。\u003c/strong> 全局符号（非 static 函数、已/未初始化全局变量）参与链接；局部符号（static、函数内局部变量）不参与。\u003c/p>\n\u003cp>\u003cstrong>重定位占位。\u003c/strong> 编译成 \u003ccode>.o\u003c/code> 时，外部/未定地址用 \u003cstrong>0 占位\u003c/strong>，并在重定位表记录「位置 + 类型」。链接时按最终布局填真实值。\u003c/p>\n\u003cul>\u003cli>\u003ccode>mov $0x0,%edi\u003c/code>：本应放 \u003ccode>array\u003c/code> 首地址，位置未定故填 0，链接时重定位。\u003c/li>\u003cli>\u003ccode>callq\u003c/code> 存\u003cstrong>相对偏移\u003c/strong> \\(= \\text{target} - \\text{next\\_pc}\\)；未重定位时为 0，反汇编便显示成下一条指令地址。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>强/弱符号。\u003c/strong> 强＝函数与已初始化全局变量，不可重复定义；弱＝未初始化全局变量，可被强符号覆盖。重复强符号 → 链接错误。\u003c/p>\n\u003cp>\u003cstrong>静态 vs 动态链接。\u003c/strong> 静态把代码拷进可执行文件；动态共享 \u003ccode>.so\u003c/code>，运行时加载、经 PLT/GOT 做延迟绑定与地址重定位，省内存省磁盘、便于升级。\u003c/p>\n\u003ch3>第 17 讲 · ECF：异常与进程\u003c/h3>\n\u003cp>\u003cstrong>异常四分类。\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>类型\u003c/th>\u003cth>触发\u003c/th>\u003cth>返回\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>中断 interrupt\u003c/td>\u003ctd>异步、外部 I/O\u003c/td>\u003ctd>下一条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>陷阱 trap\u003c/td>\u003ctd>同步、有意（系统调用）\u003c/td>\u003ctd>下一条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>故障 fault\u003c/td>\u003ctd>同步、可修复\u003c/td>\u003ctd>\u003cstrong>当前指令（重执行）\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>终止 abort\u003c/td>\u003ctd>同步、不可修复\u003c/td>\u003ctd>不返回\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Faults 的语义。\u003c/strong> 从 fault 处理程序返回后\u003cstrong>重新执行\u003c/strong>触发指令。故「除 0」这类不可修复 fault 无法靠改结果继续——重执行会再次触发，只能终止进程。\u003c/p>\n\u003cp>\u003cstrong>fork。\u003c/strong> 一次调用、两次返回：子返回 0、父返回子 pid。子是父地址空间的副本（写时复制），此后各自独立。进程数 \\(= 1 + \\) 成功 fork 次数；输出行数按进程树逐节点累加。父子并发 → 交错顺序不确定；\u003ccode>wait()\u003c/code> 可强制父子先后。\u003c/p>\n\u003ch3>第 18 讲 · ECF：信号与非本地跳转\u003c/h3>\n\u003cp>\u003cstrong>信号。\u003c/strong> 软件层的中断，异步、由内核递送。\u003ccode>signal/handler\u003c/code> 注册、\u003ccode>kill\u003c/code> 发送。同种信号在阻塞期间\u003cstrong>不排队\u003c/strong>（可能合并/丢失）。handler 打断慢系统调用时需重启或返回 EINTR；handler 内只能用 async-signal-safe 函数。\u003c/p>\n\u003cp>\u003cstrong>setjmp/longjmp。\u003c/strong> 非本地跳转：\u003ccode>setjmp\u003c/code> 保存上下文并返回 0；之后任意深度的 \u003ccode>longjmp\u003c/code> 跳回该点并返回传入值（0 会被改成 1）。常用于超时、错误恢复、Shell 的 Ctrl-C 回到提示符。\u003c/p>"}</script>
<script>/* =========================================================================
 * render.js — 自包含的 Markdown + LaTeX 渲染器
 * 供「ICS 阶段测验一 · 刷题台」在构建期把题目/答案的 Markdown 渲染成 HTML。
 * 同时可在浏览器（window.ICS）与 Node（module.exports）中使用。
 * ========================================================================= */
(function (root, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.ICS = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  /* ----------------------------- 基础工具 ----------------------------- */

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function leadingSpaces(line) {
    var m = /^[ \t]*/.exec(line);
    return m ? m[0].replace(/\t/g, '    ').length : 0;
  }

  function isBlank(line) {
    return /^\s*$/.test(line);
  }

  /* ------------------- LaTeX（构建期原样透传给 MathJax） ------------------- */

  // 公式不在构建期排版：只输出 TeX 定界符，由页面内联的 MathJax tex-svg 渲染。
  function renderMath(src, display) {
    var tex = String(src == null ? '' : src);
    return (display ? '\\[' : '\\(') + escapeHtml(tex) + (display ? '\\]' : '\\)');
  }

  /* ------------------------- 行内 Markdown 解析 ------------------------- */

  var ESCAPABLE = '\\`*_{}[]()#+-.!|$>';

  function findUnescaped(text, needle, from) {
    var idx = from;
    while (true) {
      idx = text.indexOf(needle, idx);
      if (idx < 0) return -1;
      var back = 0;
      var p = idx - 1;
      while (p >= 0 && text[p] === '\\') { back++; p--; }
      if (back % 2 === 0) return idx;
      idx += needle.length;
    }
  }

  function renderInline(text) {
    var out = '';
    var i = 0;
    var n = text.length;
    while (i < n) {
      var c = text[i];

      // 反斜杠转义
      if (c === '\\' && i + 1 < n && ESCAPABLE.indexOf(text[i + 1]) >= 0) {
        out += escapeHtml(text[i + 1]);
        i += 2;
        continue;
      }
      // 行内公式 \( ... \)
      if (c === '\\' && text[i + 1] === '(') {
        var j1 = findUnescaped(text, '\\)', i + 2);

            var nInd = leadingSpaces(nxt);
            var nMk = listMarker(nxt);

            continue;

            cur.lines.push(' '.repeat(Math.max(0, ind - strip)) + l.slice(ind));
            i++;
            continue;
          }
          break;

        if (!items.length) { i++; continue; }
        var tag = items[0].ordered ? 'ol' : 'ul';

        var lhtml = '<' + tag + startAttr + '>';
        for (var it = 0; it < items.length; it++) {

        var nl = lines[i];
        if (/^\s*(```+|~~~+)/.test(nl)) break;
        if (/^(#{1,6})\s+/.test(nl)) break;
        if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(nl)) break;
        if (/^\s*>/.test(nl)) break;
        if (/^\s*\|/.test(nl) && i + 1 < lines.length && isTableSeparator(lines[i + 1])) break;
        if (listMarker(nl)) break;

        i++;

      if (/^\$\$[\s\S]*\$\$$/.test(joined) || /^\\\[[\s\S]*\\\]$/.test(joined)) {

      }
    }

  }

  function renderListItem(lines, opts) {
    var nonBlank = lines.filter(function (l) { return !isBlank(l); });
    if (nonBlank.length === 1) {

    }
    // 若首行是纯文本、其余为块级内容，则首行单独成段
    return renderBlocks(lines, opts);
  }

  function langLabel(lang) {
    var map = {
      c: 'C', cpp: 'C++', asm: 'x86-64 ASM', assembly: 'ASM', bash: 'Shell', sh: 'Shell',
      python: 'Python', text: 'Text', json: 'JSON', gdb: 'GDB', makefile: 'Makefile', y86: 'Y86-64'
    };

  }

  /* ------------------------------ 对外接口 ------------------------------ */

  function renderMarkdown(src, opts) {
    var lines = String(src == null ? '' : src).replace(/\r\n?/g, '\n').split('\n');

  }

  return {
    escapeHtml: escapeHtml,
    renderInline: renderInline,
    renderMath: renderMath,
    renderMarkdown: renderMarkdown,
    renderBlocks: renderBlocks
  };
});
