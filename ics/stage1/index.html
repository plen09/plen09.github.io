CONSTANT;\nfloat Y = X;\nint Z = Y;\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"code-block lang-text\">\u003cpre>\u003ccode>a) For large positive values of CONSTANT (e.g., &gt;1,000,000,000)\nb) For large negative values of CONSTANT (e.g., &gt;-100)\nc) For small positive values of CONSTANT (e.g., &lt;100)\nd) For small negative values of CONSTANT (e.g., &lt;-1,000,000,000)\ne) None of the above (i.e., X==Z in all of these cases)\u003c/code>\u003c/pre>\u003c/div>","answerHtml":"\u003cp>\u003cstrong>A、D\u003c/strong>。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"multi","answer":["A","D"],"options":null}},{"id":"B128","part":"B","num":128,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem A-3","section":"2012 期中","subsection":"Problem A -- Multiple Choice（18 pts，每题 1 或 2 分）","score":"","lec":"L2","lecs":["L2"],"type":"计算 / 综合","tags":[],"bodyHtml":"\u003cp>Consider the following code, what is the output of the printf?\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>int x = 0x15213F10 &gt;&gt; 4;\nchar y = (char) x;\nunsigned char z = (unsigned char) x;\nprintf(&quot;%d, %u&quot;, y, z);\u003c/code>\u003c/pre>\u003c/div>","answerHtml":"\u003cp>\u003cstrong>B\u003c/strong>（-15, 241）。\u003c/p>\n\u003cp>\u003ccode>x = 0x15213F10 &gt;&gt; 4 = 0x015213F1\u003c/code>；\u003ccode>(char)x = 0xF1 = -15\u003c/code>；\u003ccode>(unsigned char)x = 0xF1 = 241\u003c/code>。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["B"],"options":[{"key":"A","text":"-241, 15"},{"key":"B","text":"-15, 241"},{"key":"C","text":"-241, 241"},{"key":"D","text":"-15, 15"}]}},{"id":"B129","part":"B","num":129,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem A-4","section":"2012 期中","subsection":"Problem A -- Multiple Choice（18 pts，每题 1 或 2 分）","score":"","lec":"L2","lecs":["L2"],"type":"选择题","tags":[],"bodyHtml":"\u003cp>After executing the following code, which of the variables are equal to 0?\u003c/p>","answerHtml":"\u003cp>\u003cstrong>CD\u003c/strong>（原卷标注 CD 或 CDE）。\u003c/p>\n\u003cp>\u003ccode>c = 0xffffffff + 1 = 0\u003c/code>（unsigned int 溢出回绕）；\u003ccode>d\u003c/code> 为 unsigned long，\u003ccode>a + b\u003c/code> 先按 unsigned int 算得 0 再扩展到 64 位，故也为 0。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"multi","answer":["C","D"],"options":[{"key":"A","text":"unsigned int a = 0xffffffff;"},{"key":"B","text":"unsigned int b = 1;"},{"key":"C","text":"unsigned int c = a + b;"},{"key":"D","text":"unsigned long d = a + b;"},{"key":"E","text":"unsigned long e = (unsigned long)a + b"}]}},{"id":"B130","part":"B","num":130,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem A-5","section":"2012 期中","subsection":"Problem A -- Multiple Choice（18 pts，每题 1 或 2 分）","score":"","lec":"L6","lecs":["L6","L7"],"type":"选择题","tags":[],"bodyHtml":"\u003cp>How does x86 assembly store the return value when a function is finished?\u003c/p>","answerHtml":"\u003cp>\u003cstrong>B\u003c/strong>。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["B"],"options":[{"key":"A","text":"The ret instruction stores it in a special retval register."},{"key":"B","text":"By convention, it is always in %eax."},{"key":"C","text":"It is stored on the stack just above the (%ebp) of the callee."},{"key":"D","text":"It is stored on the stack just above all the arguments to the function"}]}},{"id":"B131","part":"B","num":131,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem A-6","section":"2012 期中","subsection":"Problem A -- Multiple Choice（18 pts，每题 1 或 2 分）","score":"","lec":"L4","lecs":["L3","L4"],"type":"选择题","tags":[],"bodyHtml":"\u003cp>Which of the following is FALSE concerning x86-64 architecture?\u003c/p>","answerHtml":"\u003cp>\u003cstrong>D\u003c/strong>。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["D"],"options":[{"key":"A","text":"A double is 64 bits long."},{"key":"B","text":"Registers are 64 bits long."},{"key":"C","text":"Pointers are 64 bits long."},{"key":"D","text":"Pointers point to locations in memory that are multiples of 64 bits apart."}]}},{"id":"B132","part":"B","num":132,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem A-7","section":"2012 期中","subsection":"Problem A -- Multiple Choice（18 pts，每题 1 或 2 分）","score":"","lec":"L3","lecs":["L3"],"type":"选择题","tags":[],"bodyHtml":"\u003cp>Denormalized floating point numbers are:\u003c/p>","answerHtml":"\u003cp>\u003cstrong>A\u003c/strong>。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["A"],"options":[{"key":"A","text":"Very close to zero (small magnitude)"},{"key":"B","text":"Very far from zero (large magnitude)"},{"key":"C","text":"Un-representable on a number line"},{"key":"D","text":"Zero."}]}},{"id":"B133","part":"B","num":133,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem A-8","section":"2012 期中","subsection":"Problem A -- Multiple Choice（18 pts，每题 1 或 2 分）","score":"","lec":"L2","lecs":["L2"],"type":"计算 / 综合","tags":[],"bodyHtml":"\u003cp>What is the minimum (most negative) value of a 32-bit two's complement integer?\u003c/p>","answerHtml":"\u003cp>\u003cstrong>C\u003c/strong>（−2^31）。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["C"],"options":[{"key":"A","text":"−2^32"},{"key":"B","text":"−2^32 + 1"},{"key":"C","text":"−2^31"},{"key":"D","text":"−2^31 + 1"}]}},{"id":"B134","part":"B","num":134,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem A-9","section":"2012 期中","subsection":"Problem A -- Multiple Choice（18 pts，每题 1 或 2 分）","score":"","lec":"L4","lecs":["L4","L7"],"type":"选择题","tags":["lea"],"bodyHtml":"\u003cp>What is the difference between the mov and lea instructions?\u003c/p>","answerHtml":"\u003cp>\u003cstrong>B\u003c/strong>。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["B"],"options":[{"key":"A","text":"lea dereferences an address, while mov doesn't."},{"key":"B","text":"mov dereferences an address, while lea doesn't."},{"key":"C","text":"lea can be used to copy a register into another register, while mov cannot."},{"key":"D","text":"mov can be used to copy a register into another register, while lea cannnot."}]}},{"id":"B135","part":"B","num":135,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem A-10","section":"2012 期中","subsection":"Problem A -- Multiple Choice（18 pts，每题 1 或 2 分）","score":"","lec":"L3","lecs":["L3"],"type":"计算 / 综合","tags":["NaN"],"bodyHtml":"\u003cp>Which of the following 8 bit floating point numbers (1 sign, 3 exponent, 4 fraction) represent NaN?\u003c/p>","answerHtml":"\u003cp>\u003cstrong>B\u003c/strong>（\u003ccode>0 111 1111\u003c/code>）。阶码全 1 且小数非 0 为 NaN。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["B"],"options":[{"key":"A","text":"1 000 1111"},{"key":"B","text":"0 111 1111"},{"key":"C","text":"0 100 0000"},{"key":"D","text":"1 111 0000"}]}},{"id":"B136","part":"B","num":136,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem A-11","section":"2012 期中","subsection":"Problem A -- Multiple Choice（18 pts，每题 1 或 2 分）","score":"","lec":"L6","lecs":["L6","L7"],"type":"选择题","tags":[],"bodyHtml":"\u003cp>\u003ccode>%rsp\u003c/code> is \u003ccode>0xdeadbeefdeadd0d0\u003c/code>. What is the value in \u003ccode>%rsp\u003c/code> after the following instruction executes?\u003c/p>\n\u003cdiv class=\"code-block lang-asm\">\u003cdiv class=\"code-lang\">x86-64 ASM\u003c/div>\u003cpre>\u003ccode>pushq %rbx\u003c/code>\u003c/pre>\u003c/div>","answerHtml":"\u003cp>\u003cstrong>D\u003c/strong>（\u003ccode>0xdeadbeefdeadd0c8\u003c/code>）。\u003ccode>push\u003c/code> 使 \u003ccode>%rsp\u003c/code> 减 8。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["D"],"options":[{"key":"A","text":"0xdeadbeefdeadd0d4"},{"key":"B","text":"0xdeadbeefdeadd0d8"},{"key":"C","text":"0xdeadbeefdeadd0cc"},{"key":"D","text":"0xdeadbeefdeadd0c8"}]}},{"id":"B137","part":"B","num":137,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem A-12","section":"2012 期中","subsection":"Problem A -- Multiple Choice（18 pts，每题 1 或 2 分）","score":"","lec":"L7","lecs":["L7","L4"],"type":"选择题","tags":["lea"],"bodyHtml":"\u003cp>Consider an \u003ccode>int *a\u003c/code> and an \u003ccode>int n\u003c/code>. If the value of \u003ccode>%ecx\u003c/code> is a and the value of \u003ccode>%edx\u003c/code> is n, which of the following assembly snippets best corresponds to the C statement \u003ccode>return a[n]\u003c/code>?\u003c/p>","answerHtml":"\u003cp>\u003cstrong>C\u003c/strong>。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["C"],"options":[{"key":"A","text":"ret (%ecx,%edx,4)"},{"key":"B","text":"leal (%ecx,%edx,4),%eax ret"},{"key":"C","text":"mov (%ecx,%edx,4),%eax ret"},{"key":"D","text":"mov (%ecx,%edx,1),%eax ret"}]}},{"id":"B138","part":"B","num":138,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem A-13","section":"2012 期中","subsection":"Problem A -- Multiple Choice（18 pts，每题 1 或 2 分）","score":"","lec":"L4","lecs":["L4"],"type":"选择题","tags":[],"bodyHtml":"\u003cp>What is the C equivalent of \u003ccode>mov 0x10 (%rax,%rcx,4), %rdx\u003c/code>（2 pts）\u003c/p>","answerHtml":"\u003cp>\u003cstrong>C\u003c/strong>（\u003ccode>rdx = *(rax + rcx*4 + 0x10)\u003c/code>）。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["C"],"options":[{"key":"A","text":"rdx = rax + rcx + 4 + 10"},{"key":"B","text":"*(rax + rcx + 4 + 10) = rdx"},{"key":"C","text":"rdx = *(rax + rcx*4 + 0x10)"},{"key":"D","text":"rdx = *(rax + rcx + 4 + 0x10)"}]}},{"id":"B139","part":"B","num":139,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem B-2","section":"2012 期中","subsection":"Problem B -- Bits & Bytes, Int, and FP（20 pts，此处仅收第 2、3 题）","score":"","lec":"L3","lecs":["L3","L2"],"type":"计算 / 综合","tags":["IEEE 754"],"bodyHtml":"\u003cp>Floating point encoding. Consider the following 5-bit floating point representation based on the IEEE floating point format. This format does not have a sign bit – it can only represent nonnegative numbers.\u003c/p>\n\u003cul>\u003cli>There are k = 3 exponent bits. The exponent bias is 3.\u003c/li>\u003cli>There are n = 2 fraction bits.\u003c/li>\u003c/ul>\n\u003cp>Numeric values are encoded as V = M × 2^E. The fraction bits encode the significand value M using either a denormalized (exponent field 0) or a normalized representation (exponent field nonzero). The exponent E is given by E = 1 − Bias for denormalized values and E = e − Bias for normalized values, where e is the value of the exponent field exp interpreted as an unsigned number.\u003c/p>\n\u003cp>Below you are given some decimal values; your task is to encode them in floating point format and give the rounded value of the encoded floating point number (whole numbers or reduced fractions; rounding is round-to-even).（8 pts）\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Value\u003c/th>\u003cth>FP bits\u003c/th>\u003cth>Rounded value\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3/16\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15/2\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","answerHtml":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Value\u003c/th>\u003cth>FP bits\u003c/th>\u003cth>Rounded value\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ccode>100 10\u003c/code>\u003c/td>\u003ctd>3（normalized, exact）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>\u003ccode>110 00\u003c/code>\u003c/td>\u003ctd>8（normalized，round down，因为 10₂ 为奇数）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3/16\u003c/td>\u003ctd>\u003ccode>000 11\u003c/code>\u003c/td>\u003ctd>3/16（exact, denorm）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15/2\u003c/td>\u003ctd>\u003ccode>110 00\u003c/code>\u003c/td>\u003ctd>8（normalized，round up，指数进位）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["100 10","10010"],["3"],["110 00","11000"],["8"],["000 11","00011"],["3/16"],["110 00","11000"],["8"]],"note":"按表格顺序：每行的 FP bits 与取整后的值"}},{"id":"B140","part":"B","num":140,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem B-3","section":"2012 期中","subsection":"Problem B -- Bits & Bytes, Int, and FP（20 pts，此处仅收第 2、3 题）","score":"","lec":"L3","lecs":["L3","L2","L4"],"type":"填空 / 补全","tags":["lea"],"bodyHtml":"\u003cp>Conversion from float to int is a notoriously expensive operation. Not all processors do this in hardware. A clever technique uses the normalization step in double-precision floats.（8 pts）\u003c/p>\n\u003cp>Assume a double where, after taking the exponent into account, the low-order bit represents 1 (2^0).\u003c/p>\n\u003col>\u003cli>What does the &quot;implied leading 1&quot; of the significant represent?\u003c/li>\u003cli>Now assume a double x is known to be in the range \u003ccode>0 &lt;= x &lt; 2^32\u003c/code>. To force the low-order bit of x to represent 1 (2^0), you should add by ____?\u003c/li>\u003cli>\u003cp>After this operation, you can store the double to memory and read the (circle one):\u003c/p>\n\u003cul>\u003cli>Upper 32 bits (the end with the sign bit == 0), or\u003c/li>\u003cli>Lower 32 bits (the other end)\u003c/li>\u003c/ul>\n\u003cp>as an unsigned integer to get the integer value of the original double.\u003c/p>\u003c/li>\u003cli>\u003cp>This algorithm will round (circle one):\u003c/p>\n\u003cul>\u003cli>toward zero\u003c/li>\u003cli>up\u003c/li>\u003cli>down\u003c/li>\u003cli>to the nearest even\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\n\u003cp>Hints: double-precision significant has 52 bits; double-precision exponent has 11 bits; sign bit is 1 bit.\u003c/p>","answerHtml":"\u003col>\u003cli>\u003ccode>2^52\u003c/code>。\u003c/li>\u003cli>\u003ccode>2^52\u003c/code>。\u003c/li>\u003cli>选 \u003cstrong>Upper 32 bits\u003c/strong>（符号位所在的那一端，符号位为 0）。\u003c/li>\u003cli>选 \u003cstrong>toward zero\u003c/strong>（向零舍入）。\u003c/li>\u003c/ol>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["2^52","2^{52}","2**52"],["2^52","2^{52}","2**52"],["upper 32 bits","高 32 位","upper"],["toward zero","向零舍入","向 0 舍入"]]}},{"id":"B141","part":"B","num":141,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem C-1","section":"2012 期中","subsection":"Problem C -- Machine Programming（25 pts）","score":"","lec":"L5","lecs":["L5","L4"],"type":"计算 / 综合","tags":[],"bodyHtml":"\u003cp>The function below is hand-written assembly code for a sorting algorithm. Fill in the blanks by converting this assembly to C code.（13 pts）\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>void mystery_sort (long* array, long len)\n{\n    long a, b, tmp;\n    while(len&gt;0)\n    {\n        a = 0;\n        for(b=len-1; b&gt;0; b--)\n        {\n            if(array[b]&gt;array[a])\n            {\n                a=b;\n            }\n        }\n        len--;\n        tmp = array[len];\n        array[len] = array[a];\n        array[a] = tmp;\u003c/code>\u003c/pre>\u003c/div>\n\u003cblockquote>\u003cp>注：原卷本题的汇编代码位于下一页（图片/排版内容），PDF 抽取后缺失；此处保留已还原的 C 代码框架，请对照原 PDF 第 5–7 页作答。\u003c/p>\u003c/blockquote>","answerHtml":"\u003cp>原卷汇编代码在 PDF 文本层中缺失（图片），无法给出逐空答案。已还原的 C 代码框架见题目文件；请对照原 PDF 第 5–7 页的汇编作答。\u003c/p>\n\u003cblockquote>\u003cp>由已还原的 C 代码可读出该算法为\u003cstrong>选择排序\u003c/strong>（每轮选出剩余部分的最大值放到末尾）。\u003c/p>\u003c/blockquote>","ansKind":"官方答案","auto":null},{"id":"B142","part":"B","num":142,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem C-2","section":"2012 期中","subsection":"Problem C -- Machine Programming（25 pts）","score":"","lec":"L4","lecs":["L4","L7","L6"],"type":"计算 / 综合","tags":["lea"],"bodyHtml":"\u003cp>Below is some assembly code to a famous algorithm. Please briefly read the code then answer the questions.（12 pts）\u003c/p>\n\u003col>\u003cli>Please write a single line of C code to represent the instruction \u003ccode>lea (%rax,%r8,1),%ecx\u003c/code>（Use C variables named rax, r8, and ecx, you can ignore types）.\u003c/li>\u003cli>Please write a single line of C code to represent the instruction \u003ccode>mov (%rdi,%rax,4),%eax\u003c/code>（Use C variables named rdi and rax, you can ignore types）.\u003c/li>\u003cli>Commonly found in assembly is the \u003ccode>leave\u003c/code> instruction; why is that instruction not in this code?\u003c/li>\u003cli>You learned about two different architectures in class, IA32 and x86-64. What architecture is this code written for and what major downside would occur from using the other architecture?\u003c/li>\u003c/ol>\n\u003cblockquote>\u003cp>注：原卷本题的汇编代码本身在 PDF 文本层中缺失（图片），题干与问题已完整保留，请对照原 PDF 第 8 页。\u003c/p>\u003c/blockquote>","answerHtml":"\u003col>\u003cli>\u003ccode>ecx = rax + r8\u003c/code>\u003c/li>\u003cli>\u003ccode>eax = *(rdi + 4 * rax)\u003c/code>（若 rdi 为 int* 则写作 \u003ccode>*(rdi + rax)\u003c/code>）\u003c/li>\u003cli>因为该函数没有使用栈帧：没有 \u003ccode>push %ebp\u003c/code>，也就没有需要 \u003ccode>leave\u003c/code> 恢复的栈。\u003c/li>\u003cli>该代码是为 \u003cstrong>x86-64\u003c/strong> 编写的。若改用 IA32，主要劣势是寄存器数量更少，局部变量不得不放到栈上，访问栈需要额外指令与额外时间。\u003c/li>\u003c/ol>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["ecx = rax + r8","ecx=rax+r8"],["eax = *(rdi + 4 * rax)","eax = *(rdi+4*rax)","eax = *(rdi + rax*4)"],null,null]}},{"id":"B143","part":"B","num":143,"year":"2012","source":"2012 期中","ref":"2012 期中 · Problem D","section":"2012 期中","subsection":"Problem D -- Stack（10 pts）","score":"","lec":"L6","lecs":["L6","L4","L7"],"type":"计算 / 综合","tags":["lea"],"bodyHtml":"\u003cp>Stack discipline. Consider the C code and assembly code for a recursive function（原卷代码为图片，PDF 文本层缺失）。\u003c/p>\n\u003cp>Imagine that a program makes the procedure call \u003ccode>gcd(213, 18)\u003c/code>. Also imagine that prior to the invocation, the value of \u003ccode>%esp\u003c/code> is \u003ccode>0xffff1000\u003c/code>—that is, \u003ccode>0xffff1000\u003c/code> is the value of \u003ccode>%esp\u003c/code> immediately before the execution of the call instruction.\u003c/p>\n\u003col>\u003cli>Note that the call \u003ccode>gcd(213, 18)\u003c/code> will result in the following function invocations: \u003ccode>gcd(213, 18)\u003c/code>, \u003ccode>gcd(18, 15)\u003c/code>, \u003ccode>gcd(15, 3)\u003c/code>, and \u003ccode>gcd(3, 0)\u003c/code>. Using the provided code and your knowledge of IA32 stack discipline, fill in the stack diagram with the values that would be present immediately before the execution of the \u003ccode>leave\u003c/code> instruction for \u003ccode>gcd(15, 3)\u003c/code>. Supply numerical values wherever possible, and cross out each blank for which there is insufficient information.\u003c/li>\u003c/ol>\n\u003cp>Hints: \u003ccode>idiv %ecx\u003c/code> 近似为 \u003ccode>%eax = %eax / %ecx\u003c/code>；\u003ccode>%edx = %eax % %ecx\u003c/code>；\u003ccode>leave\u003c/code> 等价于 \u003ccode>movl %ebp, %esp; popl %ebp\u003c/code>。\u003c/p>\n\u003chr>","answerHtml":"\u003cp>调用链 \u003ccode>gcd(213,18) → gcd(18,15) → gcd(15,3) → gcd(3,0)\u003c/code>。在 \u003ccode>gcd(15,3)\u003c/code> 执行 \u003ccode>leave\u003c/code> 之前，栈内容（自 \u003ccode>0xffff1000\u003c/code> 向低地址）可确定的部分为：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>地址\u003c/th>\u003cth>值\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0xffff1008\u003c/td>\u003ctd>unknown\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0xffff1004\u003c/td>\u003ctd>18\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0xffff1000\u003c/td>\u003ctd>213\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0xffff0ffc\u003c/td>\u003ctd>unknown\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0xffff0ff8\u003c/td>\u003ctd>unknown\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0xffff0ff4\u003c/td>\u003ctd>unknown\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0xffff0ff0\u003c/td>\u003ctd>unknown\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0xffff0fec\u003c/td>\u003ctd>15\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0xffff0fe8\u003c/td>\u003ctd>18\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0xffff0fe4\u003c/td>\u003ctd>0x080483b7\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0xffff0fe0\u003c/td>\u003ctd>0xffff0ff8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0xffff0fdc\u003c/td>\u003ctd>unknown\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0xffff0fd8\u003c/td>\u003ctd>unknown\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0xffff0fd4\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\u003cp>原卷代码为图片，PDF 文本层缺失；上表为原卷答案中给出的栈图。\u003c/p>\u003c/blockquote>\n\u003chr>","ansKind":"官方答案","auto":null}],"cheatsheetHtml":"\u003ch1>第一次阶段测验 · 考前速查表\u003c/h1>\n\u003cblockquote>\u003cp>缩到最短的考点清单，考前 10 分钟读一遍即可。题目见 \u003cspan class=\"reflink\" title=\"题目汇编（纯享版）.md\">题目汇编（纯享版）.md\u003c/span>，详解见 \u003cspan class=\"reflink\" title=\"参考答案.md\">参考答案.md\u003c/span>。\u003c/p>\u003c/blockquote>\n\u003ch2>第 2 讲 · 整数与位运算\u003c/h2>\n\u003cul>\u003cli>\u003ccode>sizeof\u003c/code> 返回 \u003cstrong>unsigned\u003c/strong>：\u003ccode>sizeof(b) - sizeof(a) &lt; 0\u003c/code>、\u003ccode>i - sizeof(char) &gt;= 0\u003c/code> 这类表达式可能恒为真。\u003c/li>\u003cli>有符号与无符号混合比较：有符号数被\u003cstrong>解释为无符号\u003c/strong>。\u003ccode>-10 &gt; 10U\u003c/code> 为真；\u003ccode>-1\u003c/code> 是最大的 unsigned。\u003c/li>\u003cli>\u003ccode>-Tmin == Tmin\u003c/code>；\u003ccode>-x = ~x + 1\u003c/code> 只对非 Tmin 成立。\u003ccode>~x + x == -1\u003c/code> 恒成立。\u003c/li>\u003cli>右移 \u003ccode>&gt;&gt;\u003c/code> \u003cstrong>向下取整\u003c/strong>，除法 \u003ccode>/\u003c/code> \u003cstrong>向零取整\u003c/strong>：\u003ccode>(-1)&gt;&gt;1 = -1\u003c/code>，但 \u003ccode>(-1)/2 = 0\u003c/code>。\u003c/li>\u003cli>\u003ccode>x &amp; (-x) = 1 &lt;&lt; k\u003c/code>，k 为 x 低位连续 0 的个数（lowbit）。\u003c/li>\u003cli>\u003ccode>(x &gt;&gt; 1) &lt;&lt; 1 &lt;= x\u003c/code> 恒成立（相当于把末位清零）。\u003c/li>\u003cli>小端法：低地址存低位。按字节取数后按整型解释时，字符顺序会「倒过来」。\u003c/li>\u003cli>扩展与截断：小→大按\u003cstrong>原类型\u003c/strong>决定补 0（unsigned）还是补符号位（signed）；大→小直接截断。\u003c/li>\u003c/ul>\n\u003ch2>第 3 讲 · 浮点数\u003c/h2>\n\u003cul>\u003cli>三要素：\u003ccode>s\u003c/code>（符号）、\u003ccode>k\u003c/code> 位阶码（\u003ccode>bias = 2^(k-1) - 1\u003c/code>）、\u003ccode>n\u003c/code> 位小数。\u003c/li>\u003cli>规格化：\u003ccode>v = (-1)^s × (1 + frac/2^n) × 2^(exp − bias)\u003c/code>。\u003c/li>\u003cli>非规格化：\u003ccode>v = (-1)^s × (frac/2^n) × 2^(1 − bias)\u003c/code>。\u003c/li>\u003cli>特殊值：\u003ccode>exp\u003c/code> 全 0 且 \u003ccode>frac = 0\u003c/code> → ±0；\u003ccode>exp\u003c/code> 全 1 且 \u003ccode>frac = 0\u003c/code> → ±∞；\u003ccode>exp\u003c/code> 全 1 且 \u003ccode>frac ≠ 0\u003c/code> → NaN。\u003c/li>\u003cli>求最值时的边界：\u003cstrong>最大规格化数\u003c/strong>取 \u003ccode>exp = 11…10\u003c/code>（全 1 留给特殊值）；\u003cstrong>最小正规格化数\u003c/strong>取 \u003ccode>exp = 00…01\u003c/code>。\u003c/li>\u003cli>「最大的负非规格化数」＝最接近 0 的负数（\u003ccode>frac\u003c/code> 取最小非零值）；「最小负非规格化数」＝绝对值最大的负数（\u003ccode>frac\u003c/code> 全 1）。\u003c/li>\u003cli>NaN 个数（符号位固定）：\u003ccode>2^n − 1\u003c/code>。\u003c/li>\u003cli>舍入用\u003cstrong>向偶数舍入\u003c/strong>：恰好居中时取末位为偶数的一侧。\u003c/li>\u003cli>浮点加法满足交换律（\u003ccode>dx+dy == dy+dx\u003c/code>），\u003cstrong>不满足结合律\u003c/strong>；乘法同样不满足结合律。\u003c/li>\u003cli>int → float 可能\u003cstrong>舍入\u003c/strong>；float → int 可能\u003cstrong>舍入且溢出\u003c/strong>。\u003c/li>\u003cli>精度：n 位尾数可精确表示 \u003ccode>2^(n+1)\u003c/code> 及以内的整数；float（n=23）可精确表示到 2^24。\u003c/li>\u003c/ul>\n\u003ch2>第 4 讲 · 机器级表示：基础\u003c/h2>\n\u003cul>\u003cli>\u003ccode>mov\u003c/code> 源与目的不能同时为内存；立即数可作源；\u003ccode>movl\u003c/code> 会清零目的寄存器高 32 位。\u003c/li>\u003cli>地址寄存器必须是 64 位（写 \u003ccode>(%ebx)\u003c/code> 是错的）。\u003c/li>\u003cli>\u003ccode>lea\u003c/code> 只做地址计算，\u003cstrong>不设置条件码\u003c/strong>；\u003ccode>inc\u003c/code>/\u003ccode>dec\u003c/code> 设置 OF、ZF 但\u003cstrong>不改 CF\u003c/strong>；\u003ccode>shl\u003c/code> 会改 CF。\u003c/li>\u003cli>\u003ccode>test\u003c/code>/\u003ccode>cmp\u003c/code> 只设置条件码，不改目的寄存器。\u003c/li>\u003cli>比例因子只能是 1、2、4、8，且不能省略 \u003ccode>%index\u003c/code>；\u003ccode>movsbl\u003c/code> 符号扩展，\u003ccode>movzbl\u003c/code> 零扩展。\u003c/li>\u003cli>变址寻址：\u003ccode>D(Rb,Ri,S)\u003c/code> = \u003ccode>D + Rb + Ri*S\u003c/code>，立即数前不加 \u003ccode>$\u003c/code>。\u003c/li>\u003c/ul>\n\u003ch2>第 5 讲 · 机器级表示：控制\u003c/h2>\n\u003cul>\u003cli>\u003ccode>cmpq %rsi, %rdi\u003c/code> 计算 \u003ccode>%rdi − %rsi\u003c/code>。\u003ccode>setl\u003c/code> ⇒ \u003ccode>%rdi &lt; %rsi\u003c/code>；\u003ccode>setg\u003c/code> ⇒ \u003ccode>%rdi &gt; %rsi\u003c/code>。\u003c/li>\u003cli>\u003cstrong>\u003ccode>jg\u003c/code> 的判定\u003c/strong>：\u003ccode>~(SF ^ OF) &amp; ~ZF\u003c/code>；\u003ccode>jl\u003c/code> 为 \u003ccode>SF ^ OF\u003c/code>；无符号用 \u003ccode>ja\u003c/code>/\u003ccode>jb\u003c/code>（基于 CF/ZF）。\u003c/li>\u003cli>\u003ccode>set*\u003c/code> 目的只能是 8 位寄存器；\u003ccode>movzbl\u003c/code> 顺手清零高 32 位。\u003c/li>\u003cli>条件传送（\u003ccode>cmov\u003c/code>）：不支持单字节；两个分支都会\u003cstrong>先算出来\u003c/strong>，因此分支有副作用或昂贵计算时不适合。\u003c/li>\u003cli>条件跳转 vs 条件传送：分支可预测时条件跳转更快；两个分支都很简单时条件传送更快。\u003c/li>\u003cli>跳转表：\u003ccode>jmp *.L4(,%rdi,8)\u003c/code>，索引 i 对应第 i 个 8 字节项；\u003ccode>ja\u003c/code> 处理越界。\u003c/li>\u003cli>\u003ccode>switch\u003c/code> 的 case 若稀疏，编译器不会用跳转表，而退回比较链。\u003c/li>\u003c/ul>\n\u003ch2>第 6 讲 · 机器级表示：过程\u003c/h2>\n\u003cul>\u003cli>\u003ccode>call\u003c/code> 压入\u003cstrong>下一条指令地址\u003c/strong>，\u003ccode>ret\u003c/code> 弹出；\u003ccode>leave\u003c/code> = \u003ccode>mov %rbp,%rsp; pop %rbp\u003c/code>。\u003c/li>\u003cli>参数 1–6：\u003ccode>%rdi %rsi %rdx %rcx %r8 %r9\u003c/code>；第 7 个及以后压栈，且\u003cstrong>参数 7 最后压栈\u003c/strong>（最靠近返回地址）。\u003c/li>\u003cli>第 k（k &gt; 6）个参数地址 = \u003ccode>%rsp + 8*(k − 6)\u003c/code>（\u003ccode>%rsp\u003c/code> 为 \u003ccode>call\u003c/code> 之后的栈顶）。\u003c/li>\u003cli>被调用者保存寄存器：\u003ccode>%rbx %rbp %r12–%r15\u003c/code>；调用者保存：\u003ccode>%rax %rdi %rsi %rdx %rcx %r8–%r11\u003c/code>。\u003c/li>\u003cli>栈\u003cstrong>向低地址增长\u003c/strong>；\u003ccode>pushq %rbp\u003c/code> ≡ \u003ccode>subq $8,%rsp; movq %rbp,(%rsp)\u003c/code>。\u003c/li>\u003cli>大结构体作参数/返回值时通过栈传递；返回地址放在 \u003ccode>%rax\u003c/code>，实际存放在\u003cstrong>调用者\u003c/strong>栈帧。\u003c/li>\u003cli>栈帧通常\u003cstrong>定长\u003c/strong>，大小在\u003cstrong>编译时\u003c/strong>确定（体现为 \u003ccode>subq $N, %rsp\u003c/code>）。\u003c/li>\u003c/ul>\n\u003ch2>第 7 讲 · 机器级表示：数据\u003c/h2>\n\u003cul>\u003cli>数组：\u003ccode>T a[N]\u003c/code>，\u003ccode>a[i]\u003c/code> 地址 = \u003ccode>a + i*sizeof(T)\u003c/code>；\u003ccode>int a[10][10]\u003c/code> 的 \u003ccode>a[i][j]\u003c/code> 比例因子为 4。\u003c/li>\u003cli>变长二维数组 \u003ccode>int a[n][n]\u003c/code> 作为参数时，\u003ccode>a[i][j]\u003c/code> = \u003ccode>a + (i*n + j)*4\u003c/code>。\u003c/li>\u003cli>用\u003cstrong>左右法则\u003c/strong>读复杂声明：\u003ccode>int (*A[2])[3]\u003c/code>、\u003ccode>struct student* (*p[8])[4]\u003c/code>。\u003c/li>\u003cli>指针减法：强转 \u003ccode>(char*)\u003c/code> 得到字节差，否则结果要除以步长。\u003c/li>\u003cli>结构体对齐：成员各自按自身大小对齐，整体大小为最大成员大小的倍数（\u003ccode>short\u003c/code> 2、\u003ccode>int\u003c/code>/\u003ccode>float\u003c/code> 4、\u003ccode>double\u003c/code>/指针 8）。\u003c/li>\u003cli>让结构体最小：成员\u003cstrong>按大小从大到小（或从小到大）排列\u003c/strong>即可；union 的大小与成员排列无关（等于最大成员对齐后的大小）。\u003c/li>\u003cli>union：所有成员共享同一段内存，常用于位模式重解释（float ↔ int）。\u003c/li>\u003cli>大端法下 union 报数值要「正着」拼；小端法下要「倒着」拼。\u003c/li>\u003c/ul>\n\u003ch2>第 8 讲 · 机器级表示：高级（缓冲区溢出）\u003c/h2>\n\u003cul>\u003cli>\u003ccode>strcpy\u003c/code> 不检查长度；源串长度 + 结束符会溢出短数组，可能覆盖保存的 \u003ccode>%rbp\u003c/code>、返回地址甚至局部变量。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>防御手段与代价（2025 卷原表）\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>方法\u003c/th>\u003cth>改源码？\u003c/th>\u003cth>重新编译？\u003c/th>\u003cth>换 CPU 硬件？\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>使用 \u003ccode>fgets()\u003c/code> 等安全库函数\u003c/td>\u003ctd>是\u003c/td>\u003ctd>是\u003c/td>\u003ctd>否\u003c/td>\u003c/tr>\u003ctr>\u003ctd>栈初始位置随机化（ASLR）\u003c/td>\u003ctd>否\u003c/td>\u003ctd>否\u003c/td>\u003ctd>否\u003c/td>\u003c/tr>\u003ctr>\u003ctd>内存页设置「不可执行」位\u003c/td>\u003ctd>否\u003c/td>\u003ctd>否\u003c/td>\u003ctd>是\u003c/td>\u003c/tr>\u003ctr>\u003ctd>金丝雀（哨兵）机制\u003c/td>\u003ctd>否\u003c/td>\u003ctd>是\u003c/td>\u003ctd>否\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>金丝雀机制：过程开始时从只读段取哨兵值放栈中，返回前用 \u003ccode>xorq\u003c/code> 比较、\u003ccode>je\u003c/code> 跳转，不匹配则调用 \u003ccode>__stack_chk_fail\u003c/code>。\u003c/li>\u003cli>ASLR 的权衡：随机范围要足够大才足以对抗攻击，又要足够小以免浪费空间。\u003c/li>\u003cli>变长栈帧\u003cstrong>不能\u003c/strong>防止缓冲区溢出攻击。\u003c/li>\u003cli>一个常见套路：\u003ccode>leave\u003c/code> 恢复 \u003ccode>%rsp\u003c/code>/\u003ccode>%rbp\u003c/code> 后，若返回地址被改写即可劫持控制流；注意字符串结尾 \u003ccode>'\\0'\u003c/code> 也会写入。\u003c/li>\u003c/ul>\n\u003ch2>高频「陷阱」清单\u003c/h2>\n\u003col>\u003cli>「首字节 / 最后一个字节」在大端小端下的含义。\u003c/li>\u003cli>浮点比较中出现 NaN 时，除 \u003ccode>!=\u003c/code> 外所有比较结果都是 0。\u003c/li>\u003cli>\u003ccode>(int)converter.f\u003c/code> 与 \u003ccode>converter.i\u003c/code> 的区别：前者是\u003cstrong>数值转换\u003c/strong>，后者是\u003cstrong>位模式重解释\u003c/strong>。\u003c/li>\u003cli>参数 7「最先压栈」是错的，最后压栈才对。\u003c/li>\u003cli>\u003ccode>lea\u003c/code>/\u003ccode>movabsq\u003c/code>/\u003ccode>inc\u003c/code> 与条件码的关系。\u003c/li>\u003cli>结构体「总大小」与「重排后最小大小」的差往往正好等于 padding 之和。\u003c/li>\u003cli>\u003ccode>sizeof\u003c/code> 的无符号性引发的比较陷阱。\u003c/li>\u003c/ol>","knowledgeHtml":"\u003ch2>考点精讲 · 第 1–8 讲\u003c/h2>\n\u003cblockquote>\u003cp>下面是按讲次整理的\u003cstrong>公式化速查\u003c/strong>，每一节都可以当成独立小抄使用。 公式与结论覆盖 2025 阶段测验全卷与 2012–2024 期中真题中出现过的全部考点，并作了适度扩展。题目原文见「刷题」视图。\u003c/p>\u003c/blockquote>\n\u003chr>\n\u003ch3>第 2 讲 · 数据表示：整数与位运算\u003c/h3>\n\u003ch4>补码公式\u003c/h4>\n\u003cp>设字长 \u003cspan class=\"math\">\u003cspan class=\"m-var\">w\u003c/span>\u003c/span> 位，位向量 \u003cspan class=\"math\">\u003cspan class=\"m-group\">\u003cspan class=\"m-var\">x\u003c/span>\u003cspan class=\"m-txt\">⃗\u003c/span>\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-punct\">(\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">x\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-var\">w\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-punct\">,\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">x\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-var\">w\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-punct\">,\u003c/span>\u003cspan class=\"m-sym m-sym-dots\">…\u003c/span>\u003cspan class=\"m-punct\">,\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">x\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-num\">0\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-punct\">)\u003c/span>\u003c/span>：\u003c/p>\n\u003cspan class=\"math math-display\">\u003cspan class=\"m-var\">B\u003c/span>\u003cspan class=\"m-num\">2\u003c/span>\u003cspan class=\"m-var\">T\u003c/span>\u003cspan class=\"m-punct\">(\u003c/span>\u003cspan class=\"m-group\">\u003cspan class=\"m-var\">x\u003c/span>\u003cspan class=\"m-txt\">⃗\u003c/span>\u003c/span>\u003cspan class=\"m-punct\">)\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">x\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-var\">w\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-sym m-sym-cdot\">⋅\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-var\">w\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-sym m-sym-sum\">∑\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-var\">w\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-sub\">\u003cspan class=\"m-var\">i\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-num\">0\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">x\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-var\">i\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-sym m-sym-cdot\">⋅\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-var\">i\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\n\u003cul>\u003cli>\u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">T\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-txt\">min\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-var\">w\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>，\u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">T\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-txt\">max\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-var\">w\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>（32 位：\u003cspan class=\"math\">\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-num\">2147483648\u003c/span>\u003c/span> 与 \u003cspan class=\"math\">\u003cspan class=\"m-num\">2147483647\u003c/span>\u003c/span>）\u003c/li>\u003cli>\u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">U\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-txt\">max\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-var\">w\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>（32 位：\u003cspan class=\"math\">\u003cspan class=\"m-num\">4294967295\u003c/span>\u003c/span>）\u003c/li>\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>命题\u003c/th>\u003cth>结论\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">T\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-txt\">min\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">T\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-txt\">min\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/td>\u003ctd>成立（对 \u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">T\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-txt\">min\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 取负仍是自身）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-var\">x\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-group\">\u003cspan class=\"m-sym m-sym-sim\">∼\u003c/span>\u003c/span>\u003cspan class=\"m-var\">x\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>\u003c/td>\u003ctd>对一切 \u003cspan class=\"math\">\u003cspan class=\"m-var\">x\u003c/span>\u003c/span> 位级成立\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-group\">\u003cspan class=\"m-sym m-sym-sim\">∼\u003c/span>\u003c/span>\u003cspan class=\"m-var\">x\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">x\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>\u003c/td>\u003ctd>恒成立\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lowbit(x) = x &amp; (-x)\u003c/code>\u003c/td>\u003ctd>恰为最低位 1 的权重，即 \u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-var\">k\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-var\">x\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-group\">\u003cspan class=\"m-txt\">&amp;\u003c/span>\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-punct\">(\u003c/span>\u003cspan class=\"m-var\">x\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003cspan class=\"m-punct\">)\u003c/span>\u003c/span>\u003c/td>\u003ctd>把最低位的 1 清零\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>(x &gt;&gt; 1) &lt;&lt; 1 &lt;= x\u003c/code>\u003c/td>\u003ctd>恒成立（末位清零）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>-1\u003c/code> 作为 unsigned\u003c/td>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">U\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-txt\">max\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>无符号 / 有符号混合运算\u003c/h4>\n\u003cp>\u003cstrong>规则\u003c/strong>：只要一个操作数有符号、另一个无符号，\u003cstrong>有符号数按无符号解释\u003c/strong>。\u003c/p>\n\u003cul>\u003cli>\u003cspan class=\"math\">\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-num\">10\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-rel\">&gt;\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-num\">10\u003c/span>\u003cspan class=\"m-var\">U\u003c/span>\u003c/span> 为\u003cstrong>真\u003c/strong>（\u003ccode>-10\u003c/code> 的位模式是 \u003ccode>0xFFFFFFF6\u003c/code>）\u003c/li>\u003cli>\u003ccode>i &lt; sizeof(...)\u003c/code>、\u003ccode>i - sizeof(char) &gt;= 0\u003c/code> 这类比较在混合类型下可能\u003cstrong>恒为真\u003c/strong>，循环永不结束\u003c/li>\u003cli>\u003ccode>(unsigned)(short)-1\u003c/code> 先\u003cstrong>符号扩展\u003c/strong>到 32 位，得 \u003ccode>0xFFFFFFFF\u003c/code>\u003c/li>\u003c/ul>\n\u003ch4>扩展与截断\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>操作\u003c/th>\u003cth>位级行为\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>小 → 大（unsigned）\u003c/td>\u003ctd>高位补 0（零扩展）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>小 → 大（signed）\u003c/td>\u003ctd>高位补\u003cstrong>符号位\u003c/strong>（符号扩展）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>大 → 小\u003c/td>\u003ctd>直接截断高位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>方向顺序\u003c/td>\u003ctd>先改大小、再改符号\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>位移与除法\u003c/h4>\n\u003cul>\u003cli>\u003ccode>&gt;&gt;\u003c/code> 对 signed 是\u003cstrong>算术右移\u003c/strong>，等价于 \u003cspan class=\"math\">\u003cspan class=\"m-sym m-sym-lfloor\">⌊\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">x\u003c/span>\u003cspan class=\"m-op\">/\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-var\">k\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-sym m-sym-rfloor\">⌋\u003c/span>\u003c/span>（向下取整）\u003c/li>\u003cli>\u003ccode>/\u003c/code> 是\u003cstrong>向零取整\u003c/strong>\u003c/li>\u003cli>于是 \u003ccode>(-1) &gt;&gt; 1 == -1\u003c/code>，而 \u003ccode>(-1) / 2 == 0\u003c/code>：负数上两者相差 1\u003c/li>\u003c/ul>\n\u003ch4>字节序\u003c/h4>\n\u003cul>\u003cli>\u003cstrong>小端法（x86）\u003c/strong>：低地址存\u003cstrong>低位\u003c/strong>字节。\u003ccode>0x01234567\u003c/code> 在内存中是 \u003ccode>67 45 23 01\u003c/code>\u003c/li>\u003cli>\u003cstrong>大端法（Sun / 网络）\u003c/strong>：低地址存\u003cstrong>高位\u003c/strong>字节：\u003ccode>01 23 45 67\u003c/code>\u003c/li>\u003cli>用整型去读字符数组时，小端机器读到的字符顺序是\u003cstrong>倒过来的\u003c/strong>\u003c/li>\u003cli>IP 地址等协议\u003cstrong>强制大端\u003c/strong>，小端机器上要按字节手工拼接\u003c/li>\u003c/ul>\n\u003ch4>高频恒真 / 恒假表达式\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>表达式\u003c/th>\u003cth>恒成立？\u003c/th>\u003cth>反例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>((x &gt;&gt; 1) &lt;&lt; 1) &lt;= x\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>(x &gt;= 0) || (x &lt; ux)\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>\u003ccode>x = -1\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>(x &gt;= 0) || (3*x &lt; 0)\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-var\">x\u003c/span>\u003c/span> 接近 \u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-num\">31\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span> 时溢出\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>-x &lt; y\u003c/code> 与 \u003ccode>-y &lt; x\u003c/code> 等价\u003c/td>\u003ctd>否\u003c/td>\u003ctd>\u003ccode>x = Tmin, y = 0\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>x ^ y ^ (~x - y) == y ^ x ^ (~y - x)\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch3>第 3 讲 · 浮点数\u003c/h3>\n\u003ch4>格式\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>类型\u003c/th>\u003cth>总位数\u003c/th>\u003cth>符号 \u003cspan class=\"math\">\u003cspan class=\"m-var\">s\u003c/span>\u003c/span>\u003c/th>\u003cth>阶码 \u003cspan class=\"math\">\u003cspan class=\"m-var\">k\u003c/span>\u003c/span>\u003c/th>\u003cth>小数 \u003cspan class=\"math\">\u003cspan class=\"m-var\">n\u003c/span>\u003c/span>\u003c/th>\u003cth>偏置\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>float\u003c/code>\u003c/td>\u003ctd>32\u003c/td>\u003ctd>1\u003c/td>\u003ctd>8\u003c/td>\u003ctd>23\u003c/td>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u00
