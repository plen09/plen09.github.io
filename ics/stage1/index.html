c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-num\">1\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-txt\">bias\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大的负非规格化数\u003c/td>\u003ctd>全 0\u003c/td>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-num\">00\u003c/span>\u003cspan class=\"m-sym m-sym-cdots\">⋯\u003c/span>\u003cspan class=\"m-num\">01\u003c/span>\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-var\">n\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-sym m-sym-times\">×\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-num\">1\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-txt\">bias\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>（最接近 0 的负数）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NaN 个数（符号位固定）\u003c/td>\u003ctd>全 1\u003c/td>\u003ctd>非 0\u003c/td>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-var\">n\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\u003cp>例：\u003cspan class=\"math\">\u003cspan class=\"m-var\">k\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-num\">5\u003c/span>\u003cspan class=\"m-punct\">,\u003c/span>\u003cspan class=\"m-var\">n\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-num\">2\u003c/span>\u003c/span> 的 8 位格式，偏置为 \u003cspan class=\"math\">\u003cspan class=\"m-num\">15\u003c/span>\u003c/span>；最小正规格化数 \u003cspan class=\"math\">\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-num\">14\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>；NaN 有 \u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-num\">3\u003c/span>\u003c/span> 个。\u003c/p>\u003c/blockquote>\n\u003ch4>舍入\u003c/h4>\n\u003cp>\u003cstrong>向偶数舍入\u003c/strong>：恰好居中时，取使末位为 \u003cstrong>0\u003c/strong>（偶）的那一侧。\u003c/p>\n\u003cul>\u003cli>\u003ccode>101.111100 → 110.000\u003c/code>（进位一侧末位为偶）\u003c/li>\u003cli>\u003ccode>101.100100 → 101.100\u003c/code>（保持一侧末位为偶）\u003c/li>\u003cli>一般舍入误差不超过 \u003cspan class=\"math\">\u003cspan class=\"m-frac\">\u003cspan class=\"m-fnum\">\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>\u003cspan class=\"m-fden\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-txt\">ulp\u003c/span>\u003c/span>\u003c/li>\u003c/ul>\n\u003ch4>精度\u003c/h4>\n\u003cul>\u003cli>\u003cspan class=\"math\">\u003cspan class=\"m-var\">n\u003c/span>\u003c/span> 位小数可\u003cstrong>精确表示\u003c/strong> \u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-var\">n\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 以内的整数；\u003ccode>float\u003c/code> 精确到 \u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-num\">24\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-num\">16777216\u003c/span>\u003c/span>\u003c/li>\u003cli>\u003ccode>float\u003c/code> 不可精确表示的最小正整数是 \u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-num\">24\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-num\">16777217\u003c/span>\u003c/span>\u003c/li>\u003cli>最小正规格化数（\u003ccode>float\u003c/code>）为 \u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-num\">126\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>，最小正非规格化数为 \u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-num\">149\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/li>\u003cli>\u003ccode>int → float\u003c/code> 可能\u003cstrong>舍入但不溢出\u003c/strong>；\u003ccode>float → int\u003c/code> 可能\u003cstrong>既舍入又溢出\u003c/strong>\u003c/li>\u003cli>单精度最大绝对误差出现在最低位的一半处，量级为 \u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-num\">103\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/li>\u003c/ul>\n\u003ch4>浮点运算性质\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>性质\u003c/th>\u003cth>加法\u003c/th>\u003cth>乘法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>交换律 \u003cspan class=\"math\">\u003cspan class=\"m-var\">a\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan class=\"m-var\">b\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-var\">b\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan class=\"m-var\">a\u003c/span>\u003c/span>\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003c/tr>\u003ctr>\u003ctd>结合律\u003c/td>\u003ctd>✘\u003c/td>\u003ctd>✘\u003c/td>\u003c/tr>\u003ctr>\u003ctd>单调性 \u003cspan class=\"math\">\u003cspan class=\"m-var\">a\u003c/span>\u003cspan class=\"m-rel\">&gt;\u003c/span>\u003cspan class=\"m-var\">b\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-sym m-sym-Rightarrow\">⇒\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">a\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan class=\"m-var\">x\u003c/span>\u003cspan class=\"m-rel\">&gt;\u003c/span>\u003cspan class=\"m-var\">b\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan class=\"m-var\">x\u003c/span>\u003c/span>\u003c/td>\u003ctd>无 NaN / Inf 时成立\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>\u003ccode>dx + dy == (double)(x+y)\u003c/code> 可能失败：\u003ccode>x+y\u003c/code> 先在 int 中溢出\u003c/li>\u003cli>\u003ccode>dx/dx == dz/dz\u003c/code> 可能失败：\u003cspan class=\"math\">\u003cspan class=\"m-num\">0\u003c/span>\u003cspan class=\"m-op\">/\u003c/span>\u003cspan class=\"m-num\">0\u003c/span>\u003c/span> 得到 NaN，而 \u003ccode>NaN != NaN\u003c/code>\u003c/li>\u003cli>与 NaN 的一切比较（除 \u003ccode>!=\u003c/code>）结果都是 0\u003c/li>\u003cli>\u003ccode>union {float f; int i;}\u003c/code> 里读 \u003ccode>converter.i\u003c/code> 是\u003cstrong>位模式重解释\u003c/strong>，而 \u003ccode>(int)converter.f\u003c/code> 是\u003cstrong>数值转换\u003c/strong>，两者完全不同\u003c/li>\u003cli>整数转浮点也可能舍入（\u003ccode>2^25+10\u003c/code> 转 \u003ccode>float\u003c/code> 就丢了低 5 位）\u003c/li>\u003c/ul>\n\u003ch4>FP8 拓展（E4M3 / E5M2）\u003c/h4>\n\u003cul>\u003cli>\u003cstrong>E5M2\u003c/strong> 遵守 IEEE：偏置 15，最大规格化数 \u003cspan class=\"math\">\u003cspan class=\"m-num\">1.75\u003c/span>\u003cspan class=\"m-sym m-sym-times\">×\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-num\">15\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>，NaN 有 3 个位模式\u003c/li>\u003cli>\u003cstrong>E4M3\u003c/strong> 回收了 \u003ccode>exp=1111\u003c/code> 的特殊值，仅保留 \u003ccode>1111 111\u003c/code> 为 NaN，最大规格化数扩展到 \u003cspan class=\"math\">\u003cspan class=\"m-num\">1.75\u003c/span>\u003cspan class=\"m-sym m-sym-times\">×\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-num\">8\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-num\">448\u003c/span>\u003c/span>，是标准设计上限 \u003cspan class=\"math\">\u003cspan class=\"m-num\">1.875\u003c/span>\u003cspan class=\"m-sym m-sym-times\">×\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-num\">7\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-num\">240\u003c/span>\u003c/span> 的 2 倍\u003c/li>\u003cli>\u003ccode>int8\u003c/code> 范围 \u003cspan class=\"math\">\u003cspan class=\"m-punct\">[\u003c/span>\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-num\">128\u003c/span>\u003cspan class=\"m-punct\">,\u003c/span>\u003cspan class=\"m-num\">127\u003c/span>\u003cspan class=\"m-punct\">]\u003c/span>\u003c/span> 落在 E4M3 的 \u003cspan class=\"math\">\u003cspan class=\"m-punct\">[\u003c/span>\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-num\">448\u003c/span>\u003cspan class=\"m-punct\">,\u003c/span>\u003cspan class=\"m-num\">448\u003c/span>\u003cspan class=\"m-punct\">]\u003c/span>\u003c/span> 之内：\u003cstrong>不溢出，但会舍入\u003c/strong>\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3>第 4 讲 · 机器级表示（基础）：寄存器与寻址\u003c/h3>\n\u003ch4>通用寄存器\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>64 位\u003c/th>\u003cth>低 32\u003c/th>\u003cth>低 16\u003c/th>\u003cth>低 8\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>%rax\u003c/code>\u003c/td>\u003ctd>\u003ccode>%eax\u003c/code>\u003c/td>\u003ctd>\u003ccode>%ax\u003c/code>\u003c/td>\u003ctd>\u003ccode>%al\u003c/code>\u003c/td>\u003ctd>返回值\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>%rbx\u003c/code>\u003c/td>\u003ctd>\u003ccode>%ebx\u003c/code>\u003c/td>\u003ctd>\u003ccode>%bx\u003c/code>\u003c/td>\u003ctd>\u003ccode>%bl\u003c/code>\u003c/td>\u003ctd>被调用者保存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>%rcx\u003c/code>\u003c/td>\u003ctd>\u003ccode>%ecx\u003c/code>\u003c/td>\u003ctd>\u003ccode>%cx\u003c/code>\u003c/td>\u003ctd>\u003ccode>%cl\u003c/code>\u003c/td>\u003ctd>第 4 参数 / 移位量\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>%rdx\u003c/code>\u003c/td>\u003ctd>\u003ccode>%edx\u003c/code>\u003c/td>\u003ctd>\u003ccode>%dx\u003c/code>\u003c/td>\u003ctd>\u003ccode>%dl\u003c/code>\u003c/td>\u003ctd>第 3 参数 / \u003ccode>idiv\u003c/code> 高位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>%rsi\u003c/code>\u003c/td>\u003ctd>\u003ccode>%esi\u003c/code>\u003c/td>\u003ctd>\u003ccode>%si\u003c/code>\u003c/td>\u003ctd>\u003ccode>%sil\u003c/code>\u003c/td>\u003ctd>第 2 参数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>%rdi\u003c/code>\u003c/td>\u003ctd>\u003ccode>%edi\u003c/code>\u003c/td>\u003ctd>\u003ccode>%di\u003c/code>\u003c/td>\u003ctd>\u003ccode>%dil\u003c/code>\u003c/td>\u003ctd>第 1 参数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>%rsp\u003c/code>\u003c/td>\u003ctd>\u003ccode>%esp\u003c/code>\u003c/td>\u003ctd>\u003ccode>%sp\u003c/code>\u003c/td>\u003ctd>\u003ccode>%spl\u003c/code>\u003c/td>\u003ctd>栈指针\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>%rbp\u003c/code>\u003c/td>\u003ctd>\u003ccode>%ebp\u003c/code>\u003c/td>\u003ctd>\u003ccode>%bp\u003c/code>\u003c/td>\u003ctd>\u003ccode>%bpl\u003c/code>\u003c/td>\u003ctd>帧指针\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>%r8\u003c/code>–\u003ccode>%r15\u003c/code>\u003c/td>\u003ctd>\u003ccode>%r8d\u003c/code>…\u003c/td>\u003ctd>\u003ccode>%r8w\u003c/code>…\u003c/td>\u003ctd>\u003ccode>%r8b\u003c/code>…\u003c/td>\u003ctd>第 5、6 参数等\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>常见错误选项：\u003ccode>%sl\u003c/code>、\u003ccode>%sb\u003c/code> 不存在；\u003ccode>movq %rax, $0x123\u003c/code> 目的不能是立即数；\u003ccode>movl %rax, (%rsp)\u003c/code> 后缀与宽度不符；\u003ccode>movl (%eax), 8(%ebx)\u003c/code> 是内存到内存。\u003c/p>\n\u003ch4>寻址模式\u003c/h4>\n\u003cspan class=\"math math-display\">\u003cspan class=\"m-var\">D\u003c/span>\u003cspan class=\"m-punct\">(\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">R\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-var\">b\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-punct\">,\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">R\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-var\">i\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-punct\">,\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">S\u003c/span>\u003cspan class=\"m-punct\">)\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">D\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">R\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-var\">b\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">R\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-var\">i\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-sym m-sym-times\">×\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">S\u003c/span>\u003cspan class=\"m-punct\">,\u003c/span>\u003cspan style=\"display:inline-block;width:3.2em\">\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">S\u003c/span>\u003cspan class=\"m-sym m-sym-in\">∈\u003c/span>\u003cspan class=\"m-txt\">{\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003cspan class=\"m-punct\">,\u003c/span>\u003cspan class=\"m-num\">2\u003c/span>\u003cspan class=\"m-punct\">,\u003c/span>\u003cspan class=\"m-num\">4\u003c/span>\u003cspan class=\"m-punct\">,\u003c/span>\u003cspan class=\"m-num\">8\u003c/span>\u003cspan class=\"m-txt\">}\u003c/span>\u003c/span>\n\u003cul>\u003cli>AT&amp;T 语法里立即数要加 \u003ccode>$\u003c/code>：\u003ccode>movl $1, %eax\u003c/code>；而 \u003ccode>123\u003c/code> 单独出现表示\u003cstrong>地址 123\u003c/strong> 的内容\u003c/li>\u003cli>比例因子只能是 1/2/4/8，且\u003cstrong>索引寄存器不能省略\u003c/strong>：\u003ccode>(%eax, , 4)\u003c/code> 非法\u003c/li>\u003cli>地址寄存器必须是 \u003cstrong>64 位\u003c/strong>\u003c/li>\u003cli>\u003ccode>lea\u003c/code> 只做地址算术，不访问内存：\u003ccode>leaq (%rdi,%rdi,4), %rax\u003c/code> 即 \u003cspan class=\"math\">\u003cspan class=\"m-num\">5\u003c/span>\u003cspan class=\"m-var\">x\u003c/span>\u003c/span>\u003c/li>\u003c/ul>\n\u003ch4>指令与条件码\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>指令\u003c/th>\u003cth>是否改条件码\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>mov\u003c/code> / \u003ccode>movs*\u003c/code> / \u003ccode>movz*\u003c/code> / \u003ccode>lea\u003c/code> / \u003ccode>movabsq\u003c/code>\u003c/td>\u003ctd>\u003cstrong>不改\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>inc\u003c/code> / \u003ccode>dec\u003c/code>\u003c/td>\u003ctd>改 ZF、SF、OF，\u003cstrong>不改 CF\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>add\u003c/code> / \u003ccode>sub\u003c/code> / \u003ccode>imul\u003c/code> / \u003ccode>and\u003c/code> / \u003ccode>or\u003c/code> / \u003ccode>xor\u003c/code> / \u003ccode>shl\u003c/code> / \u003ccode>sar\u003c/code> / \u003ccode>shr\u003c/code>\u003c/td>\u003ctd>改\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cmp\u003c/code> / \u003ccode>test\u003c/code>\u003c/td>\u003ctd>只改条件码，\u003cstrong>不改目的寄存器\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>口诀：\u003cstrong>\u003ccode>lea\u003c/code> 什么都不改；\u003ccode>inc/dec\u003c/code> 只不改 CF；\u003ccode>cmp/test\u003c/code> 不写寄存器。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>第 5 讲 · 机器级表示（控制）：条件码 / 跳转 / 循环\u003c/h3>\n\u003ch4>比较方向\u003c/h4>\n\u003cp>\u003ccode>cmpq %rsi, %rdi\u003c/code> 计算的是 \u003cspan class=\"math\">\u003cspan class=\"m-var\">rdi\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">rsi\u003c/span>\u003c/span> —— AT&amp;T 语法里\u003cstrong>源操作数在后\u003c/strong>。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>C 语义\u003c/th>\u003cth>指令\u003c/th>\u003cth>位级条件\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>a &gt; b\u003c/code>（有符号）\u003c/td>\u003ctd>\u003ccode>jg\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-group\">\u003cspan class=\"m-sym m-sym-sim\">∼\u003c/span>\u003c/span>\u003cspan class=\"m-punct\">(\u003c/span>\u003cspan class=\"m-var\">SF\u003c/span>\u003cspan class=\"m-sym m-sym-oplus\">⊕\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">OF\u003c/span>\u003cspan class=\"m-punct\">)\u003c/span>\u003cspan style=\"display:inline-block;width:0.18em\">\u003c/span>\u003cspan class=\"m-txt\">&amp;\u003c/span>\u003cspan style=\"display:inline-block;width:0.18em\">\u003c/span>\u003cspan class=\"m-group\">\u003cspan class=\"m-sym m-sym-sim\">∼\u003c/span>\u003c/span>\u003cspan class=\"m-var\">ZF\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>a &gt;= b\u003c/code>\u003c/td>\u003ctd>\u003ccode>jge\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-group\">\u003cspan class=\"m-sym m-sym-sim\">∼\u003c/span>\u003c/span>\u003cspan class=\"m-punct\">(\u003c/span>\u003cspan class=\"m-var\">SF\u003c/span>\u003cspan class=\"m-sym m-sym-oplus\">⊕\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">OF\u003c/span>\u003cspan class=\"m-punct\">)\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>a &lt; b\u003c/code>\u003c/td>\u003ctd>\u003ccode>jl\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-var\">SF\u003c/span>\u003cspan class=\"m-sym m-sym-oplus\">⊕\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">OF\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>a &lt;= b\u003c/code>\u003c/td>\u003ctd>\u003ccode>jle\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-punct\">(\u003c/span>\u003cspan class=\"m-var\">SF\u003c/span>\u003cspan class=\"m-sym m-sym-oplus\">⊕\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">OF\u003c/span>\u003cspan class=\"m-punct\">)\u003c/span>\u003cspan style=\"display:inline-block;width:0.18em\">\u003c/span>\u003cspan class=\"m-sym m-sym-mid\">∣\u003c/span>\u003cspan style=\"display:inline-block;width:0.18em\">\u003c/span>\u003cspan class=\"m-var\">ZF\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>a &gt; b\u003c/code>（无符号）\u003c/td>\u003ctd>\u003ccode>ja\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-group\">\u003cspan class=\"m-sym m-sym-sim\">∼\u003c/span>\u003c/span>\u003cspan class=\"m-var\">CF\u003c/span>\u003cspan style=\"display:inline-block;width:0.18em\">\u003c/span>\u003cspan class=\"m-txt\">&amp;\u003c/span>\u003cspan style=\"display:inline-block;width:0.18em\">\u003c/span>\u003cspan class=\"m-group\">\u003cspan class=\"m-sym m-sym-sim\">∼\u003c/span>\u003c/span>\u003cspan class=\"m-var\">ZF\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>a &gt;= b\u003c/code>（无符号）\u003c/td>\u003ctd>\u003ccode>jae\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-group\">\u003cspan class=\"m-sym m-sym-sim\">∼\u003c/span>\u003c/span>\u003cspan class=\"m-var\">CF\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>a == b\u003c/code>\u003c/td>\u003ctd>\u003ccode>je\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\">\u003cspan class=\"m-var\">ZF\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>set*\u003c/code> 的目的操作数只能是\u003cstrong>单字节寄存器\u003c/strong>；配合 \u003ccode>movzbl\u003c/code> 会顺带把高 32 位清零。\u003c/p>\n\u003ch4>条件跳转 vs 条件传送\u003c/h4>\n\u003cul>\u003cli>\u003ccode>cmov\u003c/code> \u003cstrong>不支持单字节\u003c/strong>（不存在 \u003ccode>cmovb\u003c/code>）\u003c/li>\u003cli>\u003ccode>cmov\u003c/code> 会把\u003cstrong>两个分支都算出来\u003c/strong>：分支含副作用（函数调用、解引用）或计算昂贵时不能使用\u003c/li>\u003cli>分支容易预测时用跳转更快；两个分支都很便宜时 \u003ccode>cmov\u003c/code> 更优\u003c/li>\u003cli>\u003ccode>xp ? *xp : 0\u003c/code> 若编译为 \u003ccode>cmov\u003c/code>，会\u003cstrong>无条件解引用\u003c/strong> \u003ccode>xp\u003c/code>，\u003ccode>xp\u003c/code> 为 NULL 时出错\u003c/li>\u003c/ul>\n\u003ch4>switch 与跳转表\u003c/h4>\n\u003cul>\u003cli>跳转表：\u003ccode>jmp *.L4(,%rdi,8)\u003c/code>，索引 \u003cspan class=\"math\">\u003cspan class=\"m-var\">i\u003c/span>\u003c/span> 对应第 \u003cspan class=\"math\">\u003cspan class=\"m-var\">i\u003c/span>\u003c/span> 个 8 字节表项\u003c/li>\u003cli>越界用 \u003ccode>ja\u003c/code>（无符号比较）兜住\u003c/li>\u003cli>编译器常先把索引\u003cstrong>减去最小值\u003c/strong>再查表\u003c/li>\u003cli>\u003cstrong>case 稀疏时不会生成跳转表\u003c/strong>，退化成比较链\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3>第 6 讲 · 机器级表示（过程）：栈帧与调用约定\u003c/h3>\n\u003ch4>栈帧布局\u003c/h4>\n\u003cdiv class=\"code-block lang-text\">\u003cdiv class=\"code-lang\">Text\u003c/div>\u003cpre>\u003ccode>高地址\n  ┌────────────────────────────┐\n  │ 调用者的栈帧                 │\n  ├────────────────────────────┤\n  │ 参数 8、参数 7 …（参数 7 最后压栈）│  ← %rbp + 16 + …\n  ├────────────────────────────┤\n  │ 返回地址                     │  ← %rbp + 8\n  ├────────────────────────────┤\n  │ 保存的旧 %rbp                │  ← %rbp 指向此处\n  ├────────────────────────────┤\n  │ 被保存的被调用者寄存器        │\n  │ 局部变量 / 缓冲区            │\n  ├────────────────────────────┤\n低地址│ %rsp（当前栈顶）            │\n  └────────────────────────────┘\u003c/code>\u003c/pre>\u003c/div>\n\u003cul>\u003cli>栈\u003cstrong>向低地址增长\u003c/strong>；\u003ccode>pushq %rbp\u003c/code> 等价于 \u003ccode>subq $8, %rsp\u003c/code> 加 \u003ccode>movq %rbp, (%rsp)\u003c/code>\u003c/li>\u003cli>\u003ccode>call\u003c/code> 压入\u003cstrong>下一条指令的地址\u003c/strong>，\u003ccode>ret\u003c/code> 弹出到 PC\u003c/li>\u003cli>\u003ccode>leave\u003c/code> 等价于 \u003ccode>movq %rbp, %rsp\u003c/code> 后 \u003ccode>popq %rbp\u003c/code>\u003c/li>\u003c/ul>\n\u003ch4>寄存器保存约定\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>类别\u003c/th>\u003cth>寄存器\u003c/th>\u003cth>谁负责保存\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>调用者保存\u003c/td>\u003ctd>\u003ccode>%rax %rdi %rsi %rdx %rcx %r8\u003c/code>–\u003ccode>%r11\u003c/code>\u003c/td>\u003ctd>调用者\u003c/td>\u003c/tr>\u003ctr>\u003ctd>被调用者保存\u003c/td>\u003ctd>\u003ccode>%rbx %rbp %r12\u003c/code>–\u003ccode>%r15\u003c/code>\u003c/td>\u003ctd>被调用者\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>跨 \u003ccode>call\u003c/code> 使用 \u003ccode>%rbx\u003c/code> 是安全的，因为它由被调用者负责恢复。\u003c/p>\n\u003ch4>参数传递\u003c/h4>\n\u003cul>\u003cli>前 6 个整型/指针参数：\u003ccode>%rdi %rsi %rdx %rcx %r8 %r9\u003c/code>\u003c/li>\u003cli>浮点参数用 \u003ccode>%xmm0\u003c/code>–\u003ccode>%xmm7\u003c/code>\u003c/li>\u003cli>第 7 个及以后\u003cstrong>压入栈\u003c/strong>，且\u003cstrong>参数 7 最后压栈\u003c/strong>（最靠近返回地址）\u003c/li>\u003cli>第 \u003cspan class=\"math\">\u003cspan class=\"m-var\">k\u003c/span>\u003c/span>（\u003cspan class=\"math\">\u003cspan class=\"m-var\">k\u003c/span>\u003cspan class=\"m-rel\">&gt;\u003c/span>\u003cspan class=\"m-num\">6\u003c/span>\u003c/span>）个参数地址 \u003cspan class=\"math\">\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-txt\">%\u003c/span>\u003cspan class=\"m-var\">rsp\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-num\">8\u003c/span>\u003cspan class=\"m-sym m-sym-times\">×\u003c/span>\u003cspan class=\"m-punct\">(\u003c/span>\u003cspan class=\"m-var\">k\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">6\u003c/span>\u003cspan class=\"m-punct\">)\u003c/span>\u003c/span>，其中 \u003ccode>%rsp\u003c/code> 是执行完 \u003ccode>call\u003c/code> 之后的值\u003c/li>\u003c/ul>\n\u003ch4>其他常考结论\u003c/h4>\n\u003cul>\u003cli>栈帧通常\u003cstrong>定长\u003c/strong>，大小在\u003cstrong>编译时\u003c/strong>确定（表现为 \u003ccode>subq $N, %rsp\u003c/code>）\u003c/li>\u003cli>大结构体作参数/返回值时通过\u003cstrong>栈\u003c/strong>传递；返回结构体的地址放在 \u003ccode>%rax\u003c/code>，内容实际存放在\u003cstrong>调用者\u003c/strong>的栈帧里\u003c/li>\u003cli>递归每层新建栈帧，空间开销 \u003cspan class=\"math\">\u003cspan class=\"m-var\">O\u003c/span>\u003cspan class=\"m-punct\">(\u003c/span>\u003cspan class=\"m-var\">n\u003c/span>\u003cspan class=\"m-punct\">)\u003c/span>\u003c/span>；调用深度可以直接数栈中同名帧的个数\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3>第 7 讲 · 机器级表示（数据）：数组 / 结构体 / 联合\u003c/h3>\n\u003ch4>数组\u003c/h4>\n\u003cul>\u003cli>\u003ccode>T a[N]\u003c/code>：\u003ccode>a[i]\u003c/code> 的地址为 \u003cspan class=\"math\">\u003cspan class=\"m-var\">a\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">i\u003c/span>\u003cspan class=\"m-sym m-sym-times\">×\u003c/span>\u003cspan class=\"m-txt\">sizeof\u003c/span>\u003cspan class=\"m-punct\">(\u003c/span>\u003cspan class=\"m-var\">T\u003c/span>\u003cspan class=\"m-punct\">)\u003c/span>\u003c/span>\u003c/li>\u003cli>\u003ccode>int a[R][C]\u003c/code>：\u003ccode>a[i][j]\u003c/code> 的地址为 \u003cspan class=\"math\">\u003cspan class=\"m-var\">a\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-punct\">(\u003c/span>\u003cspan class=\"m-var\">i\u003c/span>\u003cspan class=\"m-sym m-sym-times\">×\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">C\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">j\u003c/span>\u003cspan class=\"m-punct\">)\u003c/span>\u003cspan class=\"m-sym m-sym-times\">×\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-num\">4\u003c/span>\u003c/span>\u003c/li>\u003cli>变长数组 \u003ccode>int a[n][n]\u003c/code> 作参数时地址为 \u003cspan class=\"math\">\u003cspan class=\"m-var\">a\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-punct\">(\u003c/span>\u003cspan class=\"m-var\">i\u003c/span>\u003cspan class=\"m-sym m-sym-cdot\">⋅\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">n\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">j\u003c/span>\u003cspan class=\"m-punct\">)\u003c/span>\u003cspan class=\"m-sym m-sym-times\">×\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-num\">4\u003c/span>\u003c/span>，编译成 \u003ccode>imulq\u003c/code>\u003c/li>\u003cli>指针减法：先强转 \u003ccode>(char*)\u003c/code> 得到\u003cstrong>字节差\u003c/strong>，否则要除以元素大小\u003c/li>\u003c/ul>\n\u003ch4>结构体对齐（x86-64 Linux）\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>类型\u003c/th>\u003cth>对齐\u003c/th>\u003cth>大小\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>char\u003c/code>\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>short\u003c/code>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>int\u003c/code> / \u003ccode>float\u003c/code>\u003c/td>\u003ctd>4\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>long\u003c/code> / \u003ccode>double\u003c/code> / 指针\u003c/td>\u003ctd>8\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>三步法\u003c/strong>：① 每个成员按自身大小的倍数对齐；② 整体大小向上取到\u003cstrong>最大成员对齐值\u003c/strong>的倍数；③ 想最小化就\u003cstrong>按大小重排\u003c/strong>（大的挨在一起）。\u003c/p>\n\u003cp>平台差异要小心：IA32 / Windows 下 \u003ccode>double\u003c/code> 与 \u003ccode>long long\u003c/code> 可能按 \u003cstrong>4 字节\u003c/strong>对齐。先算「原序大小」再算「重排后大小」，两者之差往往正好等于 padding 之和。\u003c/p>\n\u003ch4>union 与声明解读\u003c/h4>\n\u003cul>\u003cli>\u003ccode>union\u003c/code> 的成员\u003cstrong>共享同一段内存\u003c/strong>，大小 = 最大成员对齐后的大小\u003c/li>\u003cli>union 的大小与成员排列\u003cstrong>无关\u003c/strong>（「给 union 成员排序使其最小」是错的）\u003c/li>\u003cli>位模式重解释：\u003ccode>union {float f; int i;}\u003c/code>；大端机器「正着」拼，小端机器「倒着」拼\u003c/li>\u003c/ul>\n\u003cp>复杂声明用\u003cstrong>左右法则\u003c/strong>读：\u003c/p>\n\u003cul>\u003cli>\u003ccode>int (*A[2])[3]\u003c/code>：含 2 个「指向 \u003ccode>int[3]\u003c/code> 的指针」的数组；\u003ccode>sizeof(A)=16\u003c/code>，\u003ccode>sizeof(*A)=8\u003c/code>，\u003ccode>sizeof(**A)=12\u003c/code>，\u003ccode>sizeof(***A)=4\u003c/code>\u003c/li>\u003cli>\u003ccode>int *(*f[3])()\u003c/code>：含 3 个「返回 \u003ccode>int*\u003c/code> 的函数指针」的数组\u003c/li>\u003c/ul>\n\u003ch4>sizeof 速算示例\u003c/h4>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>struct student { int id; char name[6]; short age; char gender; float score; };\n/* 4 + 6 + 2 + 1(+3) + 4 = 20 字节，对齐 4 */\u003c/code>\u003c/pre>\u003c/div>\n\u003chr>\n\u003ch3>第 8 讲 · 机器级表示（高级）：缓冲区溢出\u003c/h3>\n\u003ch4>攻击原理\u003c/h4>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>void echo(char *s) {\n    char buf[16];     /* 缓冲区在低地址 */\n    strcpy(buf, s);   /* 不检查长度 */\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>strcpy\u003c/code> 会写入\u003cstrong>源串长度 + 1 个结束符\u003c/strong>。溢出依次覆盖：\u003c/p>\n\u003col>\u003cli>缓冲区之后的\u003cstrong>局部变量\u003c/strong>\u003c/li>\u003cli>保存的\u003cstrong>被调用者寄存器\u003c/strong>\u003c/li>\u003cli>保存的 \u003ccode>%rbp\u003c/code>\u003c/li>\u003cli>\u003cstrong>返回地址\u003c/strong> —— 改写它就能劫持控制流\u003c/li>\u003c/ol>\n\u003cp>注意字符串结尾的 \u003ccode>'\\0'\u003c/code> \u003cstrong>也会写入\u003c/strong>，所以构造载荷时通常要绕开或垫掉这个字节。\u003c/p>\n\u003ch4>防御手段对比（2025 卷原表）\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>方法\u003c/th>\u003cth>需要改源码\u003c/th>\u003cth>需要重新编译\u003c/th>\u003cth>需要换硬件\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>使用 \u003ccode>fgets()\u003c/code> 等安全库函数\u003c/td>\u003ctd>\u003cstrong>是\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>是\u003c/strong>\u003c/td>\u003ctd>否\u003c/td>\u003c/tr>\u003ctr>\u003ctd>栈初始位置随机化（ASLR）\u003c/td>\u003ctd>否\u003c/td>\u003ctd>否\u003c/td>\u003ctd>否\u003c/td>\u003c/tr>\u003ctr>\u003ctd>内存页设置「不可执行」位\u003c/td>\u003ctd>否\u003c/td>\u003ctd>否\u003c/td>\u003ctd>\u003cstrong>是\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>金丝雀（哨兵）机制\u003c/td>\u003ctd>否\u003c/td>\u003ctd>\u003cstrong>是\u003c/strong>\u003c/td>\u003ctd>否\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>金丝雀机制的汇编特征\u003c/h4>\n\u003cdiv class=\"code-block lang-asm\">\u003cdiv class=\"code-lang\">x86-64 ASM\u003c/div>\u003cpre>\u003ccode>movq %fs:0x28, %rax      # 从只读段取哨兵值\nmovq %rax, -0x8(%rbp)    # 放在缓冲区与返回地址之间\n...                      # 函数体\nmovq -0x8(%rbp), %rax\nxorq %fs:0x28, %rax      # 用 xor 比较（不破坏寄存器）\nje   .L2\ncall __stack_chk_fail@plt\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>要点：用 \u003cstrong>\u003ccode>xorq\u003c/code>\u003c/strong> 而不是 \u003ccode>cmpq\u003c/code> 做比较，再用 \u003ccode>je\u003c/code> 跳转；失败时调用 \u003ccode>__stack_chk_fail\u003c/code>。\u003c/p>\n\u003ch4>其他结论\u003c/h4>\n\u003cul>\u003cli>\u003cstrong>变长栈帧不能\u003c/strong>防御缓冲区溢出攻击\u003c/li>\u003cli>ASLR 的权衡：随机范围要\u003cstrong>足够大\u003c/strong>才能对抗攻击，又要\u003cstrong>足够小\u003c/strong>以免浪费地址空间\u003c/li>\u003cli>可执行位的检查由\u003cstrong>硬件\u003c/strong>完成，效率上没有损失\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3>通用应试套路\u003c/h3>\n\u003ch4>浮点编码五步法\u003c/h4>\n\u003col>\u003cli>由\u003cstrong>总位数\u003c/strong>确定 \u003cspan class=\"math\">\u003cspan class=\"m-var\">s\u003c/span>\u003cspan class=\"m-punct\">,\u003c/span>\u003cspan class=\"m-var\">k\u003c/span>\u003cspan class=\"m-punct\">,\u003c/span>\u003cspan class=\"m-var\">n\u003c/span>\u003c/span>，算出偏置 \u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-var\">k\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>\u003c/li>\u003cli>把十进制写成 \u003cspan class=\"math\">\u003cspan class=\"m-punct\">(\u003c/span>\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-punct\">)\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-var\">s\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"m-sym m-sym-times\">×\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">M\u003c/span>\u003cspan class=\"m-sym m-sym-times\">×\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-var\">E\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>（\u003cspan class=\"math\">\u003cspan class=\"m-num\">1\u003c/span>\u003cspan class=\"m-sym m-sym-le\">≤\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-var\">M\u003c/span>\u003cspan class=\"m-rel\">&lt;\u003c/span>\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>，或非规格化时 \u003cspan class=\"math\">\u003cspan class=\"m-var\">M\u003c/span>\u003cspan class=\"m-rel\">&lt;\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>）\u003c/li>\u003cli>判断类型：\u003cspan class=\"math\">\u003cspan class=\"m-var\">E\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">E\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-txt\">min\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 且 \u003cspan class=\"math\">\u003cspan class=\"m-var\">M\u003c/span>\u003cspan class=\"m-rel\">&lt;\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span> 是非规格化；\u003cspan class=\"math\">\u003cspan class=\"m-var\">E\u003c/span>\u003cspan class=\"m-rel\">&gt;\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">E\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-txt\">max\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 则上溢为 \u003cspan class=\"math\">\u003cspan class=\"m-sym m-sym-pm\">±\u003c/span>\u003cspan class=\"m-sym m-sym-infty\">∞\u003c/span>\u003c/span>\u003c/li>\u003cli>写阶码 \u003cspan class=\"math\">\u003cspan class=\"m-txt\">exp\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-var\">E\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan class=\"m-txt\">bias\u003c/span>\u003c/span>、小数 \u003cspan class=\"math\">\u003cspan class=\"m-txt\">frac\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-punct\">(\u003c/span>\u003cspan class=\"m-var\">M\u003c/span>\u003cspan class=\"m-op\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003cspan class=\"m-punct\">)\u003c/span>\u003cspan class=\"m-sym m-sym-times\">×\u003c/span>\u003cspan style=\"display:inline-block;width:0.3em\">\u003c/span>\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-num\">2\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sup\">\u003cspan class=\"m-var\">n\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/li>\u003cli>拼二进制再转十六进制；求最值时\u003cstrong>先确定阶码的两个边界值\u003c/strong>\u003c/li>\u003c/ol>\n\u003ch4>结构体对齐三步法\u003c/h4>\n\u003col>\u003cli>每个成员按\u003cstrong>自身大小\u003c/strong>对齐（\u003ccode>short\u003c/code>→2，\u003ccode>int\u003c/code>/\u003ccode>float\u003c/code>→4，\u003ccode>double\u003c/code>/指针→8）\u003c/li>\u003cli>总大小向上取到\u003cstrong>最大成员对齐值\u003c/strong>的倍数\u003c/li>\u003cli>求最小布局就\u003cstrong>按大小重排\u003c/strong>再算一遍\u003c/li>\u003c/ol>\n\u003ch4>汇编阅读套路\u003c/h4>\n\u003col>\u003cli>先看\u003cstrong>参数\u003c/strong>落在哪些寄存器（\u003ccode>%rdi %rsi %rdx %rcx %r8 %r9\u003c/code>）\u003c/li>\u003cli>再看\u003cstrong>栈帧\u003c/strong>：\u003ccode>sub $N, %rsp\u003c/code> 定大小；\u003ccode>-0x??(%rbp)\u003c/code> 是局部变量，\u003ccode>0x??(%rbp)\u003c/code> 是入参\u003c/li>\u003cli>找\u003cstrong>比较 + 跳转\u003c/strong>配成对，翻译成 \u003ccode>if / while / for\u003c/code>\u003c/li>\u003cli>找\u003cstrong>跳转表\u003c/strong>（\u003ccode>.quad\u003c/code> 列表 + \u003ccode>jmp *\u003c/code>）还原 \u003ccode>switch\u003c/code>\u003c/li>\u003cli>找\u003cstrong>递归\u003c/strong>：\u003ccode>call\u003c/code> 自身，两个 \u003ccode>mov\u003c/code> 装参数\u003c/li>\u003c/ol>\n\u003ch4>条件成立性判断题模板\u003c/h4>\n\u003col>\u003cli>先找\u003cstrong>特例\u003c/strong>：\u003cspan class=\"math\">\u003cspan class=\"m-ss\">\u003cspan class=\"m-atom\">\u003cspan class=\"m-var\">T\u003c/span>\u003c/span>\u003cspan class=\"m-scripts\">\u003cspan class=\"m-sub\">\u003cspan class=\"m-txt\">min\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>、\u003cspan class=\"math\">\u003cspan class=\"m-num\">0\u003c/span>\u003c/span>、\u003cspan class=\"math\">\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>、NaN、\u003cspan class=\"math\">\u003cspan class=\"m-sym m-sym-pm\">±\u003c/span>\u003cspan class=\"m-sym m-sym-infty\">∞\u003c/span>\u003c/span>、溢出临界点\u003c/li>\u003cli>无符号比较一律按「位模式比大小」处理\u003c/li>\u003cli>浮点题先问「会不会出现 NaN / Inf」「会不会溢出」\u003c/li>\u003cli>恒等式优先用\u003cstrong>位级推导\u003c/strong>（如 \u003cspan class=\"math\">\u003cspan class=\"m-op m-unary\">-\u003c/span>\u003cspan class=\"m-var\">x\u003c/span>\u003cspan class=\"m-rel\">=\u003c/span>\u003cspan class=\"m-group\">\u003cspan class=\"m-sym m-sym-sim\">∼\u003c/span>\u003c/span>\u003cspan class=\"m-var\">x\u003c/span>\u003cspan class=\"m-op\">+\u003c/span>\u003cspan class=\"m-num\">1\u003c/span>\u003c/span>），不要靠代数直觉\u003c/li>\u003c/ol>\n\u003ch4>主观题抢分技巧\u003c/h4>\n\u003cul>\u003cli>汇编补全题：先写出\u003cstrong>指令模板\u003c/strong>再填操作数，注意 \u003ccode>$\u003c/code>、\u003ccode>%\u003c/code>、后缀与宽度\u003c/li>\u003cli>栈图题：先把 \u003ccode>%rbp\u003c/code>、返回地址、参数区标出来，再填局部变量\u003c/li>\u003cli>「判断正误」题：\u003cstrong>给出反例\u003c/strong>比只写对错更容易拿分\u003c/li>\u003cli>浮点最值题：把阶码写成 \u003ccode>00…01\u003c/code> / \u003ccode>11…10\u003c/code> 再代入，不要凭记忆\u003c/li>\u003c/ul>"}</script>

  function mathReadBrace(st) {

    var buf = '';
    while (j < st.s.length) {

    if (c === '\\') {

  function mathParse(src) {

  function mathParseSeq(st, stopAtBrace) {
