          nodes.push(target);
        }
        if (c === '^') target.sup = mathParse(argSrc);
        else target.sub = mathParse(argSrc);
        continue;
      }
      if (c === '\\') {
        var cmd = /^\\([a-zA-Z]+|.)/.exec(s.slice(st.i));
        if (!cmd) { st.i++; continue; }
        var name = cmd[1];
        st.i += cmd[0].length;
        if (name === 'frac' || name === 'dfrac' || name === 'tfrac') {
          var a1 = mathReadArg(st), a2 = mathReadArg(st);
          nodes.push({ type: 'frac', num: mathParse(a1), den: mathParse(a2) });
          continue;
        }
        if (name === 'sqrt') {
          nodes.push({ type: 'sqrt', body: mathParse(mathReadArg(st)) });
          continue;
        }
        if (name === 'text' || name === 'mathrm' || name === 'mbox' ||
          name === 'operatorname' || name === 'textbf' || name === 'mathbb' ||
          name === 'mathcal' || name === 'mathbf' || name === 'mathit' || name === 'textsf') {
          var t = mathReadBrace(st);
          nodes.push({ type: 'text', html: escapeHtml(t).replace(/ /g, '&nbsp;') });
          continue;
        }
        if (name === 'overline' || name === 'bar') {
          nodes.push({ type: 'over', body: mathParse(mathReadArg(st)) });
          continue;
        }
        if (name === 'underline') {
          nodes.push({ type: 'under', body: mathParse(mathReadArg(st)) });
          continue;
        }
        // 花括号类命令：只渲染参数（\mathord{\sim}、\mathrel{\&} 等）
        if (name === 'mathord' || name === 'mathrel' || name === 'mathbin' || name === 'mathop' ||
          name === 'mathpunct' || name === 'mathopen' || name === 'mathclose' ||
          name === 'mathinner' || name === 'hbox' || name === 'textnormal' || name === 'bm') {
          nodes.push({ type: 'group', children: mathParse(mathReadArg(st)) });
          continue;
        }
        // 重音符号
        if (name === 'vec' || name === 'hat' || name === 'tilde' || name === 'dot' ||
          name === 'ddot' || name === 'acute' || name === 'grave' || name === 'check') {
          var accent = {
            vec: '\u20d7', hat: '\u0302', tilde: '\u0303', dot: '\u0307',
            ddot: '\u0308', acute: '\u0301', grave: '\u0300', check: '\u030c'
          }[name];
          nodes.push({ type: 'group', children: mathParse(mathReadArg(st) + accent) });
          continue;
        }
        if (name === 'quad') { nodes.push({ type: 'space', size: '1.6em' }); continue; }
        if (name === 'qquad') { nodes.push({ type: 'space', size: '3.2em' }); continue; }
        if (name === ' ' || name === 'space' || name === ',' || name === ';' || name === ':') {
          nodes.push({ type: 'space', size: name === ':' ? '0.3em' : '0.18em' });
          continue;
        }
        if (name === '!') { nodes.push({ type: 'space', size: '-0.15em' }); continue; }
        if (name === 'left' || name === 'right' || name === 'big' || name === 'Big' ||
          name === 'bigl' || name === 'bigr' || name === 'displaystyle' || name === 'limits') {
          continue;
        }
        if (name === 'bmod') { nodes.push({ type: 'op', html: 'mod' }); continue; }
        if (name === 'pmod') {
          nodes.push({ type: 'text', html: '&nbsp;(mod&nbsp;' });
          nodes.push({ type: 'group', children: mathParse(mathReadArg(st)) });
          nodes.push({ type: 'text', html: ')' });
          continue;
        }
        if (FUNCS.indexOf(name) >= 0) { nodes.push({ type: 'text', html: name }); continue; }
        if (Object.prototype.hasOwnProperty.call(SYM, name)) {
          if (SYM[name]) nodes.push({ type: 'sym', html: SYM[name], name: name });
          continue;
        }
        if (name === '{' || name === '}' || name === '_' || name === '%' || name === '&' ||
          name === '#' || name === '$') {
          nodes.push({ type: 'text', html: escapeHtml(name) });
          continue;
        }
        nodes.push({ type: 'text', html: escapeHtml(cmd[0]) });
        continue;
      }
      if (c === ' ') { nodes.push({ type: 'space', size: '0.3em' }); st.i++; continue; }
      if (/[0-9]/.test(c)) {
        var m2 = /^[0-9]+(\.[0-9]+)?/.exec(s.slice(st.i));
        nodes.push({ type: 'num', html: m2[0] });
        st.i += m2[0].length;
        continue;
      }
      if (/[a-zA-Z]/.test(c)) {
        var run = /^[a-zA-Z]+/.exec(s.slice(st.i))[0];
        nodes.push({ type: 'var', html: escapeHtml(run) });
        st.i += run.length;
        continue;
      }
      nodes.push(classifyChar(c));
      st.i++;
    }
    return nodes;
  }

  function renderMath(src, display) {
    var html = renderNodes(mathParse(src));
    return '<span class="math' + (display ? ' math-display' : '') + '">' + html + '</span>';
  }

  function renderNodes(nodes) {
    // 预扫描：标记一元运算符（前面是运算符/关系符/左括号/开头时）
    for (var p = 0; p < nodes.length; p++) {
      var node = nodes[p];
      if (node.type !== 'op') continue;
      var prev = null;
      for (var q = p - 1; q >= 0; q--) {
        if (nodes[q].type !== 'space') { prev = nodes[q]; break; }
      }
      var isUnary = !prev ||
        prev.type === 'op' || prev.type === 'rel' ||
        (prev.type === 'punct' && /[(\[{,]/.test(prev.html));
      node.unary = !!isUnary;
    }
    var out = '';
    for (var k = 0; k < nodes.length; k++) out += renderNode(nodes[k]);
    return out;
  }

  function withScripts(baseHtml, nd) {
    if (!nd.sup && !nd.sub) return baseHtml;
    var scripts = '<span class="m-scripts">';
    if (nd.sup) scripts += '<span class="m-sup">' + renderNodes(nd.sup) + '</span>';
    if (nd.sub) scripts += '<span class="m-sub">' + renderNodes(nd.sub) + '</span>';
    scripts += '</span>';
    return '<span class="m-ss"><span class="m-atom">' + baseHtml + '</span>' + scripts + '</span>';
  }

  function renderNode(nd) {
    if (!nd) return '';
    var base;
    switch (nd.type) {
      case 'space':
        return '<span style="display:inline-block;width:' + nd.size + '"></span>';
      case 'text':
        base = '<span class="m-txt">' + nd.html + '</span>'; break;
      case 'num':
        base = '<span class="m-num">' + nd.html + '</span>'; break;
      case 'var':
        base = '<span class="m-var">' + nd.html + '</span>'; break;
      case 'op':
        base = '<span class="m-op' + (nd.unary ? ' m-unary' : '') + '">' + nd.html + '</span>'; break;
      case 'rel':
        base = '<span class="m-rel">' + nd.html + '</span>'; break;
      case 'punct':
        base = '<span class="m-punct">' + nd.html + '</span>'; break;
      case 'sym':
        base = '<span class="m-sym m-sym-' + nd.name + '">' + nd.html + '</span>'; break;
      case 'group':
        base = '<span class="m-group">' + renderNodes(nd.children) + '</span>'; break;
      case 'frac':
        return '<span class="m-frac"><span class="m-fnum">' + renderNodes(nd.num) +
          '</span><span class="m-fden">' + renderNodes(nd.den) + '</span></span>';
      case 'sqrt':
        return '<span class="m-sqrt"><span class="m-radical">\u221a</span><span class="m-rad">' +
          renderNodes(nd.body) + '</span></span>';
      case 'over':
        return '<span class="m-over">' + renderNodes(nd.body) + '</span>';
      case 'under':
        return '<span class="m-under">' + renderNodes(nd.body) + '</span>';
      case 'atom':
        base = '<span class="m-atom">' + (nd.inner || '') + '</span>'; break;
      default:
        return '';
    }
    return withScripts(base, nd);
  }

  /* ------------------------- 行内 Markdown 解析 ------------------------- */

  var ESCAPABLE = '\\`*_{}[]()#+-.!|$>';

  function findUnescaped(text, needle, from) {
    var idx = from;
    while (true) {
      idx = text.indexOf(needle, idx);
      if (idx < 0) return -1;
      var back = 0;
      var p = idx - 1;
      while (p >= 0 && text[p] === '\\') { back++; p--; }
      if (back % 2 === 0) return idx;
      idx += needle.length;
    }
  }

  function renderInline(text) {
    var out = '';
    var i = 0;
    var n = text.length;
    while (i < n) {
      var c = text[i];

      // 反斜杠转义
      if (c === '\\' && i + 1 < n && ESCAPABLE.indexOf(text[i + 1]) >= 0) {
        out += escapeHtml(text[i + 1]);
        i += 2;
        continue;
      }
      // 行内公式 \( ... \)
      if (c === '\\' && text[i + 1] === '(') {
        var j1 = findUnescaped(text, '\\)', i + 2);
        if (j1 > i) { out += renderMath(text.slice(i + 2, j1), false); i = j1 + 2; continue; }
      }
      if (c === '\\' && text[i + 1] === '[') {
        var j2 = findUnescaped(text, '\\]', i + 2);
        if (j2 > i) { out += renderMath(text.slice(i + 2, j2), true); i = j2 + 2; continue; }
      }
      // 数学 $ ... $
      if (c === '$') {
        if (text[i + 1] === '$') {
          var jd = findUnescaped(text, '$$', i + 2);
          if (jd > i + 1) {
            out += renderMath(text.slice(i + 2, jd), true); i = jd + 2; continue;
          }
        }
        var js = findUnescaped(text, '$', i + 1);
        if (js > i + 1 && text.slice(i + 1, js).indexOf('\n') < 0) {
          out += renderMath(text.slice(i + 1, js), false); i = js + 1; continue;
        }
      }
      // 行内代码
      if (c === '`') {
        var jc = text.indexOf('`', i + 1);
        if (jc > i) {
          out += '<code>' + escapeHtml(text.slice(i + 1, jc)) + '</code>';
          i = jc + 1;
          continue;
        }
      }
      // 加粗
      if (c === '*' && text[i + 1] === '*') {
        var jb = text.indexOf('**', i + 2);
        if (jb > i && text.slice(i + 2, jb).replace(/\s/g, '') !== '') {
          out += '<strong>' + renderInline(text.slice(i + 2, jb)) + '</strong>';
          i = jb + 2;
          continue;
        }
      }
      // 斜体（保守判定）
      if (c === '*') {
        var prevOk = i === 0 || /[\s(\u3000「（:：]/.test(text[i - 1]);
        if (prevOk && text[i + 1] && !/\s/.test(text[i + 1])) {
          var je = -1;
          for (var q = i + 1; q < n; q++) {
            if (text[q] === '*') {
              var after = text[q + 1];
              if (!after || /[\s),.;:、，。）\u3002\uff09]/.test(after)) { je = q; break; }
            }
          }
          if (je > i + 1 && text.slice(i + 1, je).indexOf('\n') < 0) {
            out += '<em>' + renderInline(text.slice(i + 1, je)) + '</em>';
            i = je + 1;
            continue;
          }
        }
      }
      // 链接 / 引用
      if (c === '[') {
        var close = text.indexOf(']', i + 1);
        if (close > i && text[close + 1] === '(') {
          var closeP = text.indexOf(')', close + 2);
          if (closeP > close) {
            var label = text.slice(i + 1, close);
            var href = text.slice(close + 2, closeP).trim();
            if (/\.(md|pdf|docx)$/i.test(href) || href.indexOf('//') < 0) {
              out += '<span class="reflink" title="' + escapeHtml(href) + '">' + renderInline(label) + '</span>';
            } else {
              out += '<a href="' + escapeHtml(href) + '" target="_blank" rel="noopener">' + renderInline(label) + '</a>';
            }
            i = closeP + 1;
            continue;
          }
        }
      }
      out += escapeHtml(c);
      i++;
    }
    return out;
  }

  /* -------------------------- 块级 Markdown 解析 -------------------------- */

  var LIST_MARKER = /^([ \t]*)([-*+]|\d+[.)]|[ivxlcdmIVXLCDM]+[.)]|[a-zA-Z][.)])([ \t]+)(.*)$/;

  function listMarker(line) {
    var m = LIST_MARKER.exec(line);
    if (!m) return null;
    var marker = m[2];
    // 排除误判：像 "A." 这种单字母大写后跟空格，仅当其后内容不像正文时保留
    if (/^[a-zA-Z][.)]$/.test(marker) && /^[A-Z]/.test(marker) && m[4].length > 60) return null;
    var indent = m[1].replace(/\t/g, '    ').length;
    var ordered = /^\d/.test(marker) || /^[ivxlcdmIVXLCDM]+[.)]$/.test(marker) || /^[a-zA-Z][.)]$/.test(marker);
    var num = 0;
    if (/^\d/.test(marker)) num = parseInt(marker, 10);
    return {
      indent: indent,
      marker: marker,
      contentIndent: indent + marker.length + m[3].replace(/\t/g, '    ').length,
      ordered: ordered,
      num: num,
      rest: m[4]
    };
  }

  function splitTableRow(row) {
    var cells = [];
    var cur = '';
    var i = 0;
    while (i < row.length) {
      var c = row[i];
      if (c === '\\' && row[i + 1] === '|') { cur += '|'; i += 2; continue; }
      if (c === '|') { cells.push(cur); cur = ''; i++; continue; }
      cur += c; i++;
    }
    cells.push(cur);
    if (cells.length && /^\s*$/.test(cells[0])) cells.shift();
    if (cells.length && /^\s*$/.test(cells[cells.length - 1])) cells.pop();
    return cells.map(function (x) { return x.trim(); });
  }

  function isTableSeparator(line) {
    return line.indexOf('|') >= 0 && /^[\s|:\-]+$/.test(line) && line.indexOf('-') >= 0;
  }

  function renderBlocks(lines, opts) {
    opts = opts || {};
    var headShift = opts.headShift || 0;
    var out = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];

      if (isBlank(line)) { i++; continue; }

      // 代码块
      var mFence = /^\s*(```+|~~~+)\s*([A-Za-z0-9#+_.-]*)\s*$/.exec(line);
      if (mFence) {
        var fence = mFence[1].charAt(0);
        var lang = mFence[2] || '';
        var buf = [];
        i++;
        while (i < lines.length && !new RegExp('^\\s*' + (fence === '`' ? '```+' : '~~~+') + '\\s*$').test(lines[i])) {
          buf.push(lines[i]);
          i++;
        }
        i++;
        var langCls = 'lang-' + (lang || 'text');
        var label = lang ? '<div class="code-lang">' + escapeHtml(langLabel(lang)) + '</div>' : '';
        out.push('<div class="code-block ' + langCls + '">' + label +
          '<pre><code>' + escapeHtml(buf.join('\n')) + '</code></pre></div>');
        continue;
      }

      // 标题
      var mh = /^(#{1,6})\s+(.*)$/.exec(line);
      if (mh) {
        var lvl = Math.max(1, Math.min(6, mh[1].length + headShift));
        out.push('<h' + lvl + '>' + renderInline(mh[2].replace(/\s*#+\s*$/, '')) + '</h' + lvl + '>');
        i++;
        continue;
      }

      // 分隔线
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
        out.push('<hr>');
        i++;
        continue;
      }

      // 表格
      if (/^\s*\|/.test(line) && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
        var header = splitTableRow(line);
        i += 2;
        var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          rows.push(splitTableRow(lines[i]));
          i++;
        }
        var html = '<div class="table-wrap"><table><thead><tr>';
        for (var h = 0; h < header.length; h++) html += '<th>' + renderInline(header[h]) + '</th>';
        html += '</tr></thead><tbody>';
        for (var r = 0; r < rows.length; r++) {
          html += '<tr>';
          for (var cIdx = 0; cIdx < header.length; cIdx++) {
            var cell = rows[r][cIdx] === undefined ? '' : rows[r][cIdx];
            html += '<td>' + renderInline(cell) + '</td>';
          }
          html += '</tr>';
        }
        html += '</tbody></table></div>';
        out.push(html);
        continue;
      }

      // 引用
      if (/^\s*>/.test(line)) {
        var qbuf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          qbuf.push(lines[i].replace(/^\s*>\s?/, ''));
          i++;
        }
        out.push('<blockquote>' + renderBlocks(qbuf, opts) + '</blockquote>');
        continue;
      }

      // 列表
      var lm = listMarker(line);
      if (lm) {
        var listIndent = lm.indent;
        var items = [];
        var cur = null;
        while (i < lines.length) {
          var l = lines[i];
          if (isBlank(l)) {
            var k = i + 1;
            while (k < lines.length && isBlank(lines[k])) k++;
            if (k >= lines.length) break;
            var nxt = lines[k];
            var nInd = leadingSpaces(nxt);
            var nMk = listMarker(nxt);
            if (nInd > listIndent || (nMk && nMk.indent === listIndent)) {
              if (cur) cur.lines.push('');
              i = k;
              continue;
            }
            break;
          }
          var mk = listMarker(l);
          var ind = leadingSpaces(l);
          if (mk && mk.indent === listIndent) {
            cur = {
              marker: mk.marker, num: mk.num, ordered: mk.ordered,
              lines: [mk.rest], contentIndent: mk.contentIndent
            };
            items.push(cur);
            i++;
            continue;
          }
          if (ind > listIndent && cur) {
            var strip = Math.min(ind, cur.contentIndent);
            cur.lines.push(' '.repeat(Math.max(0, ind - strip)) + l.slice(ind));
            i++;
            continue;
          }
          break;
        }
        if (!items.length) { i++; continue; }
        var tag = items[0].ordered ? 'ol' : 'ul';
        var startAttr = (tag === 'ol' && items[0].num > 1) ? ' start="' + items[0].num + '"' : '';
        var lhtml = '<' + tag + startAttr + '>';
        for (var it = 0; it < items.length; it++) {
          var body = renderListItem(items[it].lines, opts);
          lhtml += '<li>' + body + '</li>';
        }
        lhtml += '</' + tag + '>';
        out.push(lhtml);
        continue;
      }

      // 段落
      var pbuf = [line];
      i++;
      while (i < lines.length && !isBlank(lines[i])) {
        var nl = lines[i];
        if (/^\s*(```+|~~~+)/.test(nl)) break;
        if (/^(#{1,6})\s+/.test(nl)) break;
        if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(nl)) break;
        if (/^\s*>/.test(nl)) break;
        if (/^\s*\|/.test(nl) && i + 1 < lines.length && isTableSeparator(lines[i + 1])) break;
        if (listMarker(nl)) break;
        pbuf.push(nl);
        i++;
      }
      var joined = pbuf.join(' ').replace(/\s+/g, ' ').trim();
      // 整段只有一个行间公式时，不要包 <p>，直接输出居中公式
      if (/^\$\$[\s\S]*\$\$$/.test(joined) || /^\\\[[\s\S]*\\\]$/.test(joined)) {
        out.push(renderInline(joined));
      } else {
        out.push('<p>' + renderInline(joined) + '</p>');
      }
    }
    return out.join('\n');
  }

  function renderListItem(lines, opts) {
    var nonBlank = lines.filter(function (l) { return !isBlank(l); });
    if (nonBlank.length === 1) {
      return renderInline(nonBlank[0].trim());
    }
    // 若首行是纯文本、其余为块级内容，则首行单独成段
    return renderBlocks(lines, opts);
  }

  function langLabel(lang) {
    var map = {
      c: 'C', cpp: 'C++', asm: 'x86-64 ASM', assembly: 'ASM', bash: 'Shell', sh: 'Shell',
      python: 'Python', text: 'Text', json: 'JSON', gdb: 'GDB', makefile: 'Makefile', y86: 'Y86-64'
    };
    return map[lang.toLowerCase()] || lang;
  }

  /* ------------------------------ 对外接口 ------------------------------ */

  function renderMarkdown(src, opts) {
    var lines = String(src == null ? '' : src).replace(/\r\n?/g, '\n').split('\n');
    return renderBlocks(lines, opts || {});
  }

  return {
    escapeHtml: escapeHtml,
    renderInline: renderInline,
    renderMath: renderMath,
    renderMarkdown: renderMarkdown,
    renderBlocks: renderBlocks
  };
});
</script>
<script>
/* ============ ICS 阶段测验一 · 刷题台 ============ */
(function () {
  var DATA = JSON.parse(document.getElementById('ics-data').textContent);
  var Q = DATA.questions;
  var LS = 'ics1-quiz-state-v1';
  var byId = {}, lecName = {}, lecShort = {}, yearCount = {}, lecCount = {}, typeCount = {}, partCount = {};
  Q.forEach(function (q) {
    byId[q.id] = q;
    yearCount[q.year] = (yearCount[q.year] || 0) + 1;
    lecCount[q.lec] = (lecCount[q.lec] || 0) + 1;
    typeCount[q.type] = (typeCount[q.type] || 0) + 1;
    partCount[q.part] = (partCount[q.part] || 0) + 1;
  });
  DATA.lectures.forEach(function (l) { lecName[l.id] = l.name; lecShort[l.id] = l.short; });

  var state;
  try { state = JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { state = {}; }
  state.marks = state.marks || {};
  state.stars = state.stars || {};
  state.seen = state.seen || {};
  state.open = state.open || {};
  state.drafts = state.drafts || {};
  state.draftMode = state.draftMode || 'edit';
  state.answers = state.answers || {};
  state.grade = state.grade || {};
  state.single = !!state.single;
  state.singleIdx = state.singleIdx || 0;
  state.shuffle = !!state.shuffle;
  state.autoNext = !!state.autoNext;
  state.order = state.order || null;
  /* 兼容早期「运行时补丁版」草稿数据（localStorage: ics1-drafts-v1） */
  try {
    var legacyDrafts = JSON.parse(localStorage.getItem('ics1-drafts-v1') || 'null');
    if (legacyDrafts && legacyDrafts.drafts) {
      Object.keys(legacyDrafts.drafts).forEach(function (k) {
        if (!state.drafts[k]) state.drafts[k] = legacyDrafts.drafts[k];
      });
      if (legacyDrafts.mode && state.draftMode === 'edit') state.draftMode = legacyDrafts.mode;
    }
  } catch (e) {}
  state.q = state.q || '';
  state.theme = state.theme || 'light';
  state.random = state.random || null;
  state.filters = state.filters || { part: 'all', lec: 'all', st: 'all', year: 'all', type: 'all' };
  function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }

  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  var toastTimer = null;
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1500);
  }

  /* ---------- 文本索引（供搜索） ---------- */
  Q.forEach(function (q) {
    q._text = (q.id + ' ' + q.source + ' ' + q.ref + ' ' + q.type + ' ' + (q.tags || []).join(' ') +
      ' ' + q.bodyHtml.replace(/<[^>]*>/g, ' ') + ' ' + q.answerHtml.replace(/<[^>]*>/g, ' '))
      .replace(/\s+/g, ' ').toLowerCase();
  });

  /* ---------- 同类题索引 ---------- */
  var siblings = {};
  DATA.lectures.forEach(function (l) {
    var list = Q.filter(function (q) { return q.lec === l.id; }).map(function (q) { return q.id; });
    list.forEach(function (id) {
      var me = byId[id];
      var near = Q.filter(function (q) { return q.lec === l.id && q.type === me.type && q.id !== id; })
        .slice(0, 5).map(function (q) { return q.id; });
      if (near.length < 3) {
        near = list.filter(function (x) { return x !== id; }).slice(0, 5);
      }
      siblings[id] = near;
    });
  });

  /* ---------- 卡片渲染 ---------- */
  /* ---------- 单题刷题模式 ---------- */
  function visibleOrdered() {
    var list = Q.filter(match);
    if (state.shuffle && state.order) {
      var pos = {};
      state.order.forEach(function (id, i) { pos[id] = i; });
      list = list.slice().sort(function (a, b) {
        var pa = pos[a.id] === undefined ? 1e9 : pos[a.id];
        var pb = pos[b.id] === undefined ? 1e9 : pos[b.id];
        return pa - pb;
      });
    }
    return list;
  }
  function currentList() { return visibleOrdered(); }
  function gotoIndex(i) {
    var list = currentList();
    if (!list.length) return;
    state.singleIdx = ((i % list.length) + list.length) % list.length;
    save();
    apply();
    var el = document.getElementById('qc-' + list[state.singleIdx].id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function toggleSingle(on) {
    state.single = (typeof on === 'boolean') ? on : !state.single;
    if (state.single) {
      var list = currentList();
      var first = -1;
      for (var i = 0; i < list.length; i++) { if (!state.grade[list[i].id]) { first = i; break; } }
      state.singleIdx = first >= 0 ? first : 0;
      if (!list.length) toast('当前筛选下没有题目');
    }
    save();
    apply();
    toast(state.single ? '单题刷题模式：← → 翻题，空格看答案，G 判分' : '已回到列表模式');
  }

  /* ---------- 卡片渲染 ---------- */
  /* ---------- 自动判题 ---------- */
  var CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
  function numCircle(n) { return n <= 20 ? CIRCLED.charAt(n - 1) : '(' + n + ')'; }

  function normAnswer(s) {
    var t = String(s == null ? '' : s);
    t = t.replace(/[\uFF01-\uFF5E]/g, function (ch) {
      return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
    }).replace(/\u3000/g, ' ');
    return t.toLowerCase()
      .replace(/₂/g, '')
      .replace(/[\s_,，、;；。]+/g, '')
      .replace(/^0x/, '')
      .replace(/^0b/, '');
  }
  function numericOf(text, n) {
    if (/^[0-9]+$/.test(n)) return parseInt(n, 10);
    if (/^[0-9a-f]+$/.test(n)) return parseInt(n, 16);
    return null;
  }
  function sameAnswer(input, accept) {
    var a = normAnswer(input), b = normAnswer(accept);
    if (!a || !b) return false;
    if (a === b) return true;
    if (/^[01]+$/.test(a) && /^[01]+$/.test(b)) {
      return a.replace(/^0+/, '') === b.replace(/^0+/, '');
    }
    var na = numericOf(input, a), nb = numericOf(accept, b);
    return na !== null && nb !== null && na === nb;
  }
  function blankOk(input, accepts) {
    return (accepts || []).some(function (x) { return sameAnswer(input, x); });
  }
  function answerState(id) {
    if (!state.answers[id]) state.answers[id] = { picked: [], inputs: {} };
    if (!state.answers[id].picked) state.answers[id].picked = [];
    if (!state.answers[id].inputs) state.answers[id].inputs = {};
    return state.answers[id];
  }
  function badgeText(g) {
    if (!g) return '未作答';
    return g.ok ? '✓ 判对' : ('✗ 对 ' + g.score + '/' + g.total);
  }

  function quizPanelHtml(q) {
    var a = q.auto;
    var g = state.grade[q.id] || null;
    if (!a) {
      return '<div class="quiz-panel nokey" data-quiz="' + q.id + '">' +
        '<span class="quiz-qtitle">✍️ 作答与判分</span>' +
        '<span class="quiz-note">本题答案是开放形式的（代码补全 / 说明类），请对照参考答案自评</span>' +
        '</div>';
    }
    var h = '<div class="quiz-panel" data-quiz="' + q.id + '">';
    h += '<div class="quiz-qhead"><span class="quiz-qtitle">✍️ ' +
      (a.type === 'choice' ? (a.mode === 'multi' ? '多选 · 自动判分' : '选择 · 自动判分') : '填空 · 自动判分') +
      '</span>';
    if (a.note) h += '<span class="quiz-note">' + esc(a.note) + '</span>';
    h += '<span class="spacer"></span><span class="quiz-badge ' + (g ? (g.ok ? 'ok' : 'bad') : 'done') +
      '" data-badge="' + q.id + '">' + badgeText(g) + '</span></div>';

    var st = state.answers[q.id] || { picked: [], inputs: {} };
    if (!st.picked) st.picked = [];
    if (!st.inputs) st.inputs = {};
    if (a.type === 'choice') {
      var opts = (a.options && a.options.length) ? a.options : a.answer.map(function (k) { return { key: k, text: '' }; });
      h += '<div class="opt-list" data-mode="' + a.mode + '" data-qid="' + q.id + '">';
      opts.forEach(function (o) {
        var picked = st.picked.indexOf(o.key) >= 0;
        var cls = 'opt' + (picked ? ' picked' : '');
        if (g) {
          var isAns = a.answer.indexOf(o.key) >= 0;
          if (isAns) cls += ' right';
          else if (picked) cls += ' wrong';
        }
        h += '<button class="' + cls + '" data-key="' + o.key + '"><b>' + o.key + '</b>' +
          (o.text ? '<span>' + esc(o.text) + '</span>' : '') + '</button>';
      });
      h += '</div>';
    } else {
      h += '<div class="blank-list">';
      a.blanks.forEach(function (b, i) {
        if (!b) {
          h += '<div class="blank"><span class="bk">' + numCircle(i + 1) +
            '</span><span class="skip-txt">此空为开放答案，请对照参考答案自评</span></div>';
          return;
        }
        var label = (a.labels && a.labels[i]) ? String(a.labels[i]) : '';
        var val = st.inputs[i] === undefined ? '' : st.inputs[i];
        var fb = '';
        if (g && g.detail && g.detail[i] !== undefined) {
          fb = g.detail[i]
            ? '<span class="blank-fb ok">✓</span>'
            : '<span class="blank-fb">✗ 应为 ' + esc(b[0]) + '</span>';
        }
        h += '<label class="blank"><span class="bk">' + numCircle(i + 1) + '</span>' +
          (label ? '<span class="bk-label">（' + esc(label) + '）</span>' : '') +
          '<input type="text" class="blank-input" data-qid="' + q.id + '" data-idx="' + i +
          '" autocomplete="off" spellcheck="false" value="' + esc(val) + '" placeholder="第 ' + (i + 1) + ' 空">' +
          fb + '</label>';
      });
      h += '</div>';
    }
    h += '<div class="quiz-actions"><button class="primary js-grade" data-id="' + q.id + '">判分</button>' +
      '<button class="ghost js-grade-clear" data-id="' + q.id + '">清空作答</button>' +
      '<span class="hint">' + (a.type === 'choice'
        ? (a.mode === 'multi' ? '可多选，选好后点判分' : '点选项作答，然后判分')
        : '判断题可写 是/否、对/错；十六进制可带 0x 前缀；多个空按题面顺序填') + '</span></div>';
    h += '<div class="quiz-feedback" data-feedback="' + q.id + '"></div></div>';
    return h;
  }

  function gradeQuestion(id) {
    var q = byId[id], a = q && q.auto;
    if (!a) return null;
    var st = answerState(id);
    if (a.type === 'choice') {
      var picked = st.picked.slice().sort();
      var want = a.answer.slice().sort();
      var ok = picked.length === want.length && picked.every(function (k, i) { return k === want[i]; });
      if (!picked.length) { toast('先选一个选项再判分'); return null; }
      state.grade[id] = { ok: ok, score: ok ? want.length : 0, total: want.length, picked: picked, ts: Date.now() };
    } else {
      var detail = [], score = 0, total = 0, answered = 0;
      a.blanks.forEach(function (b, i) {
        if (!b) { detail[i] = null; return; }
        total++;
        var raw = st.inputs[i] === undefined ? '' : st.inputs[i];
        if (String(raw).trim()) answered++;
        var okb = blankOk(raw, b);
        detail[i] = okb;
        if (okb) score++;
      });
      if (!answered) { toast('先填写答案再判分'); return null; }
      state.grade[id] = { ok: score === total && total > 0, score: score, total: total, detail: detail, ts: Date.now() };
    }
    save();
    renderPanel(id);
    if (!state.grade[id].ok) toggleAnswer(id, true);
    if (state.grade[id].ok && state.single && state.autoNext) {
      setTimeout(function () { gotoIndex(state.singleIdx + 1); }, 700);
    }
    return state.grade[id];
  }

  function renderPanel(id) {
    var card = document.getElementById('qc-' + id);
    if (!card) return;
    var host = card.querySelector('.quiz-panel');
    if (!host) return;
    var g = state.grade[id] || null;
    var q = byId[id], a = q.auto;
    var badge = host.querySelector('[data-badge]');
    if (badge) {
      badge.textContent = badgeText(g);
      badge.className = 'quiz-badge ' + (g ? (g.ok ? 'ok' : 'bad') : 'done');
    }
    if (a.type === 'choice') {
      var st = answerState(id);
      Array.prototype.forEach.call(host.querySelectorAll('.opt'), function (btn) {
        var k = btn.dataset.key;
        var cls = 'opt' + (st.picked.indexOf(k) >= 0 ? ' picked' : '');
        if (g) {
          if (a.answer.indexOf(k) >= 0) cls += ' right';
          else if (st.picked.indexOf(k) >= 0) cls += ' wrong';
        }
        btn.className = cls;
      });
    } else {
      var st2 = answerState(id);
      Array.prototype.forEach.call(host.querySelectorAll('.blank-input'), function (inp) {
        var i = Number(inp.dataset.idx);
        if (document.activeElement !== inp && inp.value !== (st2.inputs[i] || '')) inp.value = st2.inputs[i] || '';
        var fb = inp.parentElement.querySelector('.blank-fb');
        if (g && g.detail && g.detail[i] !== undefined && a.blanks[i]) {
          inp.className = 'blank-input' + (g.detail[i] ? ' right' : ' wrong');
          if (!fb) {
            fb = document.createElement('span');
            inp.parentElement.appendChild(fb);
          }
          fb.className = 'blank-fb' + (g.detail[i] ? ' ok' : '');
          fb.textContent = g.detail[i] ? '✓' : ('✗ 应为 ' + a.blanks[i][0]);
        } else {
          inp.className = 'blank-input';
          if (fb) fb.textContent = '';
        }
      });
    }
    var fb2 = host.querySelector('[data-feedback]');
    if (fb2) {
      fb2.innerHTML = g
        ? '<span style="font-size:12.5px;color:' + (g.ok ? 'var(--ok)' : 'var(--warn)') + '">' +
          (g.ok ? '✓ 判对！'
            : (a.type === 'choice'
              ? ('✗ 判错，正确答案是 ' + a.answer.join('') + '，已为你展开参考答案')
              : ('✗ 本次对 ' + g.score + '/' + g.total + ' 空，已为你展开参考答案'))) + '</span>'
        : '';
    }
    var card2 = document.getElementById('qc-' + id);
    if (card2) {
      var chip = card2.querySelector('.js-graded-chip');
      if (chip) {
        chip.textContent = g ? (g.ok ? '✓ 判对' : '✗ 有错') : '';
        chip.style.display = g ? '' : 'none';
        chip.className = 'chip js-graded-chip ' + (g && g.ok ? 'ok' : (g ? 'warn' : ''));
      }
    }
  }

  /* ---------- 卡片渲染 ---------- */
  /* ---------- 草稿区（Markdown + LaTeX 输入 / 预览） ---------- */
  var FREE_KEY = '__free__';
  var DRAFT_PLACEHOLDER = '在此写下你的思路、推导或记忆点…支持 Markdown（列表 / 表格 / 代码块）与 LaTeX：行内 $x^{2}$，行间 $$\\frac{a}{b}$$';

  function draftBlock(id, opts) {
    opts = opts || {};
    var title = opts.title || '✎ 我的草稿';
    var mode = state.draftMode || 'edit';
    var text = state.drafts[id] || '';
    var html = '<div class="draft draft-mode-' + mode + (text.trim() ? ' has-content' : '') +
      '" data-draft-wrap="' + id + '">';
    html += '<div class="draft-head">';
    html += '<span class="draft-title">' + esc(title) + '</span>';
    html += '<span class="sep"></span>';
    html += '<button class="js-dmode" data-dmode="edit" data-id="' + id + '">编辑</button>';
    html += '<button class="js-dmode" data-dmode="preview" data-id="' + id + '">预览</button>';
    html += '<button class="js-dmode" data-dmode="split" data-id="' + id + '">分栏</button>';
    html += '<span class="sep"></span>';
    html += '<button class="js-ins" data-ins="inline" data-id="' + id + '" title="把选中内容包成行内公式">$x$</button>';
    html += '<button class="js-ins" data-ins="display" data-id="' + id + '" title="插入行间公式">$$…$$</button>';
    html += '<button class="js-ins" data-ins="frac" data-id="' + id + '" title="插入分式">\\frac</button>';
    html += '<button class="js-ins" data-ins="code" data-id="' + id + '" title="行内代码 / 寄存器">`code`</button>';
    html += '<button class="js-ins" data-ins="bold" data-id="' + id + '" title="加粗">**粗**</button>';
    if (opts.meta) html += '<span class="draft-meta">' + esc(opts.meta) + '</span>';
    html += '<span class="draft-count" data-count="' + id + '"></span>';
    if (opts.jump) html += '<button class="ghost js-draft-jump" data-jump="' + id + '">跳到题目</button>';
    html += '<button class="js-draft-clear ghost" data-id="' + id + '">清空</button>';
    html += '</div>';
    html += '<div class="draft-body">';
    html += '<textarea class="draft-input" data-input="' + id + '" rows="4" spellcheck="false" placeholder="' +
      esc(opts.placeholder || DRAFT_PLACEHOLDER) + '"></textarea>';
    html += '<div class="draft-preview prose" data-preview="' + id + '"></div>';
    html += '</div></div>';
    return html;
  }

  function renderDraftPreview(id) {
    var text = state.drafts[id] || '';
    Array.prototype.forEach.call(document.querySelectorAll('[data-preview="' + id + '"]'), function (el) {
      if (text.trim()) {
        el.innerHTML = (window.ICS && ICS.renderMarkdown) ? ICS.renderMarkdown(text) : '<p>' + esc(text) + '</p>';
      } else {
        el.innerHTML = '<p class="draft-empty">这里是预览：支持 Markdown（标题 / 列表 / 表格 / 代码块）与 LaTeX 公式（行内 $x$，行间 $$…$$）。</p>';
      }
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-count="' + id + '"]'), function (el) {
      el.textContent = text.length ? text.length + ' 字符' : '';
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-draft-wrap="' + id + '"]'), function (el) {
      el.classList.toggle('has-content', !!text.trim());
    });
  }

  function syncDraft(id) {
    var v = state.drafts[id] || '';
    Array.prototype.forEach.call(document.querySelectorAll('[data-input="' + id + '"]'), function (ta) {
      if (ta !== document.activeElement && ta.value !== v) ta.value = v;
    });
    renderDraftPreview(id);
  }

  function applyDraftMode() {
    var m = state.draftMode || 'edit';
    Array.prototype.forEach.call(document.querySelectorAll('[data-draft-wrap]'), function (w) {
      w.classList.remove('draft-mode-edit', 'draft-mode-preview', 'draft-mode-split');
      w.classList.add('draft-mode-' + m);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.js-dmode'), function (b) {
      b.classList.toggle('active', b.dataset.dmode === m);
    });
  }

  function draftSumText() {
    var n = 0, ch = (state.drafts[FREE_KEY] || '').length;
    Q.forEach(function (q) {
      var t = state.drafts[q.id] || '';
      if (t.trim()) n++;
      ch += t.length;
    });
    return n ? ('题目草稿 ' + n + ' 条 · 共 ' + ch + ' 字符') : '还没有题目草稿';
  }
  function updateDraftSum() {
    var el = document.getElementById('draftSum');
    if (el) el.textContent = draftSumText();
  }

  function insertDraftSnippet(id, key) {
    var ta = document.querySelector('.draft[data-draft-wrap="' + id + '"] [data-input="' + id + '"]') ||
      document.querySelector('[data-input="' + id + '"]');
    if (!ta) return;
    if (state.draftMode === 'preview') { state.draftMode = 'split'; applyDraftMode(); }
    var before = '', after = '', seed = '';
    if (key === 'inline') { before = '$'; after = '$'; seed = 'x^{2}'; }
    else if (key === 'display') { before = '$$\n'; after = '\n$$'; seed = '\\frac{a}{b}'; }
    else if (key === 'frac') { before = '\\frac{'; after = '}{b}'; seed = 'a'; }
    else if (key === 'code') { before = '`'; after = '`'; seed = 'movl %eax, %edx'; }
    else if (key === 'bold') { before = '**'; after = '**'; seed = '重点'; }
    else return;
    var s = ta.selectionStart || 0, e = ta.selectionEnd || 0;
    var chosen = ta.value.slice(s, e) || seed;
    ta.value = ta.value.slice(0, s) + before + chosen + after + ta.value.slice(e);
    var caret = s + before.length + chosen.length;
    ta.focus();
    try { ta.setSelectionRange(caret, caret); } catch (err) {}
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function renderScratch() {
    var free = document.getElementById('freeDraft');
    if (free && !free.dataset.built) {
      free.innerHTML = draftBlock(FREE_KEY, {
        title: '🗒 自由草稿 · 随手记 / 公式推导 / 易错点',
        placeholder: '不针对某道题的想法写在这里…同样支持 Markdown 与 LaTeX。'
      });
      free.dataset.built = '1';
    }
    var list = Q.filter(function (q) { return (state.drafts[q.id] || '').trim(); });
    var host = document.getElementById('draftList');
    if (host) {
      host.innerHTML = list.length ? list.map(function (q) {
        return '<div class="draft-card">' + draftBlock(q.id, {
          title: '✎ ' + q.id + ' · ' + q.source,
          meta: (lecShort[q.lec] || '') + ' · ' + q.type,
          jump: true
        }) + '</div>';
      }).join('') : '<div class="empty">还没有题目草稿。去「刷题」视图，在任意题目下方写下你的思路，这里会自动汇总。</div>';
    }
    syncDraft(FREE_KEY);
    list.forEach(function (q) { syncDraft(q.id); });
    applyDraftMode();
    updateDraftSum();
  }

  function exportDrafts() {
    var lines = ['# ICS 第一次阶段测验 · 我的草稿', '', '> 导出时间：' + new Date().toLocaleString('zh-CN'), ''];
    if ((state.drafts[FREE_KEY] || '').trim()) {
      lines.push('## 自由草稿', '', state.drafts[FREE_KEY].trim(), '');
    }
    var n = 0;
    Q.forEach(function (q) {
      var t = (state.drafts[q.id] || '').trim();
      if (!t) return;
      n++;
      lines.push('## ' + q.id + ' · ' + q.source + ' · ' + (lecShort[q.lec] || '') + ' · ' + q.type, '', t, '');
    });
    if (!n && !(state.drafts[FREE_KEY] || '').trim()) { toast('还没有草稿可以导出'); return; }
    var blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ICS阶段测验一_我的草稿_' + new Date().toISOString().slice(0, 10) + '.md';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('已导出 ' + n + ' 条题目草稿' + ((state.drafts[FREE_KEY] || '').trim() ? ' + 自由草稿' : ''));
  }

  /* ---------- 卡片渲染 ---------- */
  function lecBadge(l) { return '<span class="chip">' + esc(lecShort[l] || l) + '</span>'; }
  function cardHtml(q) {
    var mark = state.marks[q.id] || '';
    var cls = 'q' + (mark ? ' mark-' + mark : '') + (state.stars[q.id] ? ' mark-star' : '');
    var h = '<article class="' + cls + '" id="qc-' + q.id + '" data-id="' + q.id + '" tabindex="0">';
    h += '<div class="q-head">';
    h += '<span class="q-id lec-' + q.lec + '">' + q.id + '</span>';
    h += '<span class="chip muted">' + esc(q.source) + '</span>';
    if (q.ref) h += '<span class="chip muted">' + esc(q.ref.split('·').slice(1).join('·').trim() || q.ref) + '</span>';
    h += lecBadge(q.lec);
    (q.lecs || []).filter(function (x) { return x !== q.lec && lecShort[x]; }).slice(0, 3).forEach(function (x) {
      h += '<span class="chip muted">' + esc(lecShort[x]) + '</span>';
    });
    h += '<span class="chip">' + esc(q.type) + '</span>';
    if (q.score) h += '<span class="chip muted">' + esc(q.score) + '</span>';
    h += '<span class="chip js-graded-chip" style="display:none"></span>';
    h += '</div>';
    h += '<div class="q-body prose">' + q.bodyHtml + '</div>';
    if (q.tags && q.tags.length) {
      h += '<div class="q-tags">' + q.tags.map(function (t) { return '<span class="chip muted">#' + esc(t) + '</span>'; }).join('') + '</div>';
    }
    h += quizPanelHtml(q);
    h += '<div class="q-actions">';
    h += '<button class="primary js-toggle" data-id="' + q.id + '">显示答案</button>';
    h += '<button class="js-mark" data-id="' + q.id + '" data-mark="ok">✓ 已掌握</button>';
    h += '<button class="js-mark" data-id="' + q.id + '" data-mark="review">✗ 待复习</button>';
    h += '<button class="js-star" data-id="' + q.id + '">☆ 收藏</button>';
    h += '<button class="js-near" data-id="' + q.id + '">同类题</button>';
    h += '<span class="hint">快捷键：卡片聚焦后 S 显示答案 / 1 掌握 / 2 待复习 / F 收藏</span>';
    h += '</div>';
    h += '<div class="q-near" data-near="' + q.id + '" hidden></div>';
    h += '<div class="q-answer prose" data-ans="' + q.id + '" hidden>' +
      '<div class="ans-head"><b>参考答案</b><span class="chip ' +
      (/含修订/.test(q.ansKind) ? 'warn' : (/无答案|无法提供/.test(q.ansKind) ? 'muted' : 'ok')) + '">' +
      esc(q.ansKind) + '</span></div>' + q.answerHtml + '</div>';
    h += draftBlock(q.id, { title: '✎ 我的草稿（思路 / 推导 / 记忆点）' });
    h += '</article>';
    return h;
  }
  $('#quizList').innerHTML = Q.map(cardHtml).join('');

  function syncCard(id) {
    var el = document.getElementById('qc-' + id);
    if (!el) return;
    var q = byId[id];
    var mark = state.marks[id] || '';
    el.className = 'q' + (mark ? ' mark-' + mark : '') + (state.stars[id] ? ' mark-star' : '');
    el.querySelector('.js-star').textContent = state.stars[id] ? '★ 已收藏' : '☆ 收藏';
    var ans = el.querySelector('[data-ans]');
    var btn = el.querySelector('.js-toggle');
    ans.hidden = !state.open[id];
    btn.textContent = state.open[id] ? '收起答案' : '显示答案';
    if (state.open[id] && !q.__seen) { q.__seen = true; }
  }

  /* ---------- 筛选 ---------- */
  function match(q) {
    var f = state.filters;
    if (f.part !== 'all' && q.part !== f.part) return false;
    if (f.lec !== 'all' && q.lec !== f.lec) return false;
    if (f.year !== 'all' && q.year !== f.year) return false;
    if (f.type !== 'all' && q.type !== f.type) return false;
    if (f.st === 'ok' && state.marks[q.id] !== 'ok') return false;
    if (f.st === 'review' && state.marks[q.id] !== 'review') return false;
    if (f.st === 'star' && !state.stars[q.id]) return false;
    if (f.st === 'draft' && !(state.drafts[q.id] || '').trim()) return false;
    if (f.st === 'right' && !(state.grade[q.id] && state.grade[q.id].ok)) return false;
    if (f.st === 'wrong' && !(state.grade[q.id] && !state.grade[q.id].ok)) return false;
    if (f.st === 'todo' && state.marks[q.id]) return false;
    if (f.st === 'unseen' && state.seen[q.id]) return false;
    if (state.random && state.random.indexOf(q.id) < 0) return false;
    if (state.q && q._text.indexOf(state.q.toLowerCase()) < 0) return false;
    return true;
  }

  function visible() { return visibleOrdered(); }

  function apply() {
    var list = visibleOrdered();
    if (state.single && list.length) {
      state.singleIdx = Math.max(0, Math.min(state.singleIdx, list.length - 1));
    }
    var curId = (state.single && list.length) ? list[state.singleIdx].id : null;
    var vis = {};
    list.forEach(function (q) { vis[q.id] = 1; });
    Q.forEach(function (q) {
      var el = document.getElementById('qc-' + q.id);
      el.hidden = !(vis[q.id] && (!state.single || q.id === curId));
    });
    var n = list.length;
    $('#quizCount').textContent = '当前 ' + n + ' / ' + DATA.meta.total + ' 题';
    var bits = [];
    var f = state.filters;
    if (f.part !== 'all') bits.push(f.part === 'A' ? 'Part A（2025 阶段测验）' : 'Part B（历年期中）');
    if (f.lec !== 'all') bits.push(lecName[f.lec] || f.lec);
    if (f.year !== 'all') bits.push(f.year + ' 年');
    if (f.type !== 'all') bits.push(f.type);
    if (f.st !== 'all') bits.push({
      ok: '已掌握', review: '待复习', star: '收藏', todo: '未掌握',
      unseen: '未看答案', draft: '有草稿', right: '判对', wrong: '判错'
    }[f.st]);
    if (state.q) bits.push('搜索「' + state.q + '」');
    if (state.random) bits.push('随机抽题 ' + state.random.length + ' 题');
    $('#quizDesc').textContent = bits.length ? '· ' + bits.join(' · ') : '· 全部题目';
    $('#btnClearFilter').hidden = bits.length === 0;

    var ok = 0, rv = 0, st = 0, sn = 0;
    Q.forEach(function (q) {
      if (state.marks[q.id] === 'ok') ok++;
      else if (state.marks[q.id] === 'review') rv++;
      if (state.stars[q.id]) st++;
      if (state.seen[q.id]) sn++;
    });
    $('#stOk').textContent = ok; $('#stReview').textContent = rv;
    $('#stStar').textContent = st; $('#stSeen').textContent = sn;
    var gOk = 0, gBad = 0;
    Q.forEach(function (q) {
      var g = state.grade[q.id];
      if (!g) return;
      if (g.ok) gOk++; else gBad++;
    });
    $('#stRight').textContent = gOk;
    $('#stWrong').textContent = gBad;
    $('#progBar').style.width = (DATA.meta.total ? (ok * 100 / DATA.meta.total) : 0) + '%';
    syncSingleBar(list, curId);
    renderFilters();
    updateDraftSum();
    if (state.view === 'card') renderCardView();
    else if (state.view === 'draft') renderScratch();
  }

  function syncSingleBar(list, curId) {
    var bar = $('#singleBar');
    if (bar) bar.hidden = !state.single;
    var btn = $('#btnSingle');
    if (btn) {
      btn.textContent = state.single ? '🧭 单题模式：开' : '🧭 单题刷题';
      btn.classList.toggle('active', !!state.single);
    }
    var pos = $('#sbPos');
    if (pos) pos.textContent = (list.length ? (state.singleIdx + 1) : 0) + ' / ' + list.length;
    var pr = $('#sbProgress');
    if (pr) pr.style.width = (list.length ? ((state.singleIdx + 1) * 100 / list.length) : 0) + '%';
    var sh = $('#sbShuffle');
    if (sh) sh.checked = !!state.shuffle;
    var an = $('#sbAutoNext');
    if (an) an.checked = !!state.autoNext;
    var rev = $('#sbReveal');
    if (rev) rev.textContent = (curId && state.open[curId]) ? '收起答案' : '显示答案';
  }

  /* ---------- 侧边筛选器 ---------- */
  function filterBtn(label, key, value, count) {
    var on = state.filters[key] === value ? ' class="active"' : '';
    return '<button' + on + ' data-fkey="' + key + '" data-fval="' + esc(value) + '">' +
      '<span>' + label + '</span><span class="cnt">' + count + '</span></button>';
  }
  function renderFilters() {
    var f = state.filters;
    $('#filtPart').innerHTML =
      filterBtn('全部题目', 'part', 'all', DATA.meta.total) +
      filterBtn('Part A · 2025 阶段测验', 'part', 'A', partCount.A || 0) +
      filterBtn('Part B · 历年期中', 'part', 'B', partCount.B || 0);
    var lc = DATA.lectures.filter(function (l) { return lecCount[l.id]; }).map(function (l) {
      return filterBtn(l.name, 'lec', l.id, lecCount[l.id]);
    }).join('');
    $('#filtLec').innerHTML = filterBtn('全部讲次', 'lec', 'all', DATA.meta.total) + lc;
    var unseen = Q.filter(function (q) { return !state.seen[q.id]; }).length;
    var todo = Q.filter(function (q) { return !state.marks[q.id]; }).length;
    var st = [
      ['all', '全部状态', DATA.meta.total],
      ['todo', '未掌握', todo],
      ['ok', '已掌握', Q.filter(function (q) { return state.marks[q.id] === 'ok'; }).length],
      ['review', '待复习', Q.filter(function (q) { return state.marks[q.id] === 'review'; }).length],
      ['star', '收藏', Q.filter(function (q) { return state.stars[q.id]; }).length],
      ['unseen', '未看答案', unseen],
      ['draft', '✎ 有草稿', Q.filter(function (q) { return (state.drafts[q.id] || '').trim(); }).length],
      ['right', '✓ 判对', Q.filter(function (q) { return state.grade[q.id] && state.grade[q.id].ok; }).length],
      ['wrong', '✗ 判错', Q.filter(function (q) { return state.grade[q.id] && !state.grade[q.id].ok; }).length]
    ].map(function (x) { return filterBtn(x[1], 'st', x[0], x[2]); }).join('');
    $('#filtState').innerHTML = st;
    var yrs = ['all'].concat(DATA.years.slice().sort(function (a, b) { return b - a; }));
    $('#filtYear').innerHTML = yrs.map(function (y) {
      var on = f.year === y ? ' active' : '';
      return '<button class="' + on.trim() + '" data-fkey="year" data-fval="' + y + '">' +
        (y === 'all' ? '全部' : y) + (y === 'all' ? '' : '<span class="cnt" style="margin-left:5px">' + (yearCount[y] || 0) + '</span>') + '</button>';
    }).join('');
    $('#filtType').innerHTML = ['all'].concat(DATA.types).map(function (t) {
      var on = f.type === t ? ' active' : '';
      return '<button class="' + on.trim() + '" data-fkey="type" data-fval="' + esc(t) + '">' +
        (t === 'all' ? '全部' : esc(t)) + (t === 'all' ? '' : '<span class="cnt" style="margin-left:5px">' + (typeCount[t] || 0) + '</span>') + '</button>';
    }).join('');
  }

  /* ---------- 答题卡视图 ---------- */
  function cellHtml(q) {
    var mark = state.marks[q.id] || '';
    var cls = 'card-cell' + (mark ? ' ' + mark : '') + (state.stars[q.id] ? ' star' : '') +
      (state.seen[q.id] ? ' seen' : '');
    return '<button class="' + cls + '" data-jump="' + q.id + '" title="' +
      esc(q.source + ' · ' + q.type + ((state.drafts[q.id] || '').trim() ? ' · 有草稿' : '')) + '">' + q.id +
      '<small>' + esc(lecShort[q.lec] || q.lec) +
      ((state.drafts[q.id] || '').trim() ? '<i class="dot"></i>' : '') + '</small></button>';
  }
  function renderCardView() {
    var groups = [];
    groups.push({
      title: 'Part A · 2025 第一次阶段测验（A1–A24，全卷）',
      items: Q.filter(function (q) { return q.part === 'A'; })
    });
    DATA.years.slice().sort(function (a, b) { return b - a; }).forEach(function (y) {
      var items = Q.filter(function (q) { return q.part === 'B' && q.year === String(y); });
      if (items.length) groups.push({ title: y + ' 期中（' + items.length + ' 题）', items: items });
    });
    $('#cardBody').innerHTML = groups.map(function (g) {
      return '<div class="card-sec-title">' + esc(g.title) + '</div><div class="card-grid">' +
        g.items.map(cellHtml).join('') + '</div>';
    }).join('');
  }

  /* ---------- 视图切换 ---------- */
  function setView(v) {
    state.view = v; save();
    ['quiz', 'draft', 'cheat', 'card'].forEach(function (k) {
      document.getElementById('view-' + k).classList.toggle('active', k === v);
    });
    $$('#viewBtns button').forEach(function (b) { b.classList.toggle('active', b.dataset.view === v); });
    if (v === 'draft') renderScratch();
    if (v === 'card') renderCardView();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------- 交互 ---------- */
  function toggleAnswer(id, force) {
    var el = document.getElementById('qc-' + id);
    if (!el) return;
    var open = (typeof force === 'boolean') ? force : !state.open[id];
    state.open[id] = open;
    if (open) state.seen[id] = true;
    el.querySelector('[data-ans]').hidden = !open;
    el.querySelector('.js-toggle').textContent = open ? '收起答案' : '显示答案';
    el.classList.toggle('done', !!open);
    save(); apply();
  }
  function setMark(id, mark) {
    if (state.marks[id] === mark) delete state.marks[id];
    else state.marks[id] = mark;
    syncCard(id); save(); apply();
    toast(state.marks[id] === 'ok' ? id + '：已掌握 ✓' : (state.marks[id] === 'review' ? id + '：加入待复习' : id + '：已清除标记'));
  }
  function setStar(id) {
    if (state.stars[id]) delete state.stars[id]; else state.stars[id] = 1;
    syncCard(id); save(); apply();
    toast(state.stars[id] ? id + '：已收藏 ★' : id + '：已取消收藏');
  }
  function showNear(id) {
    var el = document.querySelector('[data-near="' + id + '"]');
    if (!el) return;
    if (!el.hidden) { el.hidden = true; return; }
    var list = siblings[id] || [];
    el.className = 'q-near prose';
    el.innerHTML = '<p style="margin:8px 0 0;font-size:13px;color:var(--muted)">同类练习（' +
      esc(lecName[byId[id].lec] || '') + ' · ' + esc(byId[id].type) + '）：' +
      (list.length ? list.map(function (x) {
        return '<button class="ghost" style="padding:2px 8px;font-size:12.5px;margin:0 2px" data-jump="' + x + '">' + x + '</button>';
      }).join('') : '无') + '</p>';
    el.hidden = false;
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('button, .card-cell');
    if (!el) return;
    if (el.dataset.fkey) {
      state.filters[el.dataset.fkey] = el.dataset.fval;
      if (el.dataset.fkey !== 'part' && el.dataset.fval !== 'all') state.random = null;
      save(); apply(); return;
    }
    if (el.dataset.view) { setView(el.dataset.view); return; }
    if (el.classList.contains('js-toggle')) { toggleAnswer(el.dataset.id); return; }
    if (el.classList.contains('js-mark')) { setMark(el.dataset.id, el.dataset.mark); return; }
    if (el.classList.contains('js-star')) { setStar(el.dataset.id); return; }
    if (el.classList.contains('js-near')) { showNear(el.dataset.id); return; }
    if (el.classList.contains('js-dmode')) {
      state.draftMode = el.dataset.dmode;
      save(); applyDraftMode();
      if (state.draftMode !== 'preview') {
        var focusTa = document.querySelector('.draft[data-draft-wrap="' + el.dataset.id + '"] [data-input]');
        if (focusTa) focusTa.focus();
      }
      return;
    }
    if (el.classList.contains('js-ins')) { insertDraftSnippet(el.dataset.id, el.dataset.ins); return; }
    if (el.classList.contains('opt')) {
      var oid = el.parentElement.dataset.qid;
      var multi = el.parentElement.dataset.mode === 'multi';
      var st = answerState(oid);
      var k = el.dataset.key;
      if (multi) {
        var p = st.picked.indexOf(k);
        if (p >= 0) st.picked.splice(p, 1); else st.picked.push(k);
      } else {
        st.picked = (st.picked.length === 1 && st.picked[0] === k) ? [] : [k];
      }
      delete state.grade[oid];
      save(); renderPanel(oid);
      return;
    }
    if (el.classList.contains('js-grade')) { gradeQuestion(el.dataset.id); return; }
    if (el.classList.contains('js-grade-clear')) {
      var gid = el.dataset.id;
      state.answers[gid] = { picked: [], inputs: {} };
      delete state.grade[gid];
      var card = document.getElementById('qc-' + gid);
      if (card) {
        Array.prototype.forEach.call(card.querySelectorAll('.blank-input'), function (inp) { inp.value = ''; });
      }
      save(); renderPanel(gid);
      toast('已清空本题作答');
      return;
    }
    if (el.classList.contains('js-draft-clear')) {
      var cid = el.dataset.id;
      if (!(state.drafts[cid] || '').trim() || confirm('清空这条草稿？')) {
        state.drafts[cid] = '';
        save();
        Array.prototype.forEach.call(document.querySelectorAll('[data-input="' + cid + '"]'), function (t) { t.value = ''; });
        renderDraftPreview(cid);
        updateDraftSum(); renderFilters();
        if (state.view === 'draft') { var f = document.getElementById('freeDraft'); if (f) f.dataset.built = ''; renderScratch(); }
        toast('已清空该草稿');
      }
      return;
    }
    if (el.dataset.jump) {
      var id = el.dataset.jump;
      setView('quiz');
      apply();
      setTimeout(function () {
        var card = document.getElementById('qc-' + id);
        if (!card || card.hidden) {
          state.filters = { part: 'all', lec: 'all', st: 'all', year: 'all', type: 'all' };
          state.q = ''; $('#search').value = ''; state.random = null;
          save(); apply();
          card = document.getElementById('qc-' + id);
        }
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.focus({ preventScroll: true });
        }
      }, 30);
      return;
    }
    switch (el.id) {
      case 'btnTheme':
        state.theme = state.theme === 'light' ? 'dark' : 'light';
        document.documentElement.dataset.theme = state.theme; save();
        break;
      case 'btnRevealAll': {
        var vis = visible();
        var anyClosed = vis.some(function (q) { return !state.open[q.id]; });
        vis.forEach(function (q) {
          state.open[q.id] = anyClosed;
          if (anyClosed) state.seen[q.id] = true;
        });
        $('#btnRevealAll').textContent = anyClosed ? '收起全部答案' : '显示全部答案';
        save(); apply();
        toast(anyClosed ? '已展开 ' + vis.length + ' 题答案' : '已收起全部答案');
        break;
      }
      case 'btnCollapseAll':
        Q.forEach(function (q) { state.open[q.id] = false; });
        $('#btnRevealAll').textContent = '显示全部答案';
        save(); apply(); toast('已收起全部答案');
        break;
      case 'btnExportDrafts':
        exportDrafts();
        break;
      case 'btnClearDrafts':
        if (confirm('确定清空全部草稿（含自由草稿）吗？此操作不可撤销。')) {
          state.drafts = {};
          save();
          Array.prototype.forEach.call(document.querySelectorAll('[data-input]'), function (t) { t.value = ''; });
          Array.prototype.forEach.call(document.querySelectorAll('[data-draft-wrap]'), function (w) { w.classList.remove('has-content'); });
          var f = document.getElementById('freeDraft');
          if (f) f.dataset.built = '';
          Q.forEach(function (q) { renderDraftPreview(q.id); });
          renderScratch(); renderFilters(); renderCardView();
          toast('已清空全部草稿');
        }
        break;
      case 'btnClearFilter':
        state.filters = { part: 'all', lec: 'all', st: 'all', year: 'all', type: 'all' };
        state.q = ''; $('#search').value = ''; state.random = null;
        save(); apply(); toast('已清空筛选');
        break;
      case 'btnPrintToggle': {
        var hideAnswers = document.body.classList.toggle('print-no-answers');
        el.textContent = hideAnswers ? '打印：不含答案' : '打印：含答案';
        state.printNoAnswers = hideAnswers;
        save();
        toast(hideAnswers ? '打印时将隐藏答案（可当空白练习卷）' : '打印时将印出参考答案');
        break;
      }
      case 'btnOnlyTodo':
        state.filters.st = state.filters.st === 'todo' ? 'all' : 'todo';
        state.random = null; save(); apply();
        toast(state.filters.st === 'todo' ? '只看未掌握' : '已恢复全部');
        break;
      case 'btnRandom': {
        var pool = visible().map(function (q) { return q.id; });
        if (!pool.length) { toast('当前筛选下没有题目'); break; }
        var n = Math.min(15, pool.length);
        var picked = [];
        var copy = pool.slice();
        while (picked.length < n) picked.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
        state.random = picked;
        save(); apply(); toast('已随机抽 ' + n + ' 题');
        break;
      }
      case 'btnReset':
        if (confirm('确定清空全部进度、收藏与答题状态吗？')) {
          state.marks = {}; state.stars = {}; state.seen = {}; state.open = {};
          state.answers = {}; state.grade = {}; state.random = null;
          save();
          Q.forEach(function (q) { syncCard(q.id); renderPanel(q.id); });
          Q.forEach(function (q) {
            var card = document.getElementById('qc-' + q.id);
            if (card) Array.prototype.forEach.call(card.querySelectorAll('.blank-input'), function (inp) { inp.value = ''; });
          });
          apply(); toast('进度已重置');
        }
        break;
      case 'tabCheat':
        $('#tabCheat').classList.add('active'); $('#tabKnow').classList.remove('active');
        $('#cheatBody').hidden = false; $('#knowBody').hidden = true;
        break;
      case 'tabKnow':
        $('#tabKnow').classList.add('active'); $('#tabCheat').classList.remove('active');
        $('#cheatBody').hidden = true; $('#knowBody').hidden = false;
        break;
      case 'backtop':
        window.scrollTo({ top: 0, behavior: 'smooth' });
        break;
      case 'btnSingle':
        toggleSingle();
        break;
      case 'sbPrev':
        gotoIndex(state.singleIdx - 1);
        break;
      case 'sbNext':
        gotoIndex(state.singleIdx + 1);
        break;
      case 'sbReveal': {
        var curR = currentList()[state.singleIdx];
        if (curR) toggleAnswer(curR.id);
        break;
      }
      case 'sbGrade': {
        var curG = currentList()[state.singleIdx];
        if (curG) gradeQuestion(curG.id);
        break;
      }
      case 'sbOk': {
        var curO = currentList()[state.singleIdx];
        if (curO) setMark(curO.id, 'ok');
        break;
      }
      case 'sbReview': {
        var curV = currentList()[state.singleIdx];
        if (curV) setMark(curV.id, 'review');
        break;
      }
      case 'sbExit':
        toggleSingle(false);
        break;
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || !t.id) return;
    if (t.id === 'sbShuffle') {
      state.shuffle = t.checked;
      if (state.shuffle) {
        var ids = Q.map(function (q) { return q.id; });
        for (var i = ids.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
        }
        state.order = ids;
      }
      save(); apply();
      toast(state.shuffle ? '已切换为随机顺序' : '已恢复原顺序');
    } else if (t.id === 'sbAutoNext') {
      state.autoNext = t.checked;
      save();
    }
  });

  document.addEventListener('keydown', function (e) {
    var card = e.target.closest ? e.target.closest('.q') : null;
    if (!card) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var id = card.dataset.id;
    if (e.key === 's' || e.key === 'S') { toggleAnswer(id); e.preventDefault(); }
    else if (e.key === '1') { setMark(id, 'ok'); e.preventDefault(); }
    else if (e.key === '2') { setMark(id, 'review'); e.preventDefault(); }
    else if (e.key === 'f' || e.key === 'F') { setStar(id); e.preventDefault(); }
  });

  /* ---------- 草稿输入：实时预览 + 自动保存 ---------- */
  var draftSaveTimer = {};
  document.addEventListener('input', function (e) {
    var ta = e.target;
    if (!ta || !ta.dataset) return;
    if (ta.dataset.qid !== undefined && ta.dataset.idx !== undefined) {
      var qid = ta.dataset.qid;
      answerState(qid).inputs[ta.dataset.idx] = ta.value;
      if (state.grade[qid]) { delete state.grade[qid]; renderPanel(qid); }
      clearTimeout(draftSaveTimer['g' + qid]);
      draftSaveTimer['g' + qid] = setTimeout(save, 500);
      return;
    }
    if (!ta.dataset.input) return;
    var id = ta.dataset.input;
    state.drafts[id] = ta.value;
    renderDraftPreview(id);
    Array.prototype.forEach.call(document.querySelectorAll('[data-input="' + id + '"]'), function (other) {
      if (other !== ta && other.value !== ta.value) other.value = ta.value;
    });
    clearTimeout(draftSaveTimer[id]);
    draftSaveTimer[id] = setTimeout(function () {
      save();
      updateDraftSum();
      renderFilters();
    }, 600);
  });
  document.addEventListener('keydown', function (e) {
    var ta = e.target;
    if (!ta || !ta.dataset || !ta.dataset.input) return;
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = ta.selectionStart, t = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(t);
      try { ta.setSelectionRange(s + 4, s + 4); } catch (err) {}
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      state.draftMode = state.draftMode === 'preview' ? 'edit' : 'preview';
      save(); applyDraftMode();
    }
  });

  /* 单题模式快捷键：← → 翻题、空格看答案、G 判分、Enter 下一题 */
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) {
      if (t.classList && t.classList.contains('blank-input') && e.key === 'Enter') {
        gradeQuestion(t.dataset.qid);
        e.preventDefault();
      }
      return;
    }
    if (!state.single || state.view !== 'quiz') return;
    var list = currentList();
    var cur = list[state.singleIdx];
    if (e.key === 'ArrowRight' || e.key === 'Enter') { gotoIndex(state.singleIdx + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { gotoIndex(state.singleIdx - 1); e.preventDefault(); }
    else if (e.key === 'g' || e.key === 'G') { if (cur) gradeQuestion(cur.id); e.preventDefault(); }
    else if (e.key === ' ') { if (cur) toggleAnswer(cur.id); e.preventDefault(); }
  });

  var searchTimer = null;
  $('#search').addEventListener('input', function () {
    var v = this.value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.q = v; if (v) state.random = null;
      save(); apply();
      if (state.view !== 'quiz') setView('quiz');
    }, 180);
  });

  window.addEventListener('scroll', function () {
    $('#backtop').classList.toggle('show', window.scrollY > 500);
  });

  /* ---------- 考试倒计时 ---------- */
  function tick() {
    var target = new Date(DATA.meta.examDate + 'T' + DATA.meta.examTime + '+08:00');
    var now = new Date();
    var ms = target - now;
    var el = $('#countdownChip');
    if (ms <= 0) {
      var over = Math.floor(-ms / 86400000);
      el.textContent = over === 0 ? '⏰ 今天就是考试日，加油！' : '⏳ 距考试已过 ' + over + ' 天';
      return;
    }
    var d = Math.floor(ms / 86400000);
    var h = Math.floor(ms % 86400000 / 3600000);
    var m = Math.floor(ms % 3600000 / 60000);
    el.innerHTML = '⏳ 距 <b class="countdown">' + DATA.meta.examDate + '（周一）</b> 第一次阶段测验还有 <b class="countdown">' +
      d + '</b> 天 <b class="countdown">' + h + '</b> 时 <b class="countdown">' + m + '</b> 分';
  }

  /* ---------- 初始化 ---------- */
  document.documentElement.dataset.theme = state.theme;
  $('#totalChip').textContent = '共 ' + DATA.meta.total + ' 题 · A1–A24 + B1–B143';
  $('#cheatBody').innerHTML = DATA.cheatsheetHtml;
  $('#knowBody').innerHTML = DATA.knowledgeHtml;
  $('#search').value = state.q || '';
  if (state.printNoAnswers) {
    document.body.classList.add('print-no-answers');
    var pbtn = $('#btnPrintToggle');
    if (pbtn) pbtn.textContent = '打印：不含答案';
  }
  Q.forEach(function (q) { syncCard(q.id); });
  Q.forEach(function (q) { syncDraft(q.id); });
  Q.forEach(function (q) { if (state.grade[q.id]) renderPanel(q.id); });
  applyDraftMode();
  updateDraftSum();
  var allOpen = visible().length > 0 && Q.every(function (q) { return state.open[q.id]; });
  $('#btnRevealAll').textContent = allOpen ? '收起全部答案' : '显示全部答案';
  apply();
  setView(state.view || 'quiz');
  tick();
  setInterval(tick, 20000);
})();
</script>
</body>
</html>
