<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICS 第一次阶段测验 · 刷题台（第 1–8 讲）</title>
<style>
:root{
  --bg:#f5f6fa; --panel:#ffffff; --panel-2:#fbfcfe;
  --ink:#1b2333; --ink-2:#3d4757; --muted:#727c8f;
  --line:#e4e8f0; --line-2:#eef1f6;
  --accent:#2f6fed; --accent-2:#1b54c8; --accent-soft:#eaf1ff;
  --ok:#12855f; --ok-soft:#e6f6ef;
  --warn:#c9701b; --warn-soft:#fdf0e2;
  --star:#d9a400; --star-soft:#fff7dd;
  --code-bg:#f6f8fb; --code-ink:#243044;
  --radius:14px; --radius-s:9px;
  --shadow:0 1px 2px rgba(21,32,56,.05), 0 8px 24px -18px rgba(21,32,56,.35);
}
html[data-theme="dark"]{
  --bg:#10131a; --panel:#171c25; --panel-2:#141922;
  --ink:#e7ebf3; --ink-2:#c3cad8; --muted:#8e99ad;
  --line:#28303d; --line-2:#212836;
  --accent:#7ba4ff; --accent-2:#9cbcff; --accent-soft:#1b2540;
  --ok:#4cc79a; --ok-soft:#12291f;
  --warn:#e8a25c; --warn-soft:#2c2115;
  --star:#e8c14d; --star-soft:#2b2410;
  --code-bg:#0d1117; --code-ink:#d6dbe6;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:var(--panel);
  background:color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1560px; margin:0 auto; padding:10px 18px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{display:flex; flex-direction:column; gap:1px; min-width:230px}
.brand b{font-size:16px; letter-spacing:.2px}
.brand span{font-size:12px; color:var(--muted)}
.spacer{flex:1 1 auto}
.chip{
  display:inline-flex; align-items:center; gap:5px;
  padding:2px 9px; border-radius:999px; font-size:12px; line-height:1.7;
  background:var(--accent-soft); color:var(--accent-2); border:1px solid transparent;
  white-space:nowrap;
}
.chip.muted{background:var(--line-2); color:var(--muted)}
.chip.ok{background:var(--ok-soft); color:var(--ok)}
.chip.warn{background:var(--warn-soft); color:var(--warn)}
.chip.star{background:var(--star-soft); color:var(--star)}
.countdown{font-variant-numeric:tabular-nums; font-weight:600; color:var(--accent-2)}
input[type="search"],select,input[type="text"]{
  font:inherit; font-size:13.5px; color:var(--ink);
  background:var(--panel-2); border:1px solid var(--line);
  border-radius:var(--radius-s); padding:6px 10px; outline:none;
}
input[type="search"]:focus,select:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.search{min-width:200px; flex:0 1 260px}
button{
  font:inherit; font-size:13.5px; cursor:pointer;
  background:var(--panel-2); color:var(--ink-2);
  border:1px solid var(--line); border-radius:var(--radius-s);
  padding:6px 11px; transition:.15s ease;
}
button:hover{border-color:var(--accent); color:var(--accent-2)}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
button.primary:hover{background:var(--accent-2); border-color:var(--accent-2); color:#fff}
button.ghost{background:transparent}
button.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-2)}

/* ---------- 布局 ---------- */
.layout{max-width:1560px; margin:0 auto; padding:18px; display:grid; grid-template-columns:272px minmax(0,1fr); gap:18px}
@media (max-width:1040px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:static !important; max-height:none !important}
  /* 窄屏下允许长代码/公式换行，避免整页横向滚动 */
  .prose code{white-space:pre-wrap; overflow-wrap:anywhere}
  .q-body, .q-answer, .draft-preview{overflow-wrap:anywhere}
}
.sidebar{
  position:sticky; top:66px; align-self:start;
  max-height:calc(100vh - 86px); overflow:auto;
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);
}
.side-sec{margin-bottom:16px}
.side-sec:last-child{margin-bottom:0}
.side-title{font-size:12px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; margin:0 0 8px}
.side-btns{display:flex; flex-wrap:wrap; gap:6px}
.side-btns button{font-size:12.5px; padding:4px 9px}
.filter-list{display:flex; flex-direction:column; gap:4px}
.filter-list button{
  display:flex; justify-content:space-between; align-items:center; width:100%;
  text-align:left; background:transparent; border-color:transparent; padding:5px 8px; font-size:13px;
}
.filter-list button:hover{background:var(--panel-2); border-color:var(--line)}
.filter-list button.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-2)}
.filter-list .cnt{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.progress{height:8px; background:var(--line-2); border-radius:99px; overflow:hidden; margin:6px 0 8px}
.progress i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),#59c39a); width:0}
.stat-row{display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12.5px}
.stat{background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius-s); padding:6px 8px}
.stat b{display:block; font-size:16px; font-variant-numeric:tabular-nums}
.stat span{color:var(--muted); font-size:11.5px}

/* ---------- 题目卡片 ---------- */
.view{display:none}
.view.active{display:block}
.view-head{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:0 0 12px; padding:10px 14px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); position:sticky; top:58px; z-index:20;
}
.view-head .count{font-size:13px; color:var(--muted)}
.q{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:15px 17px 13px; margin-bottom:14px; box-shadow:var(--shadow);
  scroll-margin-top:118px; position:relative;
}
.q::before{content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:3px; background:transparent}
.q.mark-ok::before{background:var(--ok)}
.q.mark-review::before{background:var(--warn)}
.q.mark-star::before{background:var(--star)}
.q:focus{outline:2px solid var(--accent); outline-offset:2px}
.q.done{opacity:.94}
.q-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.q-id{
  font-weight:700; font-size:14px; letter-spacing:.02em; color:#fff; background:var(--accent);
  border-radius:7px; padding:1px 9px; font-variant-numeric:tabular-nums;
}
.q-id.lec-L2{background:#2f6fed} .q-id.lec-L3{background:#8659d6} .q-id.lec-L4{background:#0f8f8f}
.q-id.lec-L5{background:#c2603f} .q-id.lec-L6{background:#3f7d20} .q-id.lec-L7{background:#a4552c}
.q-id.lec-L8{background:#b0295a} .q-id.lec-LAB{background:#5a6473}
.q-body{font-size:14.6px; color:var(--ink)}
.q-body > :first-child{margin-top:0}
.q-body > :last-child{margin-bottom:0}
.q-actions{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:11px; padding-top:11px; border-top:1px dashed var(--line)}
.q-actions .hint{font-size:11.5px; color:var(--muted); margin-left:auto}
.q-answer{
  margin-top:12px; padding:12px 14px; border-radius:var(--radius-s);
  background:var(--ok-soft); border:1px solid var(--ok);
  border:1px solid color-mix(in srgb, var(--ok) 25%, transparent);
}
.q-answer[hidden]{display:none}
.q-answer > :first-child{margin-top:0}
.q-answer > :last-child{margin-bottom:0}
.ans-head{display:flex; align-items:center; gap:8px; margin-bottom:6px}
.ans-head b{font-size:12.5px; letter-spacing:.06em; color:var(--ok)}
.q-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}

/* ---------- 正文排版 ---------- */
.prose h1,.prose h2,.prose h3,.prose h4,.prose h5{margin:20px 0 8px; line-height:1.4}
.prose h1{font-size:21px} .prose h2{font-size:18px} .prose h3{font-size:16px}
.prose h4{font-size:14.5px; color:var(--ink-2)} .prose h5{font-size:14px; color:var(--muted)}
.prose p{margin:8px 0}
.prose ul,.prose ol{margin:8px 0; padding-left:22px}
.prose li{margin:3px 0}
.prose li > p{margin:4px 0}
.prose hr{border:0; border-top:1px solid var(--line); margin:16px 0}
.prose blockquote{
  margin:10px 0; padding:8px 12px; border-left:3px solid var(--accent);
  background:var(--panel-2); border-radius:0 var(--radius-s) var(--radius-s) 0; color:var(--ink-2);
}
.prose code{
  font:12.8px/1.6 "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  background:var(--code-bg); border:1px solid var(--line);
  padding:.5px 5px; border-radius:5px; color:var(--code-ink); white-space:nowrap;
}
.prose strong{color:var(--ink); font-weight:700}
.prose .reflink{color:var(--muted); border-bottom:1px dotted var(--muted)}
.code-block{margin:10px 0}
.code-lang{
  display:inline-block; font-size:11px; letter-spacing:.06em; color:var(--muted);
  background:var(--line-2); border:1px solid var(--line); border-bottom:0;
  border-radius:6px 6px 0 0; padding:1px 8px; margin-left:2px;
}
.code-block pre{
  margin:0; background:var(--code-bg); border:1px solid var(--line);
  border-radius:0 var(--radius-s) var(--radius-s) var(--radius-s);
  padding:10px 12px; overflow-x:auto;
}
.code-block pre code{
  white-space:pre; background:none; border:0; padding:0; font-size:12.6px; line-height:1.62;
}
.code-block:not(:has(.code-lang)) pre{border-radius:var(--radius-s)}
.table-wrap{overflow-x:auto; margin:10px 0}
.prose table{border-collapse:collapse; width:100%; font-size:13.6px}
.prose th,.prose td{border:1px solid var(--line); padding:6px 9px; text-align:left; vertical-align:top}
.prose thead th{background:var(--accent-soft); color:var(--ink); font-weight:600; white-space:nowrap}
.prose tbody tr:nth-child(even) td{background:var(--panel-2)}

/* ---------- LaTeX ---------- */
.math{
  font-family:"Latin Modern Math","Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;
  font-size:1.03em; white-space:nowrap;
}
.math-display{display:block; text-align:center; margin:12px 0; font-size:1.14em; white-space:normal}
.m-var{font-style:italic}
.m-txt,.m-num{font-style:normal}
.m-op{margin:0 .18em}
.m-unary{margin:0}
.m-rel{margin:0 .3em}
.m-punct{margin:0 .02em}
.m-sym{font-style:normal}
.m-frac{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 .16em; font-size:.96em; transform:translateY(-.04em)}
.m-frac .m-fnum{border-bottom:1px solid currentColor; padding:0 .3em .5px}
.m-frac .m-fden{padding:.5px .3em 0}
.m-sqrt{display:inline-flex; align-items:flex-start}
.m-sqrt .m-radical{margin-right:-.06em}
.m-sqrt .m-rad{border-top:1px solid currentColor; padding-top:.18em; margin-left:.08em}
.m-ss{display:inline-flex; align-items:center}
.m-ss > .m-atom{display:inline-block}
.m-scripts{display:inline-flex; flex-direction:column; font-size:.72em; line-height:1.06; margin-left:.04em}
.m-sup{transform:translateY(-.12em)}
.m-sub{transform:translateY(.14em)}
.m-over{border-top:1px solid currentColor; padding-top:.1em}
.m-under{border-bottom:1px solid currentColor}

/* ---------- 答题卡 ---------- */
.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:8px}
.card-cell{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  padding:8px 4px; border-radius:var(--radius-s); border:1px solid var(--line);
  background:var(--panel-2); cursor:pointer; font-size:13px; font-weight:600;
  font-variant-numeric:tabular-nums; transition:.12s ease;
}
.card-cell:hover{transform:translateY(-1px); border-color:var(--accent)}
.card-cell small{font-size:10px; font-weight:400; color:var(--muted)}
.card-cell.ok{background:var(--ok-soft); border-color:var(--ok); border-color:color-mix(in srgb, var(--ok) 40%, transparent); color:var(--ok)}
.card-cell.review{background:var(--warn-soft); border-color:var(--warn); border-color:color-mix(in srgb, var(--warn) 40%, transparent); color:var(--warn)}
.card-cell.star{box-shadow:inset 0 -3px 0 var(--star)}
.card-cell.seen{border-color:var(--accent)}
.card-legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-bottom:12px}
.card-legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:4px; vertical-align:-1px}
.card-sec-title{font-size:13px; color:var(--muted); margin:16px 0 8px; letter-spacing:.04em}

/* ---------- 速查 ---------- */
.cheat{max-width:none}
.cheat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:14px; align-items:start}

/* ---------- 草稿区 ---------- */
.draft{margin-top:12px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--panel-2); overflow:hidden}
.draft-head{display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:6px 10px; border-bottom:1px solid var(--line)}
.draft-head .draft-title{font-size:12.5px; color:var(--muted); letter-spacing:.04em; white-space:nowrap}
.draft-head button{font-size:12px; padding:2px 8px}
.draft-head .sep{width:1px; height:16px; background:var(--line); margin:0 3px}
.draft-head .draft-count{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.draft-body{display:grid; grid-template-columns:1fr}
.draft-mode-split .draft-body{grid-template-columns:1fr 1fr}
.draft-mode-edit .draft-preview{display:none}
.draft-mode-preview .draft-input{display:none}
.draft-input{
  width:100%; min-height:104px; border:0; border-radius:0; outline:none; display:block;
  background:var(--panel); color:var(--ink); resize:vertical; padding:9px 12px;
  font:12.9px/1.75 "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
.draft-input::placeholder{color:var(--muted); font-family:inherit}
.draft-preview{padding:9px 12px; min-height:104px; font-size:13.8px; border-left:1px solid var(--line)}
.draft-mode-preview .draft-preview, .draft-mode-edit .draft-preview{border-left:0}
.draft-preview .draft-empty{color:var(--muted); font-size:12.5px}
.draft.has-content .draft-head .draft-title{color:var(--accent-2)}
.draft-sum{font-size:12.5px; color:var(--muted); margin:2px 0 10px}
.draft-card{margin-bottom:14px}
.draft-card .draft-head{background:var(--panel)}
.draft-card .draft-meta{font-size:12.5px; color:var(--muted); margin-left:auto; white-space:nowrap}
.dot{display:inline-block; width:5px; height:5px; border-radius:99px; background:var(--accent); margin-left:4px; vertical-align:1px}

/* ---------- 自动判题面板 ---------- */
.quiz-panel{margin-top:12px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--panel-2); padding:10px 12px}
.quiz-panel.nokey{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.quiz-qhead{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.quiz-qtitle{font-size:12.5px; color:var(--muted); letter-spacing:.04em}
.quiz-note{font-size:12px; color:var(--muted)}
.quiz-badge{font-size:12px; padding:1px 9px; border-radius:999px; font-weight:600}
.quiz-badge.ok{background:var(--ok-soft); color:var(--ok)}
.quiz-badge.bad{background:var(--warn-soft); color:var(--warn)}
.quiz-badge.done{background:var(--accent-soft); color:var(--accent-2)}
.opt-list{display:flex; flex-direction:column; gap:6px; margin:2px 0 8px}
.opt{display:flex; gap:9px; align-items:flex-start; text-align:left; width:100%; padding:6px 10px; background:var(--panel); font-size:13.6px; line-height:1.6}
.opt b{font-weight:700; color:var(--accent-2); min-width:16px}
.opt.picked{border-color:var(--accent); background:var(--accent-soft)}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.wrong{border-color:var(--warn); background:var(--warn-soft)}
.blank-list{display:flex; flex-direction:column; gap:6px; margin:2px 0 8px}
.blank{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.4px}
.blank .bk{color:var(--accent-2); font-weight:600; min-width:18px}
.blank .bk-label{color:var(--muted); font-size:12.5px}
.blank .skip-txt{color:var(--muted); font-size:12.5px}
.blank-input{
  font:13.4px/1.5 "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  background:var(--panel); color:var(--ink); border:1px solid var(--line);
  border-radius:7px; padding:4px 9px; min-width:190px; flex:0 1 320px; outline:none;
}
.blank-input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.blank-input.right{border-color:var(--ok); background:var(--ok-soft)}
.blank-input.wrong{border-color:var(--warn); background:var(--warn-soft)}
.blank-fb{font-size:12.3px; color:var(--warn)}
.blank-fb.ok{color:var(--ok)}
.quiz-actions{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.quiz-actions .hint{font-size:11.5px; color:var(--muted); margin-left:auto}

/* ---------- 单题刷题模式 ---------- */
.single-bar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin:0 0 12px; padding:9px 12px; border:1px solid var(--line);
  border-radius:var(--radius); background:var(--panel); box-shadow:var(--shadow);
  position:sticky; top:112px; z-index:18;
}
.single-bar .pos{font-variant-numeric:tabular-nums; font-weight:600; font-size:13.5px; min-width:88px; text-align:center}
.single-bar .bar{flex:1 1 120px; height:6px; background:var(--line-2); border-radius:99px; overflow:hidden; min-width:80px}
.single-bar .bar i{display:block; height:100%; background:var(--accent); width:0}
.single-bar label.sb{display:inline-flex; align-items:center; gap:4px; font-size:12.5px; color:var(--muted)}
.single-bar .sep{width:1px; height:18px; background:var(--line)}
#quizList.single-mode .q{max-width:1000px}
.cheat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:14px; align-items:start}
.cheat-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow)}
.cheat-card h3{margin-top:0}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.empty{padding:28px; text-align:center; color:var(--muted); background:var(--panel); border:1px dashed var(--line); border-radius:var(--radius)}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px);
  background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:999px;
  font-size:13px; opacity:0; pointer-events:none; transition:.22s ease; z-index:99;
}
.toast.show{opacity:.94; transform:translateX(-50%) translateY(0)}
.backtop{
  position:fixed; right:22px; bottom:22px; z-index:50; border-radius:999px;
  width:40px; height:40px; display:none; align-items:center; justify-content:center;
  background:var(--panel); box-shadow:var(--shadow);
}
.backtop.show{display:flex}
@media (max-width:640px){
  .q-id{font-size:13px}
  .brand{min-width:0}
  .search{flex:1 1 100%}
}
@media print{
  .sidebar,.topbar,.q-actions,.view-head,.backtop,.draft,.quiz-panel,.single-bar{display:none !important}
  .layout{display:block; padding:0}
  .q{break-inside:avoid; box-shadow:none}
  .q-answer{display:block !important}
  .print-no-answers .q-answer{display:none !important}

  /* 打印时让长代码块换行，避免溢出纸面 */
  .code-block pre{overflow:visible; white-space:pre-wrap; word-break:break-word}
  .code-block pre code{white-space:pre-wrap; font-size:10.5px}
  .table-wrap{overflow:visible; width:100%}
  .prose table{font-size:9.5px; table-layout:fixed}

<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <b>ICS 第一次阶段测验 · 刷题台</b>
      <span><a href="../" title="返回 ICS 题库首页">← ICS 题库</a> · 第 1–8 讲 · 2025 阶段测验全卷 + 2012–2024 历年期中</span>
    </div>
    <span class="chip" id="countdownChip">考试倒计时 …</span>
    <span class="chip muted" id="totalChip">共 0 题</span>

<div class="layout">
  <aside class="sidebar">
    <div class="side-sec">
      <div class="side-title">进度</div>

        <div class="stat"><b id="stReview">0</b><span>待复习</span></div>

        <div class="stat"><b id="stSeen">0</b><span>看过答案</span></div>
        <div class="stat"><b id="stRight">0</b><span>判对</span></div>
        <div class="stat"><b id="stWrong">0</b><span>判错</span></div>
      </div>
      <div class="side-btns" style="margin-top:9px">
        <button id="btnOnlyTodo" class="ghost">只看未掌握</button>
        <button id="btnReset" class="ghost">重置进度</button>
      </div>
    </div>

    <div class="side-sec">
      <div class="side-title">视图</div>
      <div class="side-btns" id="viewBtns">
        <button data-view="quiz" class="active">刷题</button>
        <button data-view="draft">草稿区</button>
        <button data-view="cheat">速查 / 精讲</button>
        <button data-view="card">答题卡</button>
      </div>
    </div>

    <div class="side-sec">
      <div class="side-title">分区</div>
      <div class="filter-list" id="filtPart"></div>
    </div>

    <div class="side-sec">
      <div class="side-title">讲次</div>
      <div class="filter-list" id="filtLec"></div>
    </div>

    <div class="side-sec">
      <div class="side-title">状态</div>
      <div class="filter-list" id="filtState"></div>
    </div>

    <div class="side-sec">
      <div class="side-title">年份</div>
      <div class="side-btns" id="filtYear"></div>
    </div>

    <div class="side-sec">
      <div class="side-title">题型</div>
      <div class="side-btns" id="filtType"></div>
    </div>
  </aside>

  <main>
    <section id="view-quiz" class="view active">
      <div class="view-head">
        <b id="quizCount">…</b>
        <span class="count" id="quizDesc"></span>
        <span class="spacer"></span>
        <button id="btnCollapseAll">收起全部答案</button>
        <button id="btnClearFilter" class="ghost">清空筛选</button>
        <button id="btnSingle" class="primary">🧭 单题刷题</button>
        <button id="btnPrintToggle" class="ghost" title="切换打印时是否印出参考答案">打印：含答案</button>
      </div>
      <div class="single-bar" id="singleBar" hidden>
        <button id="sbPrev">← 上一题</button>
        <span class="pos" id="sbPos">1 / 1</span>
        <button id="sbNext">下一题 →</button>
        <span class="bar"><i id="sbProgress"></i></span>
        <span class="sep"></span>
        <button id="sbReveal">显示答案</button>
        <button id="sbGrade">判分</button>
        <button id="sbOk">✓ 已掌握</button>
        <button id="sbReview">✗ 待复习</button>
        <span class="sep"></span>
        <label class="sb"><input type="checkbox" id="sbShuffle"> 随机顺序</label>
        <label class="sb"><input type="checkbox" id="sbAutoNext"> 判对后自动下一题</label>
        <span class="spacer"></span>
        <button id="sbExit" class="ghost">回到列表</button>
      </div>
      <div id="quizList"></div>
    </section>

    <section id="view-draft" class="view">
      <div class="view-head">
        <b>草稿区</b>
        <span class="count" id="draftSum">还没有草稿</span>
        <span class="spacer"></span>
        <button id="btnExportDrafts">⬇ 导出全部草稿 .md</button>
        <button id="btnClearDrafts" class="ghost">清空全部草稿</button>
      </div>
      <div id="freeDraft"></div>
      <div id="draftList"></div>
    </section>

    <section id="view-cheat" class="view">
      <div class="view-head">
        <b>速查表 &amp; 考点精讲</b>
        <span class="count">公式 · 表格 · 陷阱 · 答题模板</span>
      </div>
      <div class="tabs">
        <button id="tabCheat" class="active">考前速查表</button>
        <button id="tabKnow">考点精讲（含 LaTeX 公式）</button>
      </div>
      <div id="cheatBody" class="prose cheat"></div>
      <div id="knowBody" class="prose cheat" hidden></div>
    </section>

    <section id="view-card" class="view">
      <div class="view-head">
        <b>答题卡</b>
        <span class="count">点题号跳到该题；颜色代表你的自评状态</span>
      </div>
      <div class="card-legend">
        <span><i style="background:var(--ok)"></i>已掌握</span>
        <span><i style="background:var(--warn)"></i>待复习</span>
        <span><i style="background:var(--accent)"></i>看过答案</span>
        <span><i style="background:var(--star)"></i>收藏</span>
        <span><i style="background:var(--line)"></i>未做</span>
      </div>
      <div id="cardBody"></div>
    </section>
  </main>
</div>

= 66\u003c/code>，\u003ccode>E = 66 − 127 = -61\u003c/code>，\u003ccode>frac = 001000…₂ = 1/8\u003c/code>，\u003ccode>M = 1.125\u003c/code>。\u003c/p>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["0x7F800000","0x7f800000"],["1"],["1.125"],["-61"]]}},{"id":"A5","part":"A","num":5,"year":"2025","source":"2025 第一次阶段测验","ref":"","section":"B · 第 3 讲（每空 1 分，共 10 分）","subsection":"","score":"每空 1 分，共 10 分","lec":"L3","lecs":["L3"],"type":"填空 / 补全","tags":["舍入"],"bodyHtml":"\u003cp>按照「向偶数舍入」的规则，将下面的二进制数保留小数点后三位：\u003c/p>\n\u003cul>\u003cli>\u003ccode>101.111100 → ____\u003c/code>\u003c/li>\u003cli>\u003ccode>101.100100 → ____\u003c/code>\u003c/li>\u003c/ul>","answerHtml":"\u003cp>\u003ccode>110.000\u003c/code>；\u003ccode>101.100\u003c/code>\u003c/p>\n\u003cp>均为恰好居中，按「向偶数舍入」：\u003ccode>101.111|100\u003c/code> 末位为 1（奇）→ 进位得 \u003ccode>110.000\u003c/code>；\u003ccode>101.100|100\u003c/code> 末位为 0（偶）→ 保持 \u003ccode>101.100\u003c/code>。\u003c/p>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["110.000","110.0000","110.0"],["101.100","101.1000","101.1"]]}},{"id":"A6","part":"A","num":6,"year":"2025","source":"2025 第一次阶段测验","ref":"","section":"B · 第 3 讲（每空 1 分，共 10 分）","subsection":"","score":"每空 1 分，共 10 分","lec":"L3","lecs":["L3","L2"],"type":"计算 / 综合","tags":["补码","IEEE 754"],"bodyHtml":"\u003cp>在一个 \u003ccode>int\u003c/code> 类型为 32 位补码表示的机器上运行程序。\u003ccode>float\u003c/code> 类型的值使用 32 位 IEEE 格式，而 \u003ccode>double\u003c/code> 类型的值使用 64 位 IEEE 格式，该机器上没有 80 位扩展精度。以下 C 代码产生随机整数 x、y、z，并把它们转换成 \u003ccode>double\u003c/code> 类型的值：\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>int x = random();\nint y = random();\nint z = random();\ndouble dx = (double) x;\ndouble dy = (double) y;\ndouble dz = (double) z;\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>对于下列的每个 C 表达式，指出表达式是否总是为 \u003ccode>True\u003c/code>。若为「否」，给出简要说明。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>表达式\u003c/th>\u003cth>是否恒为真\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A. \u003ccode>(float) x == (float) dx\u003c/code>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B. \u003ccode>(dx + dy) + dz == dx + (dy + dz)\u003c/code>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C. \u003ccode>(dx * dy) * dz == dx * (dy * dz)\u003c/code>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D. \u003ccode>dx/dx == dz/dz\u003c/code>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","answerHtml":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>表达式\u003c/th>\u003cth>是否恒为真\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A. \u003ccode>(float) x == (float) dx\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>int 转 double 精确，再转 float 与直接转 float 结果一致\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B. \u003ccode>(dx + dy) + dz == dx + (dy + dz)\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>三个 int 转成的 double 都能精确表示，和也精确\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C. \u003ccode>(dx * dy) * dz == dx * (dy * dz)\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>浮点乘法不满足结合律，乘积累积会超出 53 位精度而舍入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D. \u003ccode>dx/dx == dz/dz\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>x 或 z 可能为 0，\u003ccode>0.0/0.0\u003c/code> 为 NaN，NaN ≠ NaN\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","ansKind":"官方答案","auto":null},{"id":"A7","part":"A","num":7,"year":"2025","source":"2025 第一次阶段测验","ref":"","section":"C · 第 4 讲（每空 1 分，共 6 分）","subsection":"","score":"每空 1 分，共 6 分","lec":"L4","lecs":["L4"],"type":"填空 / 补全","tags":[],"bodyHtml":"\u003cp>x86-64 的通用寄存器中，对应 \u003ccode>rbx\u003c/code> 低 32 位的寄存器名称为：____；对应 \u003ccode>rcx\u003c/code> 最低字节的寄存器名称为：____。\u003c/p>","answerHtml":"\u003cp>\u003ccode>ebx\u003c/code>；\u003ccode>cl\u003c/code>\u003c/p>","ansKind":"官方答案","auto":{"type":" -&gt;y = v1 + v2;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>为 \u003ccode>setVal\u003c/code> 产生如下汇编代码（x86-64 System V 调用约定）：\u003c/p>\n\u003cdiv class=\"code-block lang-asm\">\u003cdiv class=\"code-lang\">x86-64 ASM\u003c/div>\u003cpre>\u003ccode># p in %rdi, q in %rsi\nsetVal:\n    movslq 8(%rsi), %rax\n    addq   32(%rsi), %rax\n    movq   %rax, 184(%rdi)\n    ret\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>求 A 和 B 的值：A = ____，B = ____\u003c/p>","answerHtml":"\u003cp>A = \u003ccode>9\u003c/code>，B = \u003ccode>5\u003c/code>\u003c/p>\n\u003cul>\u003cli>\u003ccode>str1\u003c/code>：\u003ccode>y\u003c/code> 偏移 184 ⇒ \u003ccode>align(A×B×4, 8) = 184\u003c/code> ⇒ \u003ccode>A×B×4 = 180\u003c/code> ⇒ \u003ccode>A×B = 45\u003c/code>。\u003c/li>\u003cli>\u003ccode>str2\u003c/code>：\u003ccode>t\u003c/code> 偏移 8 ⇒ \u003ccode>align(B, 4) = 8\u003c/code> ⇒ \u003ccode>5 ≤ B ≤ 8\u003c/code>；\u003ccode>u\u003c/code> 偏移 32 ⇒ \u003ccode>align(12 + 2A, 8) = 32\u003c/code> ⇒ \u003ccode>7 ≤ A ≤ 10\u003c/code>。\u003c/li>\u003cli>结合 \u003ccode>A×B = 45\u003c/code> 得 A = 9, B = 5。\u003c/li>\u003c/ul>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["9"],["5"]]}},{"id":"A22","part":"A","num":22,"year":"2025","source":"2025 第一次阶段测验","ref":"","section":"F · 第 7 讲（每空 2 分，共 20 分）","subsection":"","score":"每空 2 分，共 20 分","lec":"L7","lecs":["L7","L4","L3"],"type":"填空 / 补全","tags":[],"bodyHtml":"\u003cp>考虑下面的 C 语言代码和对应的汇编语言代码：\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>double mix_compute(long *a, double *b, float c) {\n    double result = *a + *b + c;\n    return result;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"code-block lang-asm\">\u003cdiv class=\"code-lang\">x86-64 ASM\u003c/div>\u003cpre>\u003ccode>mix_compute:\n    movsd (%rsi), %xmm1\n    movq (%rdi), %rax\n    cvtsi2sd %rax, %xmm2\n    addsd %xmm1, %xmm2\n    cvtss2sd %xmm0, %xmm0\n    addsd %xmm2, %xmm0\n    ret\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>代码中的下列变量，分别在哪个寄存器中：\u003ccode>b:____ c:____ result:____\u003c/code>\u003c/p>","answerHtml":"\u003cp>\u003ccode>b:%rsi\u003c/code>；\u003ccode>c:%xmm0\u003c/code>；\u003ccode>result:%xmm0\u003c/code>\u003c/p>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["b:%rsi"],["c:%xmm0"],["result:%xmm0"]],"labels":["1","2","3"]}},{"id":"A23","part":"A","num":23,"year":"2025","source":"2025 第一次阶段测验","ref":"","section":"G · 第 8 讲（每空 2 分，共 8 分）","subsection":"","score":"每空 2 分，共 8 分","lec":"L8","lecs":["L8","L2","L7"],"type":"填空 / 补全","tags":["大端法","union"],"bodyHtml":"\u003cp>考虑下面的 C 语言代码：\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>union {\n    unsigned char c[8];\n    unsigned int i[2];\n} dw;\nint j;\nfor (j = 0; j &lt; 8; j++)\n    dw.c[j] = 0xC0 + j;\nprintf(&quot;Ints 0-1 == [0x%x,0x%x]\\n&quot;, dw.i[0], dw.i[1]);\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>如果在大端模式的计算机（如 Sun）上运行，输出结果是：____\u003c/p>","answerHtml":"\u003cp>\u003ccode>Ints 0-1 == [0xC0C1C2C3,0xC4C5C6C7]\u003c/code>\u003c/p>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["Ints 0-1 == [0xC0C1C2C3,0xC4C5C6C7]","Ints 0-1 == [0xc0c1c2c3,0xc4c5c6c7]"]]}},{"id":"A24","part":"A","num":24,"year":"2025","source":"2025 第一次阶段测验","ref":"","section":"G · 第 8 讲（每空 2 分，共 8 分）","subsection":"","score":"每空 2 分，共 8 分","lec":"L8","lecs":["L8"],"type":"填空 / 补全","tags":["缓冲区溢出","金丝雀","地址随机化"],"bodyHtml":"\u003cp>课上讲授了防御或者避免缓冲区攻击的几种主要方法，分析它们的特点。以普遍性情况为准，不用考虑少见的软硬件需求。（每行算作一空）\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>方法\u003c/th>\u003cth>是否需要修改用户程序源代码？\u003c/th>\u003cth>是否需要重新编译用户程序？\u003c/th>\u003cth>是否需要更换新的 CPU 硬件？\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>使用 \u003ccode>fgets()\u003c/code> 等安全的库函数\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>栈初始位置随机化\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>在内存访问权限上设置「可执行」位\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>「金丝雀」（哨兵）机制\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>","answerHtml":"\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>方法\u003c/th>\u003cth>改源码？\u003c/th>\u003cth>重新编译？\u003c/th>\u003cth>换 CPU 硬件？\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>使用 \u003ccode>fgets()\u003c/code> 等安全的库函数\u003c/td>\u003ctd>是\u003c/td>\u003ctd>是\u003c/td>\u003ctd>否\u003c/td>\u003c/tr>\u003ctr>\u003ctd>栈初始位置随机化\u003c/td>\u003ctd>否\u003c/td>\u003ctd>否\u003c/td>\u003ctd>否\u003c/td>\u003c/tr>\u003ctr>\u003ctd>在内存访问权限上设置「可执行」位\u003c/td>\u003ctd>否\u003c/td>\u003ctd>否\u003c/td>\u003ctd>是\u003c/td>\u003c/tr>\u003ctr>\u003ctd>「金丝雀」（哨兵）机制\u003c/td>\u003ctd>否\u003c/td>\u003ctd>是\u003c/td>\u003ctd>否\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["是"],["是"],["否"],["否"],["否"],["否"],["否"],["否"],["是"],["否"],["是"],["否"]],"note":"按题面表格顺序：每行「是否需要改源码 / 重新编译 / 换硬件」"}},{"id":"B1","part":"B","num":1,"year":"2024","source":"2024 期中","ref":"2024 期中 · 选择题 1","section":"2024 期中","subsection":"选择题","score":"","lec":"L2","lecs":["L2","L4"],"type":"选择题","tags":[],"bodyHtml":"\u003cp>在 x86-64 机器上，产生随机的 32 位有符号整数 x 和 y，则下列表达式中\u003cstrong>不恒为真\u003c/strong>的是：\u003c/p>","answerHtml":"\u003cp>\u003cstrong>C\u003c/strong>。反例 x = Tmin, y = 0。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["C"],"options":[{"key":"A","text":"((x >> 1) \u003c\u003c 1) \u003c= x"},{"key":"B","text":"((x | -x) >> 31) + 1 == !x"},{"key":"C","text":"(-x \u003c y) == (-y \u003c x)"},{"key":"D","text":"(x ^ y ^ ((~x) – y)) == (y ^ x ^ ((~y) – x))"}]}},{"id":"B2","part":"B","num":2,"year":"2024","source":"2024 期中","ref":"2024 期中 · 选择题 2","section":"2024 期中","subsection":"选择题","score":"","lec":"L2","lecs":["L2","L4"],"type":"计算 / 综合","tags":[],"bodyHtml":"\u003cp>在 x86-64 机器上运行如下代码，输出是：\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>char A[12] = &quot;19260817&quot;;\nchar B[12] = &quot;20241104&quot;;\nvoid *x = (void *)&amp;A;\nvoid *y = 2 + (void *)&amp;B;\nunsigned short P = *(unsigned short *)x;\nunsigned short Q = *(unsigned short *)y;\nprintf(&quot;0x%04x&quot;, (unsigned short)(P - Q));\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>提示：\u003ccode>'0'…'9'\u003c/code> 的 ASCII 码分别是 \u003ccode>0x30…0x39\u003c/code>。\u003c/p>","answerHtml":"\u003cp>\u003cstrong>B\u003c/strong>。小端法下 \u003ccode>P = 0x3931\u003c/code>、\u003ccode>Q = 0x3430\u003c/code>（\u003ccode>y\u003c/code> 相对 \u003ccode>&amp;B\u003c/code> 偏移 2 字节），差值 \u003ccode>0x04FF\u003c/code>。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["B"],"options":[{"key":"A","text":"0xff05"},{"key":"B","text":"0x04ff"},{"key":"C","text":"0x0822"},{"key":"D","text":"0x0800"}]}},{"id":"B3","part":"B","num":3,"year":"2024","source":"2024 期中","ref":"2024 期中 · 选择题 3","section":"2024 期中","subsection":"选择题","score":"","lec":"L3","lecs":["L3"],"type":"选择题","tags":["阶码/偏置"],"bodyHtml":"\u003cp>标准 \u003ccode>float\u003c/code> 共 32 位，阶码字段 k = 8 位、小数字段 n = 23 位。若维持总位数不变、把阶码字段改为 k' = 10 位，则下列说法中正确的是：\u003c/p>","answerHtml":"\u003cp>\u003cstrong>A\u003c/strong>。阶码位数增加、小数位数减少，可表示的 NaN 数量减少，因此能表示的实数值增多。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["A"],"options":[{"key":"A","text":"修改后能表示的实数值的数量更多了"},{"key":"B","text":"修改后能表示的实数值的数量不变"},{"key":"C","text":"修改后能表示的实数值的数量更少了"},{"key":"D","text":"无法确定"}]}},{"id":"B4","part":"B","num":4,"year":"2024","source":"2024 期中","ref":"2024 期中 · 选择题 4","section":"2024 期中","subsection":"选择题","score":"","lec":"L7","lecs":["L7","L3","L4"],"type":"计算 / 综合","tags":["sizeof"],"bodyHtml":"\u003cp>在 x86-64 + Linux 下运行如下代码，四个输出之和为：\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>struct student { int id; char name[6]; short age; char gender; float score; };\nint main() {\n    struct student s;\n    struct student* (*p[8])[4];\n    printf(&quot;%lu\\n&quot;, sizeof(s));\n    printf(&quot;%lu\\n&quot;, sizeof(**p));\n    printf(&quot;%lu\\n&quot;, (char*)&amp;p[2] - (char*)p);\n    printf(&quot;%lu\\n&quot;, &amp;p[4] - p);\n    return 0;\n}\u003c/code>\u003c/pre>\u003c/div>","answerHtml":"\u003cp>\u003cstrong>A\u003c/strong>（72）。\u003c/p>\n\u003cp>\u003ccode>student\u003c/code> 对齐后 \u003ccode>4 + 6 + 2 + 1(+3) + 4 = 20\u003c/code>；\u003ccode>**p\u003c/code> 是 4 个 \u003ccode>student*\u003c/code>，\u003ccode>sizeof(**p) = 32\u003c/code>；\u003ccode>(char*)&amp;p[2] - (char*)p = 16\u003c/code>；\u003ccode>&amp;p[4] - p = 4\u003c/code>；合计 72。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["A"],"options":[{"key":"A","text":"72"},{"key":"B","text":"48"},{"key":"C","text":"56"},{"key":"D","text":"84"}]}},{"id":"B5","part":"B","num":5,"year":"2024","source":"2024 期中","ref":"2024 期中 · 选择题 5","section":"2024 期中","subsection":"选择题","score":"","lec":"L6","lecs":["L6","L4","L8"],"type":"选择题","tags":["参数传递"],"bodyHtml":"\u003cp>下述关于 x86-64 的栈结构说法错误的是：\u003c/p>","answerHtml":"\u003cp>\u003cstrong>C\u003c/strong>。参数 7 是\u003cstrong>最后\u003c/strong>压栈的。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["C"],"options":[{"key":"A","text":"被调用者保存寄存器包括 %rbp %rbx %r12 %r13 %r14 %r15"},{"key":"B","text":"过程的返回地址属于调用者的帧栈"},{"key":"C","text":"过程传参时，参数 1~6 通过寄存器传递，在参数构造区中存放其他参数，其中参数 7 最先压栈"},{"key":"D","text":"call 指令的执行过程是：先将下一条指令的地址压栈，随后将 PC 设为目标地址"}]}},{"id":"B6","part":"B","num":6,"year":"2024","source":"2024 期中","ref":"2024 期中 · 选择题 6","section":"2024 期中","subsection":"选择题","score":"","lec":"L8","lecs":["L8","L5","L4","L6"],"type":"选择题","tags":["条件码","缓冲区溢出","金丝雀","地址随机化"],"bodyHtml":"\u003cp>下述说法错误的是：\u003c/p>","answerHtml":"\u003cp>\u003cstrong>C\u003c/strong>。返回时应先用 \u003ccode>xorq\u003c/code> 比较，再用 \u003ccode>je\u003c/code> 跳转。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["C"],"options":[{"key":"A","text":"我们可以使用安全的函数编写程序如 fgets strncpy 指定每次读取的字节数来避免缓冲区溢出，对抗攻击"},{"key":"B","text":"可以使用地址随机化来随机化程序的内存布局，从而使得攻击代码的位置不再确定，但此处存在权衡：随机的范围必须足够大才足以对抗攻击，但又要足够小避免浪费太多程序空间"},{"key":"C","text":"可以在过程开始时，从一个特殊的只读段中获取一个金丝雀值放入栈中，在函数返回时，先使用 cmpq 指令来进行比较，随后使用 jle 指令来根据条件码跳转"},{"key":"D","text":"可以限制哪些内存页内的数据可以当做代码来执行，检查一个页是否可以执行是由硬件来完成的，效率上没有损失"}]}},{"id":"B7","part":"B","num":7,"year":"2024","source":"2024 期中","ref":"2024 期中 · 选择题 7","section":"2024 期中","subsection":"选择题","score":"","lec":"L6","lecs":["L6","L7","L4"],"type":"选择题","tags":["结构体","栈帧","参数传递"],"bodyHtml":"\u003cp>在作业题中考察过 GCC 为一个参数和返回值都是结构体的函数产生的汇编代码，此时参数和返回值都是通过栈传递的。以下有关说法错误的是：\u003c/p>","answerHtml":"\u003cp>\u003cstrong>C\u003c/strong>。返回的结构体实际存放在\u003cstrong>调用者\u003c/strong>的栈帧中。\u003c/p>","ansKind":"官方答案","auto":{"type":"choice","mode":"single","answer":["C"],"options":[{"key":"A","text":"返回的结构体的地址被存放在 %rax 寄存器中"},{"key":"B","text":"虽然参数是通过栈传递的，但这里依旧使用到了 %rdi"},{"key":"C","text":"返回的结构体实际上是存放在被调用者的栈帧当中"},{"key":"D","text":"如果结构体很小的话，GCC 可能会直接用寄存器来传输参数和返回值"}]}},{"id":"B8","part":"B","num":8,"year":"2024","source":"2024 期中","ref":"2024 期中 · 选择题 8","section":"2024 期中","subsection":"选择题","score":"","lec":"L5","lecs":["L5","L4"],"type":"选择题","tags":[],"bodyHtml":"\u003cp>在 x86-64 中，关于 GCC 对 read1 和 read2 编译的结果，下列说法正确的是：\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>long read1(long *xp) {        long read2(long *xp) {\n    return (xp ? *xp:0);          if (xp) return *xp;\n}                                 else return 0;\n                              }\u003c/code>\u003c/pre>\u003c/div>","answerHtml":"\u003cp>\u003cstrong>A\u003c/strong>。原卷解析指出二者都编译为跳转指令（不含 \u003ccode>cmov\u003c/code>），故无 NULL 隐患、行为与效率一致；B、C、D 均不成立。\u003c/p>","ansKind":"官方答案（含修订）","auto":{"type":"choice","mode":"single","answer":["A"],"options":[{"key":"A","text":"read1 和 read2 的功能一致，并且编译的汇编代码结果也一致"},{"key":"B","text":"read1 在运行时具有安全隐患，当 xp 的值为 NULL 时会导致错误"},{"key":"C","text":"read2 由于可能出现分支预测错误，所以比 read1 的效率更低"},{"key":"D","text":"对于 cmove(%rdi), %rax 这条指令来说，如果 ZF 为 0，那么就不会报错"}]}},{"id":"B9","part":"B","num":9,"year":"2024","source":"2024 期中","ref":"2024 期中 · 第二大题 1","section":"2024 期中","subsection":"第二大题（15 分）：GCC 内联汇编","score":"","lec":"L3","lecs":["L4","L3"],"type":"选择题","tags":["IEEE 754","内联汇编"],"bodyHtml":"\u003cp>下列运行在 x86-64 机器上的 C 代码展示了一个使用内联汇编的例子：\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>float *p = 0x7ffc3608bf40;\nfloat value;\n/* inline assembly starts */\n__asm__ __volatile__(\n    &quot;vmovss (%1), %0&quot;\n    : &quot;=x&quot;(value)\n    : &quot;r&quot;(p)\n);\n/* inline assembly ends */\nprintf(&quot;%.2f\\n&quot;, value);\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>这段代码通过在 C 代码中插入浮点指令 vmovss（Vector Move Scalar Single-Precision Floating-Point）将内存地址 \u003ccode>0x7ffc3608bf40\u003c/code> 处的浮点数数据读取到 float 类型的变量 value 中。\u003c/p>\n\u003col>\u003cli>\u003cp>（2 分）请判断以下说法是否正确（填「是」或「否」）：\u003c/p>\n\u003col>\u003cli>这段代码也可以在任何不是 x86-64 的机器上编译、运行。（ ）\u003c/li>\u003cli>插入的内联汇编代码的效果等同于语句 \u003ccode>value = *p;\u003c/code>。（ ）\u003c/li>\u003c/ol>\u003c/li>\u003cli>（2 分）若内存中从地址 \u003ccode>0x7ffc3608bf40\u003c/code> 开始的 4 个字节的十六进制表示依次为 \u003ccode>00 00 70 40\u003c/code>，且浮点数的编码方式遵循 IEEE-754 标准，则这段代码的输出为 ____。\u003c/li>\u003c/ol>","answerHtml":"\u003col>\u003cli>a. 否；b. 是。\u003c/li>\u003cli>\u003ccode>3.75\u003c/code>。（\u003ccode>00 00 70 40\u003c/code> 按小端还原为 \u003ccode>0x40700000\u003c/code> ⇒ \u003ccode>1.875 × 2^1\u003c/code>）\u003c/li>\u003c/ol>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["否"],["是"],["3.75"]]}},{"id":"B10","part":"B","num":10,"year":"2024","source":"2024 期中","ref":"2024 期中 · 第二大题 2","section":"2024 期中","subsection":"第二大题（15 分）：GCC 内联汇编","score":"","lec":"L3","lecs":["L3","L4","L2"],"type":"填空 / 补全","tags":["IEEE 754","规格化数","非规格化数","NaN"],"bodyHtml":"\u003cp>基于 IEEE-754 标准定义一种 8 位浮点数，符号位、阶码位和尾数位长度分别为 1、5、2。\u003c/p>\n\u003col>\u003cli>（4 分）该浮点数格式可表示的\u003cstrong>最大的负非规格化数\u003c/strong>（不考虑 -0）的二进制表示为 ____；可表示的\u003cstrong>最小的正规格化数\u003c/strong>为 ____（填十进制数，无需计算出结果中 2 的幂的值）。\u003c/li>\u003cli>（2 分）只考虑符号位为 0 的情况，表示 NaN 的浮点数有 ____ 个。\u003c/li>\u003c/ol>","answerHtml":"\u003col>\u003cli>\u003ccode>10000001\u003c/code>；\u003ccode>2^-14\u003c/code>。\u003c/li>\u003cli>\u003ccode>3\u003c/code>。\u003c/li>\u003c/ol>\n\u003cp>「最大的负非规格化数」指最接近 0 的负数：\u003ccode>-0.25 × 2^-14\u003c/code>，即 \u003ccode>1 00000 01\u003c/code>。NaN 个数：\u003ccode>exp = 11111\u003c/code>、\u003ccode>frac ≠ 00\u003c/code> ⇒ \u003ccode>2^2 − 1 = 3\u003c/code>。\u003c/p>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["10000001","0b10000001"],["2^-14","2^{-14}"],["3"]]}},{"id":"B11","part":"B","num":11,"year":"2024","source":"2024 期中","ref":"2024 期中 · 第二大题 3","section":"2024 期中","subsection":"第二大题（15 分）：GCC 内联汇编","score":"","lec":"L3","lecs":["L3","L7","L4"],"type":"选择题","tags":["舍入","union"],"bodyHtml":"\u003cp>接第 1 题，现在我们已经将内存中 \u003ccode>0x7ffc3608bf40\u003c/code> 处的浮点数数据读取到了变量 value 中，下面的 C 代码使用联合（union）对 value 进行类型转换。\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>union { float f; int i; } converter;\nconverter.f = value;\nprintf(&quot;%d\\n&quot;, converter.i);\u003c/code>\u003c/pre>\u003c/div>\n\u003col>\u003cli>\u003cp>（2 分）请判断以下说法是否正确（填「是」或「否」）：\u003c/p>\n\u003col>\u003cli>这段代码的输出在\u003cstrong>任何情况下\u003c/strong>都和语句 \u003ccode>printf(&quot;%d\\n&quot;, (int)value);\u003c/code> 的输出相同。（ ）\u003c/li>\u003cli>float 转换为 int 有可能发生舍入和溢出，但 int 转换为 float 不会发生舍入，也不会出现溢出。（ ）\u003c/li>\u003c/ol>\u003c/li>\u003cli>（3 分）若第 1 题中读取到 value 中的值为 -1104.5，则 \u003ccode>printf(&quot;%d\\n&quot;, (int)converter.f + (converter.i &gt;&gt; 31));\u003c/code> 的输出为 ____。\u003c/li>\u003c/ol>","answerHtml":"\u003col>\u003cli>a. 否；b. 否。（a 错在 union 取位模式、(int) 取数值；b 错在 int 转 float 也可能舍入）\u003c/li>\u003cli>\u003ccode>-1105\u003c/code>。（\u003ccode>(int)(-1104.5) = -1104\u003c/code>；\u003ccode>converter.i &gt;&gt; 31 = -1\u003c/code>）\u003c/li>\u003c/ol>","ansKind":"官方答案","auto":{"type":"fill","blanks":[["否"],["否"],["-1105"]]}},{"id":"B12","part":"B","num":12,"year":"2024","source":"2024 期中","ref":"2024 期中 · 第三大题","section":"2024 期中","subsection":"第三大题（15 分）：递归函数与汇编补全","score":"","lec":"L6","lecs":["L4","L6","L5"],"type":"填空 / 补全","tags":["参数传递","lea","字符串"],"bodyHtml":"\u003cp>下列 C 代码实现了一个名为 foo 的函数，请阅读并分析该 C 代码及其对应的 x86 汇编代码，补全代码中缺失的部分，并回答相应问题。（注：第（14）题不要求作答。）\u003c/p>\n\u003cdiv class=\"code-block lang-c\">\u003cdiv class=\"code-lang\">C\u003c/div>\u003cpre>\u003ccode>void foo(char *p)\n{\n    int len = strlen(p);\n    char tmp = （1） ;\n    *p = (14) ;\n    (14) = '\\0';\n    if (strlen(p + 1) （2） 1)\n    {\n        （3） ;\n    }\n    (14) = tmp;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"code-block lang-asm\">\u003cdiv class=\"code-lang\">x86-64 ASM\u003c/div>\u003cpre>\u003ccode>0000000000001189 &lt;foo&gt;:\n 1189: f3 0f 1e fa          endbr64\n 118d: 55                   push %rbp\n 118e: 48 89 e5             mov %rsp, （4）\n 1191: 48 83 ec 20          sub $0x20,%rsp\n 1195: 48 89 7d e8          mov %rdi,-0x18(%rbp)\n 1199: 48 8b 45 e8          mov -0x18(%rbp),%rax\n 119d: 48 89 c7             mov %rax,%rdi\n 11a0: e8 db fe ff ff       call &lt;strlen@plt&gt;\n 11a5: 89 45 fc             mov %eax,-0x4(%rbp)\n 11a8: 48 8b 45 e8          mov -0x18(%rbp),%rax\n 11ac: 0f b6 00             movzbl (%rax),%eax\n 11af: 88 45 fb             mov %al,-0x5(%rbp)\n 11b2: 8b 45 fc             mov -0x4(%rbp),%eax\n 11b5: 48 98                cltq\n 11b7: 48 8d 50 ff          lea -0x1(%rax),%rdx\n 11bb: 48 8b 45 e8          mov -0x18(%rbp),%rax\n 11bf: 48 01 d0             add %rdx,%rax\n 11c2: 0f b6 10             movzbl (%rax),%edx\n 11c5: 48 8b 45 e8          mov -0x18(%rbp),%rax\n 11c9: 88 10                m
